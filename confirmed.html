<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPTEPIA — Email confirmé</title>
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#0B1014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1014; --surface:#121A20; --border:#27343E;
    --text:#EEF3F5; --text-muted:#8A9AA5; --accent:#37D69A;
    --ok:#22D39A;
    --font-head:'Sora',sans-serif; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 28px;max-width:400px;width:100%;text-align:center;}
  .check{width:64px;height:64px;border-radius:50%;background:rgba(34,211,154,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  h1{font-family:var(--font-head);font-weight:700;font-size:24px;margin:0 0 10px;}
  p{color:var(--text-muted);font-size:14px;line-height:1.5;margin:0 0 26px;}
  a.btn{display:inline-block;background:linear-gradient(135deg,#95F2A6,#0A9FA0);color:#0B1014;text-decoration:none;font-weight:600;font-size:15px;padding:13px 28px;border-radius:8px;}
</style>
</head>
<body>
  <div class="card">
    <img src="logo-mark.png" alt="OPTEPIA" style="height:64px;width:auto;display:block;margin:0 auto 18px;">
    <div class="check">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22D39A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Adresse confirmée</h1>
    <p>Ton adresse email est confirmée. Tu peux maintenant te connecter à OPTEPIA avec ton email et ton mot de passe.</p>
    <a class="btn" href="https://app.optepia.fr">Ouvrir l'application</a>
  </div>
</body>
</html>
