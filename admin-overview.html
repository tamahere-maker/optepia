<style>
  :root{
    --bg:#0B1014; --surface:#121A20; --surface2:#1A242C; --border:#27343E;
    --text:#EEF3F5; --text-muted:#8A9AA5;
    --accent:#37D69A; --accent-dim:#06A58F; --on-accent:#06150F;
    --brand-grad:linear-gradient(135deg,#95F2A6 0%,#37D69A 50%,#0A9FA0 100%);
    --ok:#37D69A; --warn:#FFB21F; --danger:#FF5468;
    --ok-bg:rgba(55,214,154,.14); --warn-bg:rgba(255,178,31,.14); --danger-bg:rgba(255,84,104,.14);
    --font-head:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;}
  body{padding-bottom:40px;min-height:100vh;background:radial-gradient(900px 380px at 50% -140px,rgba(55,214,154,.10),transparent 70%) no-repeat,var(--bg);}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0 0 4px 0;letter-spacing:-.01em;}
  h1{font-size:21px;} h2{font-size:17px;} h3{font-size:14px;color:var(--text-muted);}
  p{margin:0;} button{font-family:var(--font-body);cursor:pointer;border:none;}
  input{font-family:var(--font-body);}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(11,16,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--brand-grad);opacity:.55;}
  .tb-brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .tb-brand img{width:34px;height:auto;flex-shrink:0;}
  .tb-brand .t{min-width:0;}
  .tb-brand h2{margin:0;display:flex;align-items:center;gap:8px;line-height:1.2;}
  .tag-admin{font-family:var(--font-body);font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--brand-grad);color:var(--on-accent);}
  .topbar small{color:var(--text-muted);font-size:11px;font-weight:500;display:block;margin-top:2px;}
  main{padding:16px;max-width:760px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .card.tap{cursor:pointer;transition:border-color .15s,transform .1s;}
  .card.tap:active{border-color:var(--accent);transform:scale(.995);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}
  .field input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:16px;}
  .field input:focus,.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(55,214,154,.16);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:10px;font-size:14px;font-weight:700;width:100%;}
  .btn-primary{background:var(--brand-grad);color:var(--on-accent);}
  .btn-primary:active{filter:brightness(.92);}
  .btn-primary:disabled{opacity:0.5;}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap;flex-shrink:0;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-ro{background:rgba(138,154,165,.16);color:var(--text-muted);}
  .mono{font-family:var(--font-mono);font-size:13px;}
  .muted{color:var(--text-muted);font-size:13px;}
  .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;}
  .search{margin-bottom:14px;}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-grad);}
  .stat b{font-family:var(--font-head);font-size:28px;display:block;line-height:1.15;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto;}
  .tab{flex-shrink:0;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-muted);background:transparent;}
  .tab.active{background:var(--brand-grad);color:var(--on-accent);font-weight:700;}
  .backlink{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;margin-bottom:14px;font-weight:600;cursor:pointer;}
  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .empty::before{content:"";display:block;width:56px;height:56px;margin:0 auto 14px;background:url(logo-admin-mark.png) center/contain no-repeat;opacity:.18;filter:grayscale(.4);}
  .item-row{padding:10px 0;border-top:1px solid var(--border);}
  .item-row:first-child{border-top:none;}
  .btn.b2{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn.b-danger{background:var(--danger);color:#fff;}
  .btn.sm{width:auto;padding:8px 12px;font-size:12px;border-radius:9px;text-decoration:none;}
  a.btn{text-decoration:none;}
  .btn:disabled{opacity:.45;}
  .navwrap{position:sticky;top:57px;z-index:9;background:rgba(11,16,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 16px;border-bottom:1px solid var(--border);}
  .navwrap .tabs{max-width:728px;margin:0 auto;}
  .navwrap .tab{flex:1;text-align:center;}
  .sel{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px;font-family:var(--font-body);}
  .linkbtn{background:none;color:var(--accent);font-size:12px;font-weight:600;padding:4px 0;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
  .chip{flex-shrink:0;background:var(--surface);color:var(--text-muted);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;}
  .chip.on{background:var(--ok-bg);color:var(--accent);border-color:var(--accent);}
  .ck{width:22px;height:22px;accent-color:#37D69A;flex-shrink:0;}
  .unit-card.selected{border-color:var(--accent);background:linear-gradient(0deg,rgba(55,214,154,.06),rgba(55,214,154,.06)),var(--surface);}
  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(18,26,32,.97);border-top:1px solid var(--accent);backdrop-filter:blur(10px);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .grid2 .field input:disabled{opacity:.6;}
  .alert{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
  .alert:first-of-type{border-top:none;}
  .alert .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--text-muted);}
  .alert.warn .dot{background:var(--warn);} .alert.danger .dot{background:var(--danger);} .alert.info .dot{background:var(--accent-dim);}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(5,8,10,.78);display:flex;align-items:center;justify-content:center;padding:20px;}
  .dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .dlg-b{font-size:14px;line-height:1.5;color:var(--text);}
  .dlg-b p{margin:0 0 8px;}
  .dl{margin:8px 0;padding-left:18px;font-size:13px;}
  .dl li{margin-bottom:8px;}
  .dlg-in{width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:16px;}
  .dlg-act{display:flex;gap:10px;margin-top:16px;}
  .dlg-act .btn{flex:1;}
  .spinner.big{width:30px;height:30px;border-width:3px;border-color:rgba(238,243,245,.25);border-top-color:var(--accent);}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;max-width:90%;text-align:center;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(6,21,15,.3);border-top-color:var(--on-accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-wrap{padding:56px 24px 40px;max-width:400px;margin:0 auto;}
  .lockup{text-align:center;margin-bottom:26px;}
  .lockup img.m{width:92px;height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 22px rgba(55,214,154,.28));}
  .lockup img.w{width:150px;height:auto;display:block;margin:0 auto;}
  .lockup .tag-admin{display:inline-block;margin-top:14px;font-size:10px;padding:4px 9px;}
  .login-sub{text-align:center;margin-bottom:24px;}
  .splash{padding:90px 20px;text-align:center;color:var(--text-muted);}
  .splash img{width:64px;display:block;margin:0 auto 14px;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.45;}}
  .foot-brand{text-align:center;margin-top:26px;opacity:.55;}
  .foot-brand img{width:90px;height:auto;}
</style>

try{

function freshState(){
  return { view:'loading', session:null, isAdmin:false, mfaEnrolled:true, mfaFactor:null,
    units:[], allMembers:[], allEquipment:[], platformStats:null, storageByUnit:{}, userEmails:{},
    billing:{}, unitAct:{}, userAct:[], backups:[], adminLog:null, sqlMissing:false, sqlMsg:'',
    sel:new Set(), sort:'name', filter:'all', unitDetailId:null, unitTab:'materiel', search:'',
    busy:false, error:null, modal:null, modalTyped:'', progress:null };
}
let state = freshState();

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let signedUrlCache = {};
async function resolveSignedUrls(paths){
  const uniq = [...new Set((paths||[]).filter(Boolean))];
  const now = Date.now();
  const need = uniq.filter(p=>!signedUrlCache[p] || signedUrlCache[p].expires < now + 5*60*1000);
  if(need.length===0) return;
  try{
    const { data, error } = await sb.storage.from('registre-materiel').createSignedUrls(need, 3600);
    if(error) throw error;
    let failCount = 0; let firstErr = '';
    (data||[]).forEach(d=>{
      if(d.signedUrl) signedUrlCache[d.path] = { url: d.signedUrl, expires: now + 3600*1000 };
      else { failCount++; if(!firstErr && d.error) firstErr = d.error; }
    });
    if(failCount>0) state.error = `${failCount} lien(s) image non générés${firstErr?' — '+firstErr:''} (droits insuffisants sur ces fichiers ?)`;
  }catch(e){ state.error = "Erreur liens images : " + (e.message||String(e)); }
}
function imgSrc(v){ if(!v) return ''; const cached = signedUrlCache[v]; return cached ? cached.url : ''; }
function imgFallback(imgEl){
  const url = imgEl.src;
  const div = document.createElement('div');
  div.className = 'muted'; div.style.fontSize='11px';
  div.textContent = 'Image indisponible';
  imgEl.replaceWith(div);
}
function fmtDate(d){ if(!d) return '—'; const p=(''+d).slice(0,10).split('-'); if(p.length!==3) return d; return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function daysUntil(d){ if(!d) return null; const t=new Date((''+d).slice(0,10)+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function addYears(d,n){ if(!d) return null; const p=(''+d).slice(0,10).split('-').map(Number); return new Date(p[0]+n,p[1]-1,p[2]).toISOString().slice(0,10); }
function statusOf(e){
  const dfv = daysUntil(e.date_fin_vie);
  if(dfv!==null && dfv<0) return {label:'Hors service', cls:'badge-danger'};
  const controls = e.controls||[];
  const last = controls.length ? controls.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  if(last){
    const dNext = daysUntil(addYears(last.date,1));
    if(dNext!==null && dNext<0) return {label:'Contrôle dépassé', cls:'badge-danger'};
    if(dNext!==null && dNext<30) return {label:'Contrôle proche', cls:'badge-warn'};
  } else { return {label:'Jamais contrôlé', cls:'badge-warn'}; }
  if(dfv!==null && dfv<60) return {label:'Fin de vie proche', cls:'badge-warn'};
  return {label:'Conforme', cls:'badge-ok'};
}

function ago(d){
  if(!d) return null;
  const n = Math.floor((Date.now() - new Date(d).getTime())/86400000);
  if(n<=0) return "aujourd'hui"; if(n===1) return 'hier'; return 'il y a '+n+' j';
}
function daysSince(d){ return d ? Math.floor((Date.now() - new Date(d).getTime())/86400000) : null; }
function isRetry(){ return false; }

/* ---------------- Connexion / 2FA ---------------- */
async function init(){
  if(!sb) return;
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(!session){ state.view='login'; render(); return; }
  await checkAdminAndLoad();
}
async function checkAdminAndLoad(){
  try{
    const { data } = await sb.from('platform_admins').select('user_id').eq('user_id', state.session.user.id).maybeSingle();
    state.isAdmin = !!data;
    if(!state.isAdmin){ state.view='denied'; render(); return; }
    try{
      const aal = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      const d = aal.data || {};
      state.mfaEnrolled = (d.nextLevel==='aal2') || (d.currentLevel==='aal2');
      if(d.nextLevel==='aal2' && d.currentLevel!=='aal2'){
        const f = await sb.auth.mfa.listFactors();
        state.mfaFactor = ((f.data&&f.data.totp)||[]).find(x=>x.status==='verified') || null;
        state.view='mfa'; render(); return;
      }
    }catch(e){ state.mfaEnrolled = false; }
    await loadAll();
    state.view='units';
  }catch(err){ state.error = err.message; state.view='denied'; }
  render();
}
async function doMfa(){
  const code = (document.getElementById('au-code').value||'').trim();
  if(!/^\d{6}$/.test(code)){ showErr('Code à 6 chiffres requis'); return; }
  if(!state.mfaFactor){ showErr('Aucun facteur 2FA trouvé'); return; }
  state.busy=true; render();
  try{
    const ch = await sb.auth.mfa.challenge({ factorId: state.mfaFactor.id });
    if(ch.error) throw ch.error;
    const v = await sb.auth.mfa.verify({ factorId: state.mfaFactor.id, challengeId: ch.data.id, code });
    if(v.error) throw v.error;
  }catch(e){ state.busy=false; showErr(e.message||'Code incorrect'); return; }
  state.busy=false;
  await checkAdminAndLoad();
}

/* ---------------- Chargement ---------------- */
async function loadAll(){
  const [unitsRes, membersRes, equipRes, statsRes, storageRes, emailsRes, billRes, actRes, uactRes, bkRes] = await Promise.all([
    sb.from('units').select('*'),
    sb.from('unit_members').select('*'),
    sb.from('equipment').select('*, controls(*), loans(*)'),
    sb.rpc('get_platform_stats'),
    sb.rpc('get_storage_stats_by_unit'),
    sb.rpc('get_user_emails'),
    sb.from('unit_billing').select('*'),
    sb.rpc('admin_unit_activity'),
    sb.rpc('admin_user_activity'),
    sb.rpc('admin_list_backups')
  ]);
  state.units = (unitsRes.data||[]).sort((a,b)=>a.name.localeCompare(b.name));
  state.allMembers = membersRes.data || [];
  state.allEquipment = equipRes.data || [];
  state.platformStats = (statsRes.data && statsRes.data[0]) || null;
  state.storageByUnit = {};
  (storageRes.data||[]).forEach(row=>{ state.storageByUnit[row.unit_id] = row; });
  state.userEmails = {};
  if(emailsRes.error){ state.error = "Emails indisponibles : " + emailsRes.error.message; }
  else (emailsRes.data||[]).forEach(row=>{ state.userEmails[row.user_id] = row.email; });
  state.sqlMissing = !!(bkRes.error || actRes.error || uactRes.error || billRes.error);
  state.sqlMsg = (bkRes.error||actRes.error||uactRes.error||billRes.error||{}).message || '';
  state.billing = {}; (billRes.data||[]).forEach(r=>{ state.billing[r.unit_id] = r; });
  state.unitAct = {}; (actRes.data||[]).forEach(r=>{ state.unitAct[r.unit_id] = r; });
  state.userAct = uactRes.data || [];
  state.backups = bkRes.data || [];
  state.sel = new Set([...state.sel].filter(id=>state.units.some(u=>u.id===id)));
  const paths = [];
  state.units.forEach(u=>paths.push(u.avatar_url));
  state.allMembers.forEach(m=>paths.push(m.avatar_url));
  state.allEquipment.forEach(e=>paths.push(e.photo_url));
  resolveSignedUrls(paths).then(render);
}
async function loadBackupsOnly(){
  const r = await sb.rpc('admin_list_backups');
  if(!r.error) state.backups = r.data || [];
}
function formatBytes(bytes){
  if(bytes===null || bytes===undefined) return '—';
  if(bytes < 1024) return bytes + ' o';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' Ko';
  if(bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' Mo';
  return (bytes/(1024*1024*1024)).toFixed(2) + ' Go';
}
async function doLogin(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  if(!email || !password){ showErr('Email et mot de passe requis'); return; }
  if(!turnstileToken){ showErr('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password, options:{ captchaToken } });
  state.busy=false;
  if(error){ showErr(error.message); render(); return; }
  state.session = data.session;
  await checkAdminAndLoad();
}
async function doLogout(){
  await sb.auth.signOut();
  state = freshState(); state.view='login';
  render();
}
function showErr(msg){ state.error = msg; render(); setTimeout(()=>{ state.error=null; render(); }, 3500); }

function membersOf(unitId){ return state.allMembers.filter(m=>m.unit_id===unitId); }
function equipmentOf(unitId){ return state.allEquipment.filter(e=>e.unit_id===unitId); }
function allLoansOf(unitId){ return equipmentOf(unitId).flatMap(e=>(e.loans||[]).map(l=>Object.assign({},l,{_equip:e}))); }
function backupsOfUnit(id){ return state.backups.filter(b=>b.unit_id===id); }
function latestBackup(id){ return backupsOfUnit(id).find(b=>b.kind!=='pre-restore') || null; } /* liste déjà triée du plus récent au plus ancien */
function problemsOf(id){ return equipmentOf(id).filter(x=>statusOf(x).cls==='badge-danger').length; }
function isDormant(u){
  const a = state.unitAct[u.id];

/* ---------------- Sauvegardes (client) ---------------- */
const EXISTS_RE = /exist|duplicate|409/i;
async function mirrorFiles(backupId, paths, prefix){
  const total = paths.length; let done=0, failed=0;
  const st = sb.storage.from('registre-materiel');
  for(let i=0;i<paths.length;i+=6){
    await Promise.all(paths.slice(i,i+6).map(async p=>{
      try{
        const { error } = await st.copy(p, p, { destinationBucket:'unit-backups' });
        if(error && !EXISTS_RE.test((error.message||'')+' '+(error.statusCode||'')+' '+(error.status||''))) failed++;
      }catch(e){ failed++; }
      done++;
    }));
    setProgress(`${prefix} — fichiers ${Math.min(done,total)}/${total}`);
  }
  await sb.rpc('admin_set_backup_mirrored', { p_id:backupId, p_ok: failed===0 });
  return { total, failed };
}
async function pruneBackups(){
  const { data, error } = await sb.rpc('admin_prune_backups');
  if(error || !data || !data.length) return;
  const b = sb.storage.from('unit-backups');
  for(let i=0;i<data.length;i+=100) await b.remove(data.slice(i,i+100));
}
async function backupUnits(ids, opts){
  opts = opts || {};
  const res = [];
  setProgress('Sauvegarde des données…');
  const { data, error } = await sb.rpc('admin_backup_units', { p_units:ids, p_label:opts.label||null, p_kind:opts.kind||'manual' });
  if(error) throw new Error(error.message + (/function|schema cache/i.test(error.message)?' — le SQL d\'installation des sauvegardes n\'est pas encore exécuté.':''));
  for(const it of (data||[])){
    const u = state.units.find(x=>x.id===it.unit_id);
    const m = await mirrorFiles(it.backup_id, it.file_paths||[], u?u.name:'Unité');
    res.push({ unit_id:it.unit_id, name:u?u.name:'', backup_id:it.backup_id, total:m.total, failed:m.failed });
  }
  setProgress('Nettoyage des anciennes sauvegardes…');
  await pruneBackups();
  await loadBackupsOnly();
  return res;
}
function backupSummaryHtml(res){
  return '<ul class="dl">'+res.map(r=>`<li><b>${esc(r.name)}</b> — données sauvegardées${r.total?`, ${r.total-r.failed}/${r.total} fichier(s) copié(s)`:''}${r.failed?` <span style="color:var(--danger)">(${r.failed} fichier(s) non copié(s))</span>`:''}</li>`).join('')+'</ul>';
}
function askBackup(ids){

    confirmLabel:'Sauvegarder',

}

/* ---------------- Restauration ---------------- */
function askRestore(backupIds){
  const rows = backupIds.map(id=>state.backups.find(b=>b.id===id)).filter(Boolean);
  if(!rows.length){ showErr('Aucune sauvegarde à restaurer'); return; }
  const li = rows.map(b=>`<li><b>${esc(b.unit_name||'Unité')}</b> — sauvegarde du ${fmtDateTime(b.created_at)}${b.unit_exists?'':' <span class="badge badge-warn">unité supprimée : sera recréée</span>'}<div class="muted" style="font-size:12px;">${countsText(b.counts)}</div></li>`).join('');
  openModal({ title:'Restaurer ?', danger:true, typed:'RESTAURER', confirmLabel:'Restaurer',
    body:`<p>Les données actuelles de ${rows.length>1?'ces unités':'cette unité'} seront <b>remplacées</b> par celles de la sauvegarde.</p><ul class="dl">${li}</ul><p class="muted" style="font-size:12px;">Par sécurité, l'état actuel est d'abord sauvegardé (« avant restauration »). Les comptes supprimés depuis ne sont pas recréés. Aucun e-mail n'est envoyé.</p><p style="font-size:13px;margin-top:10px;">Pour confirmer, tape <b>RESTAURER</b> :</p>`,
    onConfirm:()=>doRestore(rows.map(b=>b.id)) });
}
function askRestoreLatest(unitIds){
  const ids = []; const none = [];
  unitIds.forEach(uid=>{ const b = latestBackup(uid); if(b) ids.push(b.id); else { const u=state.units.find(x=>x.id===uid); none.push(u?u.name:uid); } });
  if(!ids.length){ openInfo('Aucune sauvegarde', `<p>Aucune sauvegarde disponible pour : ${esc(none.join(', '))}.</p>`); return; }
  if(none.length) showErr('Sans sauvegarde (ignorées) : '+none.join(', '));
  askRestore(ids);
}
async function restoreFiles(paths, prefix){
  const src = sb.storage.from('unit-backups');
  let ok=0, there=0, missing=0;
  for(let i=0;i<paths.length;i+=6){
    await Promise.all(paths.slice(i,i+6).map(async p=>{
      try{
        const { error } = await src.copy(p, p, { destinationBucket:'registre-materiel' });
        if(!error) ok++;
        else if(EXISTS_RE.test((error.message||'')+' '+(error.statusCode||'')+' '+(error.status||''))) there++;
        else missing++;
      }catch(e){ missing++; }
    }));
    setProgress(`${prefix} — fichiers ${Math.min(i+6,paths.length)}/${paths.length}`);
  }
  return { ok, there, missing };
}
async function doRestore(ids){
  await runOp('Restauration en cours…', async ()=>{
    const out = [];
    for(const id of ids){
      const b = state.backups.find(x=>x.id===id);
      const name = b ? b.unit_name : 'Unité';
      setProgress(`${name} — restauration des données…`);
      const { data, error } = await sb.rpc('admin_restore_backup', { p_backup_id:id });
      if(error) throw new Error(`${name} : ${error.message}`);
      const f = await restoreFiles(data.file_paths||[], name);
      out.push({ name, data, f });
      delete journalCache[data.unit_id];
    }
    setProgress('Actualisation…');
    await pruneBackups();
    await loadAll();
    return { title:'Restauration terminée', body:'<ul class="dl">'+out.map(o=>`<li><b>${esc(o.name)}</b> — ${countsText(o.data.counts)}${o.f.ok+o.f.there+o.f.missing?`<div class="muted" style="font-size:12px;">Fichiers : ${o.f.ok} remis, ${o.f.there} déjà présents${o.f.missing?`, <span style="color:var(--warn)">${o.f.missing} introuvables dans la copie</span>`:''}</div>`:''}${o.data.members_skipped?`<div class="muted" style="font-size:12px;color:var(--warn)">${o.data.members_skipped} membre(s) non remis (compte supprimé depuis).</div>`:''}</li>`).join('')+'</ul>' };
  });
}

function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function csvCell(v){ v = (v===null||v===undefined)?'':String(v); return /[;"\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(filename, header, rows){
  const txt = '﻿' + [header].concat(rows).map(r=>r.map(csvCell).join(';')).join('\r\n');
  saveBlob(new Blob([txt], {type:'text/csv;charset=utf-8'}), filename);
}
function slug(s){ return (s||'unite').replace(/[^a-z0-9]+/gi,'-').toLowerCase(); }
function exportEquipCsv(unitId){
  const u = state.units.find(x=>x.id===unitId); if(!u) return;
  const rows = equipmentOf(unitId).slice().sort((a,b)=>(a.designation||'').localeCompare(b.designation||'')).map(e=>{
    const last = (e.controls||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    return [e.designation,e.marque,e.famille,e.sous_famille,e.numero_serie,e.identification,fmtDate(e.date_fabrication),fmtDate(e.date_premiere_utilisation),fmtDate(e.date_fin_vie),last?fmtDate(last.date):'',statusOf(e).label];
  });
  downloadCsv(`materiel-${slug(u.name)}-${new Date().toISOString().slice(0,10)}.csv`,
    ['Désignation','Marque','Famille','Sous-famille','N° de série','Identification','Fabrication','1re utilisation','Fin de vie','Dernier contrôle','Statut'], rows);
}
function exportLoansCsv(unitId){
  const u = state.units.find(x=>x.id===unitId); if(!u) return;
  const L = {en_cours:'En cours',en_attente:'En attente',refuse:'Refusé',restitue:'Terminé'};

    fmtDate(l.checkout_date), fmtDate(l.expected_return_date), fmtDate(l.return_date), l.return_condition, l.refusal_reason, l.created_by_name ]);
  downloadCsv(`prets-${slug(u.name)}-${new Date().toISOString().slice(0,10)}.csv`,

}

/* ----- liste des unités ----- */
function visibleUnits(){
  const q = state.search.toLowerCase();
  let list = state.units.filter(u=>!q || u.name.toLowerCase().includes(q));
  const f = state.filter;
  list = list.filter(u=>{
    const b = state.billing[u.id];
    if(f==='essai') return b && b.status==='essai';
    if(f==='impaye') return b && b.status==='impaye';
    if(f==='dormant') return isDormant(u);
    if(f==='problems') return problemsOf(u.id)>0;
    if(f==='nobackup'){ const lb=latestBackup(u.id); return !lb || daysSince(lb.created_at)>7; }
    return true;
  });
  const act = u=>{ const a=state.unitAct[u.id]; return a&&a.last_action_at?new Date(a.last_action_at).getTime():0; };
  const S = {
    name:(a,b)=>a.name.localeCompare(b.name),
    recent:(a,b)=>new Date(b.created_at)-new Date(a.created_at),
    activity:(a,b)=>act(b)-act(a),
    problems:(a,b)=>problemsOf(b.id)-problemsOf(a.id),
    storage:(a,b)=>((state.storageByUnit[b.id]||{}).total_bytes||0)-((state.storageByUnit[a.id]||{}).total_bytes||0)
  };
  return list.sort(S[state.sort]||S.name);
}

  render();
}

  if(!state.mfaEnrolled) A.push({lvl:'warn', t:"Double authentification non activée sur ton compte admin", d:"Active-la dans le profil de l'application : l'accès admin est très sensible."});
  if(s){
    const p = s.storage_total_bytes/(1024*1024*1024);
    if(p>0.7) A.push({lvl:p>0.9?'danger':'warn', t:`Stockage fichiers à ${(p*100).toFixed(0)} % de 1 Go`, d:'Passe en Supabase Pro ou nettoie les fichiers inutiles.'});
    const d = s.db_size_bytes/(500*1024*1024);
    if(d>0.7) A.push({lvl:d>0.9?'danger':'warn', t:`Base de données à ${(d*100).toFixed(0)} % de 500 Mo`, d:'Les sauvegardes automatiques en font partie.'});
  }
  const unconf = state.userAct.filter(u=>!u.email_confirmed && daysSince(u.created_at)>=3).length;
  if(unconf) A.push({lvl:'warn', t:`${unconf} compte(s) jamais confirmé(s) depuis plus de 3 jours`});
  const imp = state.units.filter(u=>(state.billing[u.id]||{}).status==='impaye');
  if(imp.length) A.push({lvl:'danger', t:`${imp.length} unité(s) en impayé`, f:'impaye'});
  const trialSoon = state.units.filter(u=>{ const b=state.billing[u.id]; if(!b||b.status!=='essai'||!b.trial_ends) return false; const n=daysUntil(b.trial_ends); return n!==null && n<=7; });
  if(trialSoon.length) A.push({lvl:'warn', t:`${trialSoon.length} essai(s) se termine(nt) dans 7 jours ou sont expirés`, f:'essai'});
  if(!state.sqlMissing){
    const nb = state.units.filter(u=>{ const lb=latestBackup(u.id); return !lb || daysSince(lb.created_at)>7; });
    if(nb.length) A.push({lvl:'warn', t:`${nb.length} unité(s) sans sauvegarde depuis plus de 7 jours`, f:'nobackup'});
  }
  const dorm = state.units.filter(isDormant);
  if(dorm.length) A.push({lvl:'info', t:`${dorm.length} unité(s) sans activité depuis 30 jours`, f:'dormant'});
  const prob = state.units.filter(u=>problemsOf(u.id)>0);
  if(prob.length) A.push({lvl:'info', t:`${prob.length} unité(s) avec du matériel hors service ou en contrôle dépassé`, f:'problems'});
  if(!A.length) return `<div class="card"><h3 style="color:var(--ok);margin:0;">✓ Rien à signaler</h3></div>`;
  return `<div class="card"><h3 style="color:var(--text);margin-bottom:6px;">À surveiller</h3>${A.map(a=>`
    <div class="alert ${a.lvl}" ${a.f?`onclick="setFilter('${a.f}')" style="cursor:pointer;"`:''}>
      <span class="dot"></span><div><div style="font-size:13px;font-weight:600;">${esc(a.t)}</div>${a.d?`<div class="muted" style="font-size:12px;">${esc(a.d)}</div>`:''}</div>${a.f?'<span class="muted" style="margin-left:auto;">›</span>':''}
    </div>`).join('')}</div>`;
}

async function saveBilling(unitId){
  const v = id=>document.getElementById(id).value;

    seats:num(v('bl-seats')), price_month:num(v('bl-price')), notes:v('bl-notes').trim()||null, updated_at:new Date().toISOString() };
  state.busy=true; render();

  state.billing[unitId] = row;
  const u = state.units.find(x=>x.id===unitId);
  logAdmin('Abonnement modifié', u?u.name:unitId, { status:row.status, plan:row.plan, seats:row.seats, price_month:row.price_month });

function askDeleteUnit(unitId){
  const u = state.units.find(x=>x.id===unitId); if(!u) return;
  openModal({ title:'Supprimer cette unité ?', danger:true, typed:u.name, confirmLabel:'Supprimer',
    body:`<p>Une sauvegarde complète (données + fichiers) est créée automatiquement avant la suppression.</p><p style="font-size:13px;margin-top:10px;">Pour confirmer, tape exactement le nom de l'unité :</p><p><b>${esc(u.name)}</b></p>`,
    onConfirm:()=>runOp('Sauvegarde avant suppression…', async ()=>{
      const res = await backupUnits([unitId], { kind:'pre-delete', label:'Avant suppression' });
      if(!res.length || res[0].failed>0) throw new Error('La sauvegarde des fichiers est incomplète : suppression annulée, rien n\'a été supprimé.');
      setProgress('Suppression de l\'unité…');
      const { error } = await sb.rpc('delete_unit_as_admin', { target_unit_id: unitId });
      if(error) throw error;
      logAdmin('Unité supprimée', u.name, { unit_id:unitId, backup_id:res[0].backup_id });
      state.view='units';
      await loadAll();
      return { title:'Unité supprimée', body:`<p>« ${esc(u.name)} » a été supprimée. Elle reste restaurable depuis l'onglet <b>Sauvegardes</b>.</p>` };
    }) });
}

    body:`<p>Supprimer <b>DÉFINITIVEMENT</b> le compte de <b>${esc(name)}</b> ? Son login disparaît de toutes les unités. L'historique du matériel qu'il a créé/contrôlé reste (nom conservé), mais le compte est irrécupérable.</p><p style="font-size:13px;margin-top:10px;">Pour confirmer, tape <b>SUPPRIMER</b> :</p>`,
    onConfirm:()=>runOp('Suppression du compte…', async ()=>{
      const res = await fetch(FUNCTIONS_URL + '/admin-delete-user', {
        method:'POST',
        headers: { 'Content-Type':'application/json', Authorization:'Bearer ' + state.session.access_token },
        body: JSON.stringify({ targetUserId: userId })
      });
      if(!res.ok) throw new Error(await res.text());
      logAdmin('Compte supprimé', name, { user_id:userId, email:state.userEmails[userId]||null });
      await loadAll();
    }) });
}
function renderUnitLoans(loans){
  if(loans.length===0) return `<div class="empty">Aucun prêt ni mission.</div>`;
  const sorted = loans.slice().sort((a,b)=>(b.checkout_date||'').localeCompare(a.checkout_date||''));
  return `<div class="card">${sorted.map(l=>{
    const statusLabel = l.status==='en_cours'?'En cours':l.status==='en_attente'?'En attente':l.status==='refuse'?'Refusé':'Terminé';
    const cls = l.status==='en_cours'?'badge-ok':l.status==='en_attente'?'badge-warn':l.status==='refuse'?'badge-danger':'badge-ro';
    return `<div class="item-row">
      <div class="row">
        <div>
          <div style="font-weight:600;font-size:14px;">${esc(l.borrower_name)} · ${l.type==='mission'?'Mission':'Prêt'}</div>
          <div class="muted">${esc(l._equip.designation)} · ${fmtDate(l.checkout_date)}</div>
        </div>
        <span class="badge ${cls}">${statusLabel}</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}
let journalCache = {};
function renderUnitJournal(unitId){
  if(!journalCache[unitId]){
    journalCache[unitId] = 'loading';
    sb.from('audit_log').select('*').eq('unit_id', unitId).order('created_at',{ascending:false}).limit(60).then(({data})=>{
      journalCache[unitId] = data || [];
      if(state.view==='unitDetail' && state.unitDetailId===unitId && state.unitTab==='journal') render();
    });
    return `<div class="muted">Chargement…</div>`;
  }
  if(journalCache[unitId]==='loading') return `<div class="muted">Chargement…</div>`;
  const entries = journalCache[unitId];
  if(entries.length===0) return `<div class="empty">Aucune action enregistrée.</div>`;
  return `<div class="card">${entries.map(j=>`
    <div class="item-row">
      <div class="row"><b style="font-size:13px;">${esc(j.action)}</b><span class="muted" style="font-size:11px;">${fmtDateTime(j.created_at)}</span></div>
      <p class="muted" style="font-size:12px;margin-top:2px;">${esc(j.user_name)}${j.target_label?' · '+esc(j.target_label):''}</p>
    </div>`).join('')}</div>`;
}

/* ----- onglet Sauvegardes ----- */
function renderBackupsView(){
  if(state.sqlMissing) return `<div class="card" style="border-color:var(--warn);"><h3 style="color:var(--warn);">Installation requise</h3><p class="muted" style="font-size:12px;margin-top:6px;">Exécute d'abord le SQL « sauvegardes » dans Supabase.${state.sqlMsg?' ('+esc(state.sqlMsg)+')':''}</p></div>`;
  const deleted = []; const seen = new Set();
  state.backups.filter(b=>b.unit_exists===false && b.kind!=='pre-restore').forEach(b=>{ if(!seen.has(b.unit_id)){ seen.add(b.unit_id); deleted.push(b); } });
  const totalBytes = state.backups.reduce((s,b)=>s+(b.files_bytes||0),0);
  return `
  <h1 style="margin-bottom:12px;">Sauvegardes</h1>
  <div class="card">
    <p class="muted" style="font-size:12px;">Chaque nuit, une sauvegarde automatique des données est faite pour chaque unité modifiée (7 conservées). Les sauvegardes manuelles (10 conservées) incluent aussi une copie des photos et signatures. Avant une restauration ou une suppression, l'état actuel est sauvegardé.</p>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="askBackupAll()">Sauvegarder toutes les unités</button>
  </div>
  ${deleted.length?`<div class="card" style="border-color:var(--warn);"><h3 style="color:var(--warn);margin-bottom:6px;">Unités supprimées restaurables</h3>${deleted.map(b=>renderBackupRow(b,true)).join('')}</div>`:''}
  <h3 style="margin:16px 0 8px;">Toutes les sauvegardes (${state.backups.length})</h3>
  ${state.backups.length?`<div class="card">${state.backups.map(b=>renderBackupRow(b,true)).join('')}</div>`:`<div class="empty">Aucune sauvegarde.</div>`}
  <p class="muted" style="font-size:11px;text-align:center;">Données de sauvegarde conservées : ${state.backups.length} · fichiers référencés : ${formatBytes(totalBytes)}</p>`;
}

/* ----- onglet Journal admin ----- */
async function loadLog(){
  const { data, error } = await sb.rpc('admin_list_log', { p_limit:150 });
  state.adminLog = error ? [] : (data||[]);
  if(error) state.error = error.message;
  if(state.view==='log') render();
}
function renderLogView(){
  if(state.sqlMissing) return `<div class="card" style="border-color:var(--warn);"><h3 style="color:var(--warn);">Installation requise</h3><p class="muted" style="font-size:12px;margin-top:6px;">Exécute d'abord le SQL « sauvegardes » dans Supabase.</p></div>`;
  if(!state.adminLog) return `<div class="muted">Chargement…</div>`;
  if(!state.adminLog.length) return `<h1>Journal admin</h1><div class="empty">Aucune action enregistrée.</div>`;
  return `<h1 style="margin-bottom:4px;">Journal admin</h1><p class="muted" style="margin-bottom:12px;">Toutes les actions sensibles effectuées depuis cette console.</p>
  <div class="card">${state.adminLog.map(j=>`
    <div class="item-row">
      <div class="row"><b style="font-size:13px;">${esc(j.action)}</b><span class="muted" style="font-size:11px;">${fmtDateTime(j.created_at)}</span></div>
      <p class="muted" style="font-size:12px;margin-top:2px;">${esc(j.target||'')}${j.admin_email?' · '+esc(j.admin_email):''}</p>
    </div>`).join('')}</div>`;
}

init();
</script>
