<style>
  :root{
    --bg:#0B1014; --surface:#121A20; --surface2:#1A242C; --border:#27343E;
    --text:#EEF3F5; --text-muted:#8A9AA5; --accent:#37D69A; --accent-dim:#06A58F;
    --ok:#22D39A; --warn:#FFB21F; --danger:#FF5468;
    --on-accent:#0B1014; --brand-grad:linear-gradient(135deg,#95F2A6 0%,#37D69A 50%,#0A9FA0 100%);
    --ok-bg:rgba(34,211,154,0.15); --warn-bg:rgba(255,178,31,0.16); --danger-bg:rgba(255,84,104,0.16);
    --font-head:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"]{
    --bg:#F3F6F7; --surface:#FFFFFF; --surface2:#E8EEF0; --border:#D3DCE1;
    --text:#0F1A20; --text-muted:#5A6A74; --accent:#0A8068; --accent-dim:#07665A;
    --ok:#0C8A63; --warn:#A86A00; --danger:#C4243A; --on-accent:#FFFFFF;

  }
  .hd-avatars{position:relative;width:56px;height:52px;flex-shrink:0;margin-left:12px;cursor:pointer;}
  .hd-team{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .hd-logo{height:30px;width:auto;flex-shrink:0;margin-left:10px;opacity:.95;}
  @media (max-width:340px){.hd-logo{display:none;}}
  .hd-team.hd-fallback img{height:62%;width:auto;}
  .hd-me{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);background:var(--surface2);box-shadow:0 1px 4px rgba(0,0,0,.35);}
  .hd-dot{background:var(--brand-grad);color:var(--on-accent);font-size:10px;font-weight:700;font-family:var(--font-head);display:flex;align-items:center;justify-content:center;}
  .sheet-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;}
  .sheet-box{width:100%;max-width:480px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;}
  .crop-ov{position:fixed;inset:0;z-index:210;background:rgba(5,8,10,.96);display:flex;align-items:center;justify-content:center;overflow:auto;}
  .crop-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;width:100%;max-width:420px;}
  .crop-stage{position:relative;overflow:hidden;background:#000;border-radius:6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;}
  .crop-stage img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none;}
  .crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.62);border:2px solid rgba(255,255,255,.85);pointer-events:none;}
  .crop-zoom{width:100%;accent-color:#37D69A;}
  .crop-mask.rect{border-radius:6px;}
  .crop-ratios{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .crop-ratios .chip.on{background:var(--ok-bg);color:var(--accent);border-color:var(--accent);}
  .logo-wm{display:block;height:auto;}
  :root[data-theme="light"] .logo-wm{filter:brightness(0) saturate(100%);opacity:.9;}
  .pw-rules{margin:8px 0 2px;padding:0;list-style:none;font-size:12px;color:var(--text-muted);}
  .pw-rules li{display:flex;align-items:center;gap:8px;padding:2px 0;transition:color .15s;}
  .pw-rules .box{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:transparent;flex-shrink:0;transition:all .15s;}
  .pw-rules li.ok{color:var(--ok);}
  .pw-rules li.ok .box{background:var(--ok);border-color:var(--ok);color:#fff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;}
  body{padding-bottom:calc(120px + env(safe-area-inset-bottom));min-height:100vh;}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;letter-spacing:0.2px;margin:0 0 4px 0;}
  h1{font-size:24px;} h2{font-size:18px;} h3{font-size:15px;color:var(--text-muted);font-weight:600;}
  p{margin:0;} a{color:var(--accent);}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  input,select,textarea{font-family:var(--font-body);}
  .acc-banner{padding:9px 16px;font-size:12.5px;line-height:1.4;border-bottom:1px solid var(--border);}
  .acc-ro{background:rgba(220,60,60,.14);color:var(--text);}
  .acc-warn{background:rgba(240,170,40,.16);color:var(--text);}
  .acc-info{background:rgba(80,140,220,.12);color:var(--text);}
  .topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px 9px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{display:flex;flex-direction:row;align-items:center;}
  .topbar .brand small{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px 6px 6px;cursor:pointer;}
  .user-dot{width:26px;height:26px;border-radius:50%;background:var(--brand-grad);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-head);flex-shrink:0;}
  .user-chip .role{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;display:block;}
  .user-chip .name{font-size:13px;font-weight:600;}
  main{padding:16px;padding-bottom:32px;max-width:640px;margin:0 auto;}
  main.wide{max-width:1280px;}
  main.selpad{padding-bottom:130px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px;align-items:stretch;}
  .grid>.card{margin-bottom:0;}
  .list-sticky{position:sticky;top:var(--tb,56px);z-index:6;background:var(--bg);padding:6px 0 8px;margin:-6px 0 6px;}
  .filter-chips.wrap{flex-wrap:wrap;overflow:visible;}
  .sel-bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:12;background:var(--surface2);border-top:1px solid var(--accent);padding:9px 14px;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .chip:disabled{opacity:.4;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  .eqt{width:100%;border-collapse:collapse;font-size:13px;}
  .eqt th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border);}
  .eqt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .eqt tbody tr{cursor:pointer;} .eqt tbody tr:hover{background:var(--surface);} .eqt tbody tr.sel{background:var(--ok-bg);}
  @media(max-width:699px){.desk-only{display:none;}}
  .sheet{background:#fff;color:#111;border-radius:8px;padding:22px;margin-bottom:24px;font-size:13px;line-height:1.45;}
  .sheet-t{width:100%;border-collapse:collapse;margin-bottom:4px;}
  .sheet-t th,.sheet-t td{border:1px solid #c8c8c8;padding:6px 8px;text-align:left;vertical-align:top;}
  .sheet-t th{background:#f2f2f2;font-weight:600;}
  @media print{
    html,body{background:#fff !important;height:auto !important;min-height:0 !important;overflow:visible !important;padding-bottom:0 !important;}
    .topbar,.navbar,.noprint,.toast{display:none !important;}
    main{padding:0 !important;max-width:none !important;}
    .sheet{border-radius:0;padding:0;margin:0;}
  }
  .acc{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .acc>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;-webkit-tap-highlight-color:transparent;}
  .acc>summary::-webkit-details-marker{display:none;}
  .acc>summary::after{content:'›';color:var(--text-muted);font-size:20px;line-height:1;transition:transform .15s;margin-left:10px;}
  .acc>summary>span:first-child{flex:1;}
  .acc[open]>summary::after{transform:rotate(90deg);}
  .acc-body{padding:2px 16px 16px;}
  .acc-body .card{background:var(--surface2);}
  .acc-body>.card:last-child{margin-bottom:0;}
  .acc-body .mfa-title{display:none;}
  .nt-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .nt-row:last-of-type{border-bottom:0;}
  .nt-row .nt-txt{flex:1;min-width:0;}
  .nt-row .nt-lbl{font-weight:600;font-size:14px;}
  .nt-row .nt-desc{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
  .nt-sw{position:relative;width:46px;height:26px;flex-shrink:0;}
  .nt-sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:2;}
  .nt-sw span{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--border);border-radius:13px;transition:.15s;}
  .nt-sw span::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-muted);transition:.15s;}
  .nt-sw input:checked+span{background:var(--accent);border-color:var(--accent);}
  .nt-sw input:checked+span::after{left:22px;background:#0B1014;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
  .card.tap{cursor:pointer;transition:border-color .15s;}
  .card.tap:active{border-color:var(--accent);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 12px;font-size:15px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;width:100%;}
  .btn-primary{background:var(--brand-grad);color:var(--on-accent);} .btn-primary:active{filter:brightness(.9);}
  .btn-primary:disabled{opacity:0.5;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--accent);padding:10px;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:110px;}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:20px;font-weight:700;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .mono{overflow-wrap:anywhere;font-family:var(--font-mono);font-size:13px;letter-spacing:0.3px;}
  .muted{color:var(--text-muted);font-size:13px;}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:contain;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;}
  .thumb-lg{width:100%;height:180px;border-radius:10px;object-fit:cover;background:var(--surface2);border:1px solid var(--border);}
  .thumb-full{width:auto;max-width:35%;height:auto;max-height:80px;flex-shrink:0;object-fit:contain;background:var(--surface2);border-radius:10px;border:1px solid var(--border);display:block;cursor:zoom-in;}
  .thumb-hist{height:76px;width:auto;max-width:130px;object-fit:contain;background:var(--surface2);border-radius:8px;border:1px solid var(--border);flex-shrink:0;cursor:zoom-in;}
  .lb-ov{position:fixed;inset:0;z-index:300;background:rgba(3,5,7,.96);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;}
  .lb-ov img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform;}
  .lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .lb-hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#9aa8b2;font-size:12px;pointer-events:none;}
  .thumb-contain{width:100%;max-height:220px;height:auto;object-fit:contain;background:var(--surface2);border-radius:10px;border:1px solid var(--border);display:block;}
  .search{display:flex;gap:8px;margin-bottom:14px;}
  .search input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;}

  .navitem.active{color:var(--accent);}
  .navitem svg{width:18px;height:18px;}

  @keyframes pulse-logo{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.07);opacity:1;}}
  .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;color:var(--text-muted);font-size:13px;}
  .splash img{height:84px;width:auto;animation:pulse-logo 1.6s ease-in-out infinite;}
  .legal-links{text-align:center;margin-top:26px;font-size:12px;color:var(--text-muted);}
  .legal-links a{color:var(--text-muted);}
  .brand-sign a{color:var(--text-muted);}
  .brand-sign{text-align:center;margin:8px 0 28px;color:var(--text-muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
  .brand-sign img{height:30px;width:auto;display:block;margin:0 auto 8px;opacity:.9;}
  .empty h3{color:var(--text-muted);}
  .backlink{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;margin-bottom:14px;font-weight:600;}
  .divider{height:1px;background:var(--border);margin:16px 0;}
  .photo-picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .photo-picker .thumb{cursor:pointer;}
  .control-item{border-left:2px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px;}
  .control-item.tap{cursor:pointer;}
  .control-item .cdate{font-family:var(--font-head);font-size:16px;font-weight:600;}
  canvas.sigpad{width:100%;height:150px;background:#fff;border:1px dashed var(--border);border-radius:8px;touch-action:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:20;display:flex;align-items:flex-end;}
  .modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
  .role-pick{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .role-opt{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:13px 14px;}
  .qr-status{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px;}
  .qr-status.info{background:rgba(139,151,158,0.12);color:var(--text-muted);}
  .qr-status.warn{background:var(--warn-bg);color:var(--warn);}
  .qr-status.ok{background:var(--ok-bg);color:var(--ok);}
  .qr-status.err{background:var(--danger-bg);color:var(--danger);}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,0.4);max-width:88vw;text-align:center;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-muted);background:transparent;}
  .tab.active{background:var(--brand-grad);color:var(--on-accent);}
  .code-display{font-family:var(--font-mono);font-size:24px;letter-spacing:4px;text-align:center;padding:14px;background:var(--surface2);border:1px dashed var(--border);border-radius:8px;margin:10px 0;}
  .journal-item{padding:11px 0;border-bottom:1px solid var(--border);}
  .journal-item:last-child{border-bottom:none;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function genUUID(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(ch){ const r=Math.random()*16|0; const v=ch==='x'?r:(r&0x3|0x8); return v.toString(16); });
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2400); }
function fmtDate(d){ if(!d) return '—'; const p=(''+d).slice(0,10).split('-'); if(p.length!==3) return d; return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function equipIds(e){
  const a=[]; if(e && e.numero_serie) a.push('N° série '+esc(e.numero_serie)); if(e && e.identification) a.push('Identif. '+esc(e.identification));
  return a.join(' · ');
}
function fmtHM(ts){ if(!ts) return ''; const dt=new Date(ts); if(isNaN(dt)) return ''; return dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDT(date, ts){ const h=fmtHM(ts); return fmtDate(date)+(h?' à '+h:''); }
function daysUntil(d){ if(!d) return null; const t=new Date((''+d).slice(0,10)+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function addYears(d,n){ if(!d) return null; const p=(''+d).slice(0,10).split('-').map(Number); return new Date(p[0]+n,p[1]-1,p[2]).toISOString().slice(0,10); }
/* Conservation légale : un matériel réformé doit rester consultable 5 ans après la date de réforme */
const RETENTION_YEARS = 5;
function plusYears(d,n){ const p=(''+d).slice(0,10).split('-'); return (Number(p[0])+n)+'-'+p[1]+'-'+p[2]; }
function reformInfo(e){
  const rs = (e&&e.controls||[]).filter(c=>c.statut==='reforme').sort((a,b)=>b.date.localeCompare(a.date));
  if(!rs.length) return null;
  const date = rs[0].date.slice(0,10), until = plusYears(date, RETENTION_YEARS);
  return { date, until, locked: daysUntil(until) > 0 };
}
function isReformed(e){
  const cs = (e&&e.controls||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  return cs.length>0 && cs[0].statut==='reforme';
}
function reformBanner(e){
  const r = reformInfo(e); if(!r) return '';
  return `<div class="qr-status ${r.locked?'warn':'info'}" style="margin:10px 0;"><b>${isReformed(e)?'Matériel réformé':'Réforme enregistrée'} le ${fmtDate(r.date)}</b><br><span style="font-size:12px;">${r.locked?`Conservation obligatoire jusqu'au ${fmtDate(r.until)} (5 ans) en cas de contrôle : la fiche et son historique ne peuvent pas être supprimés définitivement avant cette date.`:`Délai de conservation de 5 ans écoulé depuis le ${fmtDate(r.until)} : suppression définitive possible.`}</span></div>`;
}
function statusOf(e){
  if(isReformed(e)) return {label:'Réformé', cls:'badge-danger'};
  const dfv = daysUntil(e.date_fin_vie);
  if(dfv!==null && dfv<0) return {label:'Hors service', cls:'badge-danger'};
  const controls = e.controls||[];
  const last = controls.length ? controls.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  if(last){
    const dNext = daysUntil(addYears(last.date,1));
    if(dNext!==null && dNext<0) return {label:'Contrôle dépassé', cls:'badge-danger'};
    if(dNext!==null && dNext<30) return {label:'Contrôle proche', cls:'badge-warn'};
  } else { return {label:'Jamais contrôlé', cls:'badge-warn'}; }
  if(dfv!==null && dfv<60) return {label:'Fin de vie proche', cls:'badge-warn'};
  return {label:'Conforme', cls:'badge-ok'};
}
function translateAuthError(msg){
  if(!msg) return 'Erreur inconnue';
  if(/invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect';
  if(/already registered|already exists/i.test(msg)) return 'Un compte existe déjà avec cet email';
  if(/password.*(least|short)/i.test(msg)) return 'Mot de passe trop court (8 caractères minimum)';
  if(/email not confirmed/i.test(msg)) return "Confirme d'abord ton email (lien reçu par mail)";
  if(/captcha/i.test(msg)) return 'Captcha refusé par Supabase (' + msg + ') — vérifie la secret key Turnstile dans Supabase (Attack Protection)';
  if(/code invalide/i.test(msg)) return 'Code invalide — vérifie-le auprès de ton administrateur';
  return msg;
}

/* ---------- Règles de mot de passe ---------- */
const PW_RULES = [
  { id:'len',   label:'8 caractères minimum',        test: p => p.length >= 8 },
  { id:'upper', label:'Une majuscule',               test: p => /[A-Z]/.test(p) },
  { id:'lower', label:'Une minuscule',               test: p => /[a-z]/.test(p) },
  { id:'digit', label:'Un chiffre',                  test: p => /[0-9]/.test(p) },
  { id:'spec',  label:'Un caractère spécial (!@#$…)', test: p => /[^A-Za-z0-9\s]/.test(p) }
];
function isStrongPw(p){ return PW_RULES.every(r=>r.test(p||'')); }
function pwChecklistHtml(inputId){
  return `<ul class="pw-rules" id="${inputId}-rules">` + PW_RULES.map(r=>`<li data-rule="${r.id}"><span class="box">✓</span>${r.label}</li>`).join('') + `</ul>`;
}
function updatePwRules(inputId){
  const el = document.getElementById(inputId); const box = document.getElementById(inputId+'-rules');
  if(!el || !box) return;
  PW_RULES.forEach(r=>{
    const li = box.querySelector('[data-rule="'+r.id+'"]');
    if(li) li.classList.toggle('ok', r.test(el.value));
  });
}

const LEGAL_VERSION = '2026-10-01';
async function doSignUp(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  const password2 = document.getElementById('au-password2').value;
  if(!email || !password){ showToast('Email et mot de passe requis'); return; }
  if(!document.getElementById('au-cgu') || !document.getElementById('au-cgu').checked){ showToast('Accepte les conditions d\'utilisation pour créer ton compte'); return; }
  if(!isStrongPw(password)){ showToast('Le mot de passe ne respecte pas toutes les conditions'); return; }
  if(password!==password2){ showToast('Les mots de passe ne correspondent pas'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const signUpOpts = { email, password, options: { emailRedirectTo: 'https://app.optepia.fr/confirmed.html', data: { cgu_accepted_at: new Date().toISOString(), cgu_version: LEGAL_VERSION } } };
  if(captchaToken) signUpOpts.options.captchaToken = captchaToken;
  const { data, error } = await sb.auth.signUp(signUpOpts);
  state.busy=false;
  if(error){ showToast(translateAuthError(error.message)); render(); return; }
  if(!data.session){ state.authMode='confirmSent'; render(); return; }
  state.session = data.session;
  await loadUnitContext();
}
async function doLogin(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  if(!email || !password){ showToast('Email et mot de passe requis'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const loginOpts = { email, password };
  if(captchaToken) loginOpts.options = { captchaToken };
  const { data, error } = await sb.auth.signInWithPassword(loginOpts);
  state.busy=false;
  if(error){ showToast(translateAuthError(error.message)); render(); return; }
  state.session = data.session;
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal && aal.currentLevel==='aal1' && aal.nextLevel==='aal2'){
    const { data: factors } = await sb.auth.mfa.listFactors();
    const factor = factors && factors.totp && factors.totp[0];
    if(factor){ state.mfaFactorId = factor.id; state.view='mfaChallenge'; render(); return; }
  }
  await loadUnitContext();
}

async function startPasswordReset(){
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  let needsMfa = false, factorId = null;
  try{
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.currentLevel==='aal1' && aal.nextLevel==='aal2'){
      const { data: f } = await sb.auth.mfa.listFactors();
      const factor = f && f.totp && f.totp.find(x=>x.status==='verified');
      if(factor){ needsMfa = true; factorId = factor.id; }
    }
  }catch(e){}
  state.resetNeedsMfa = needsMfa; state.resetFactorId = factorId;
  state.view='resetPassword'; render();
}
async function submitPasswordReset(){
  const pw = document.getElementById('rp-new').value;
  const pw2 = document.getElementById('rp-confirm').value;
  if(!isStrongPw(pw)){ showToast('Le mot de passe ne respecte pas toutes les conditions'); return; }
  if(pw!==pw2){ showToast('Les mots de passe ne correspondent pas'); return; }
  const btn = document.getElementById('rp-btn'); if(btn) btn.disabled = true;
  if(state.resetNeedsMfa){
    const code = (document.getElementById('rp-mfa').value||'').trim();
    if(!code){ showToast('Saisis le code à 6 chiffres'); if(btn) btn.disabled=false; return; }
    const { error: mErr } = await sb.auth.mfa.challengeAndVerify({ factorId: state.resetFactorId, code });
    if(mErr){ showToast('Code de vérification invalide'); if(btn) btn.disabled=false; return; }
  }
  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){
    showToast(/same.*password|different/i.test(error.message) ? "Choisis un mot de passe différent de l'ancien" : translateAuthError(error.message));
    if(btn) btn.disabled=false; return;
  }
  state.resetNeedsMfa=false; state.resetFactorId=null;
  await sb.auth.signOut();
  state.view='auth'; state.authMode='login'; render();
  showToast('Mot de passe modifié — connecte-toi avec le nouveau');
}

function dataUrlToBlob(dataUrl){
  const [header, b64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* Fichiers du catalogue partagé : stockés une seule fois dans le bucket « catalogue », référencés par « catalogue:chemin » */
const CAT_PREFIX = 'catalogue:';
function isCatRef(v){ return typeof v==='string' && v.startsWith(CAT_PREFIX); }
async function resolveCatRefs(refs){
  const now = Date.now();
  const need = [...new Set(refs)].filter(v=>!signedUrlCache[v] || signedUrlCache[v].expires < now + 5*60*1000);
  if(!need.length) return;
  try{
    const paths = need.map(v=>v.slice(CAT_PREFIX.length));
    for(let i=0;i<paths.length;i+=100){
      const { data } = await sb.storage.from('catalogue').createSignedUrls(paths.slice(i,i+100), 3600);
      (data||[]).forEach(d=>{ if(d.signedUrl) signedUrlCache[CAT_PREFIX+d.path] = { url:d.signedUrl, expires: now+3600*1000 }; });
    }
  }catch(e){ /* silencieux : imgFallback prendra le relais */ }
}
/* Anciennes données : certaines signatures sont stockées sous forme d'URL publique complète du bucket (devenu privé).
   On en extrait le chemin pour générer un lien signé. */
function storagePathOf(v){
  const m = /\/storage\/v1\/object\/(?:public|sign|authenticated)\/registre-materiel\/([^?#]+)/.exec(v||'');
  if(!m) return null;
  try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; }
}
function isExternalLink(v){ return !!v && /^https?:\/\//.test(v) && !storagePathOf(v); }
let signedUrlCache = {};
async function resolveSignedUrls(paths){
  const byPath = {};   /* chemin réel -> valeurs stockées qui y mènent */
  const catRefs = [];
  (paths||[]).forEach(v=>{
    if(!v || isExternalLink(v)) return;
    if(isCatRef(v)){ catRefs.push(v); return; }
    const real = storagePathOf(v) || v;
    (byPath[real] = byPath[real] || []).push(v);
  });
  const now = Date.now();
  await resolveCatRefs(catRefs);
  const need = Object.keys(byPath).filter(real=>byPath[real].some(v=>!signedUrlCache[v] || signedUrlCache[v].expires < now + 5*60*1000));
  if(need.length===0) return;
  try{
    for(let i=0;i<need.length;i+=100){
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i,i+100), 3600);
      if(error) throw error;
      (data||[]).forEach(d=>{
        if(!d.signedUrl) return;
        const entry = { url: d.signedUrl, expires: now + 3600*1000 };
        signedUrlCache[d.path] = entry;
        (byPath[d.path]||[]).forEach(v=>{ signedUrlCache[v] = entry; });
      });
    }
  }catch(e){ /* silencieux : imgFallback prendra le relais à l'affichage */ }
}
function imgSrc(v){
  if(!v) return '';
  if(isExternalLink(v)) return v;
  const cached = signedUrlCache[v];
  return cached ? cached.url : '';
}

let _zxP=null;
function loadZxing(){

  if(_zxP) return _zxP;

let _bd=undefined;
async function getBarcodeDetector(){
  if(_bd!==undefined) return _bd;
  _bd=null;
  try{
    if('BarcodeDetector' in window){
      let f=['qr_code','data_matrix','code_128','code_39','ean_13','pdf417','aztec'];
      try{ const sup=await BarcodeDetector.getSupportedFormats(); f=f.filter(x=>sup.includes(x)); }catch(e){}
      if(f.length) _bd=new BarcodeDetector({formats:f});
    }
  }catch(e){ _bd=null; }
  return _bd;
}
let _zxReader=null;
function zxReader(ZX){
  if(_zxReader) return _zxReader;
  const hints=new Map();
  hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.QR_CODE,ZX.BarcodeFormat.DATA_MATRIX,ZX.BarcodeFormat.CODE_128,ZX.BarcodeFormat.CODE_39,ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.PDF_417,ZX.BarcodeFormat.AZTEC]);
  hints.set(ZX.DecodeHintType.TRY_HARDER,true);
  _zxReader=new ZX.MultiFormatReader(); _zxReader.setHints(hints);
  return _zxReader;
}
function zxDecodeCanvas(ZX,canvas){
  const w=canvas.width,h=canvas.height;
  const d=canvas.getContext('2d').getImageData(0,0,w,h).data;
  const lum=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<lum.length;i++,j+=4) lum[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  const src=new ZX.RGBLuminanceSource(lum,w,h);
  const rd=zxReader(ZX);
  for(const inv of [false,true]){
    try{
      const bmp=new ZX.BinaryBitmap(new ZX.HybridBinarizer(inv?src.invert():src));
      const r=rd.decode(bmp);
      if(r&&r.getText()) return r.getText();
    }catch(e){}
  }
  return null;
}
async function decodeCanvas(canvas){
  const bd=await getBarcodeDetector();
  if(bd){ try{ const r=await bd.detect(canvas); if(r&&r.length&&r[0].rawValue) return r[0].rawValue; }catch(e){} }
  try{ const ZX=await loadZxing(); return zxDecodeCanvas(ZX,canvas); }catch(e){ return null; }
}

/* Extrait le numéro de série d'un contenu de code : JSON Optepia, URL, GS1 (AI 21) ou texte brut */
function parseScanned(data){
  const out={};
  const t=String(data||'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001c]/g,'').trim();
  try{
    const obj=JSON.parse(t);
    if(obj && typeof obj==='object'){
      if(obj.numeroSerie) out.numero_serie=String(obj.numeroSerie);
      const map={designation:'designation',marque:'marque',identification:'identification',dateFabrication:'date_fabrication',datePremiereUtilisation:'date_premiere_utilisation',dateFinVie:'date_fin_vie'};
      Object.keys(map).forEach(k=>{ if(obj[k]) out[map[k]]=String(obj[k]); });
      if(out.numero_serie) return out;
    }
  }catch(e){}
  if(/^https?:\/\//i.test(t)){
    try{
      const u=new URL(t);
      for(const k of ['serial','sn','s','serie','serialnumber','numeroserie','numero_serie','numero','id']){
        for(const [pk,pv] of u.searchParams.entries()){ if(pk.toLowerCase()===k && pv){ out.numero_serie=pv; return out; } }
      }
    }catch(e){}
  }
  /* GS1 entre parenthèses : (01)GTIN(21)SERIE(10)LOT */
  let m=t.match(/\(21\)([^(\u001d]+)/);
  if(m){ out.numero_serie=m[1].trim(); return out; }
  /* GS1 brut : 01 + 14 chiffres + 21 + série (jusqu'au séparateur GS ou la fin) */
  m=t.match(/^\u001d?01\d{14}21([^\u001d]+)/);
  if(m){ out.numero_serie=m[1].trim(); return out; }
  out.numero_serie=t;
  return out;
}

      const tr=stream.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():{};
      const adv=[];
      if(cap.focusMode && cap.focusMode.includes('continuous')) adv.push({focusMode:'continuous'});

      if(adv.length) await tr.applyConstraints({advanced:adv}).catch(()=>{});

    const track=stream.getVideoTracks()[0];

        const cap=track.getCapabilities?track.getCapabilities():{};
        if(cap.focusMode){
          if(cap.focusMode.includes('single-shot')){
            const a={focusMode:'single-shot'}; if(cap.pointsOfInterest) a.pointsOfInterest=[{x:x==null?.5:x,y:y==null?.5:y}];
            await track.applyConstraints({advanced:[a]}).catch(()=>{});
            await new Promise(r=>setTimeout(r,500));
          }
          if(cap.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
        }
      }catch(e){}
    };
    let snapping=false;
    /* photo pleine résolution avec mise au point automatique du téléphone, puis décodage */
    const snap=async(manual)=>{
      if(stopped||snapping||!ic) return null;

          c.width=w; c.height=h; c.getContext('2d').drawImage(bmp,0,0,w,h);

    ov.querySelector('video').addEventListener('click',ev=>{
      const rc=video.getBoundingClientRect(); refocus((ev.clientX-rc.left)/rc.width,(ev.clientY-rc.top)/rc.height);

    const bd=await getBarcodeDetector();
    let zx=null; if(!bd){ try{ zx=await loadZxing(); }catch(e){ msg.textContent='Lecteur indisponible (connexion ?) — utilise « Photo / import »'; } }
    let n=0;
    const loop=async()=>{
      if(stopped) return;

      if(vw&&vh){

          let found=null;
          if(bd){ const r=await bd.detect(video); if(r&&r.length&&r[0].rawValue) found=r[0].rawValue; }
          if(!found && (zx||!bd) && n%2===0){

            if(zx){

          if(found){ finish({data:found}); return; }
        }catch(e){}
      }
      setTimeout(loop,90);
    };
    loop();
  });
}

function openCropper(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.onerror = ()=>{ showToast('Image illisible'); resolve(null); };
    img.onload = ()=>{
      const W = img.naturalWidth, H = img.naturalHeight;
      const S = Math.min(window.innerWidth - 40, 340);
      const base = S / Math.min(W, H);
      let z = 1, px = W/2, py = H/2;   // (px,py) = point de l'image au centre du cadre
      const ov = document.createElement('div'); ov.className = 'crop-ov';
      ov.innerHTML = `<div class="crop-box">
        <h3 style="margin:0;color:#fff;text-align:center;">Recadrer la photo</h3>
        <p style="margin:0;color:#9aa8b2;font-size:12px;text-align:center;">Glisse pour déplacer · pince ou curseur pour zoomer</p>
        <div class="crop-stage" style="width:${S}px;height:${S}px;"><img alt=""><div class="crop-mask"></div></div>
        <input type="range" class="crop-zoom" min="1" max="4" step="0.01" value="1">
        <div style="display:flex;gap:10px;width:100%;"><button class="btn btn-secondary" id="cr-no">Annuler</button><button class="btn btn-primary" id="cr-ok">Valider</button></div></div>`;
      document.body.appendChild(ov);
      const stage = ov.querySelector('.crop-stage'), im = stage.querySelector('img'), zoom = ov.querySelector('.crop-zoom');
      im.src = url;
      function layout(){
        const s = base * z;
        px = Math.min(Math.max(px, S/2/s), W - S/2/s); py = Math.min(Math.max(py, S/2/s), H - S/2/s);
        im.style.width = (W*s)+'px'; im.style.height = (H*s)+'px';
        im.style.left = (S/2 - px*s)+'px'; im.style.top = (S/2 - py*s)+'px';
      }
      layout();
      zoom.addEventListener('input', ()=>{ z = parseFloat(zoom.value); layout(); });
      const pts = new Map(); let lastDist = 0;
      stage.addEventListener('pointerdown', e=>{ stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastDist = 0; });
      stage.addEventListener('pointermove', e=>{
        if(!pts.has(e.pointerId)) return;
        const prev = pts.get(e.pointerId), cur = {x:e.clientX,y:e.clientY};
        if(pts.size===1){ px -= (cur.x-prev.x)/(base*z); py -= (cur.y-prev.y)/(base*z); }
        pts.set(e.pointerId, cur);
        if(pts.size===2){
          const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
          if(lastDist) z = Math.min(4, Math.max(1, z * d/lastDist));
          lastDist = d; zoom.value = z;
        }
        layout();
      });
      const up = e=>{ pts.delete(e.pointerId); lastDist = 0; };
      stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
      stage.addEventListener('wheel', e=>{ e.preventDefault(); z = Math.min(4, Math.max(1, z * (e.deltaY<0?1.08:0.93))); zoom.value = z; layout(); }, {passive:false});
      let navH=null;
      const close = (v)=>{ ov.remove(); navH.close(); resolve(v); };
      navH=navOverlayOpen(()=>close(null));
      ov.querySelector('#cr-no').onclick = ()=>close(null);
      ov.querySelector('#cr-ok').onclick = ()=>{
        const s = base*z, c = document.createElement('canvas'); c.width = c.height = 400;
        c.getContext('2d').drawImage(img, px - S/2/s, py - S/2/s, S/s, S/s, 0, 0, 400, 400);
        close(c.toDataURL('image/jpeg', 0.85));
      };
    };
    img.src = url;
  });
}

  let sc=1, tx=0, ty=0, moved=false, lastTap=0; const pts=new Map(); let lastDist=0;
  const apply=()=>{ if(sc<=1){ sc=1; tx=0; ty=0; } im.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; };
  const rawClose=()=>{ ov.remove(); document.removeEventListener('keydown',onKey); };
  const navH=navOverlayOpen(rawClose);
  const close=()=>{ rawClose(); navH.close(); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  ov.querySelector('.lb-x').onclick = e=>{ e.stopPropagation(); close(); };
  ov.addEventListener('pointerdown',e=>{ if(e.target.closest('.lb-x')) return; ov.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastDist=0; moved=false; });
  ov.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId), cur={x:e.clientX,y:e.clientY};
    if(Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y)>2) moved=true;
    if(pts.size===1 && sc>1){ tx+=cur.x-prev.x; ty+=cur.y-prev.y; }
    pts.set(e.pointerId,cur);
    if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(lastDist) sc=Math.min(6,Math.max(1,sc*d/lastDist)); lastDist=d; moved=true; }
    apply();
  });
  const up=e=>{
    const wasSingle = pts.size===1; pts.delete(e.pointerId); lastDist=0;
    if(wasSingle && !moved){
      const now=Date.now();
      if(now-lastTap<300){ sc = sc>1 ? 1 : 2.5; apply(); lastTap=0; }
      else { lastTap=now; setTimeout(()=>{ if(lastTap && Date.now()-lastTap>=290 && sc===1 && !pts.size){ lastTap=0; close(); } }, 310); }
    }
  };
  ov.addEventListener('pointerup',up); ov.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); lastDist=0; });
  ov.addEventListener('wheel',e=>{ e.preventDefault(); sc=Math.min(6,Math.max(1,sc*(e.deltaY<0?1.15:0.87))); apply(); },{passive:false});
}
function openCropperRect(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.onerror = ()=>{ showToast('Image illisible'); resolve(null); };
    img.onload = ()=>{
      const W = img.naturalWidth, H = img.naturalHeight;
      const maxW = Math.min(window.innerWidth - 40, 340), maxH = Math.max(220, Math.min(window.innerHeight - 320, 420));
      const RATIOS = [['1:1','Carré',1],['4:3','4:3',4/3],['3:4','3:4',3/4],['orig','Original',W/H]];
      let a = 1, Sw = maxW, Sh = maxW, base = 1, z = 1, px = W/2, py = H/2;
      const ov = document.createElement('div'); ov.className = 'crop-ov';
      ov.innerHTML = `<div class="crop-box">
        <h3 style="margin:0;color:#fff;text-align:center;">Recadrer la photo</h3>
        <p style="margin:0;color:#9aa8b2;font-size:12px;text-align:center;">Choisis le format · glisse pour déplacer · pince ou curseur pour zoomer</p>
        <div class="crop-ratios">${RATIOS.map(r=>`<button type="button" class="chip" data-r="${r[0]}">${r[1]}</button>`).join('')}</div>
        <div class="crop-stage"><img alt=""><div class="crop-mask rect"></div></div>
        <input type="range" class="crop-zoom" min="1" max="4" step="0.01" value="1">
        <div style="display:flex;gap:10px;width:100%;"><button class="btn btn-secondary" id="cr-no">Annuler</button><button class="btn btn-primary" id="cr-ok">Valider</button></div></div>`;
      document.body.appendChild(ov);
      const stage = ov.querySelector('.crop-stage'), im = stage.querySelector('img'), zoom = ov.querySelector('.crop-zoom');
      im.src = url;
      function layout(){
        const s = base * z;
        px = Math.min(Math.max(px, Sw/2/s), W - Sw/2/s); py = Math.min(Math.max(py, Sh/2/s), H - Sh/2/s);
        im.style.width = (W*s)+'px'; im.style.height = (H*s)+'px';
        im.style.left = (Sw/2 - px*s)+'px'; im.style.top = (Sh/2 - py*s)+'px';
      }
      function setRatio(key){
        a = RATIOS.find(r=>r[0]===key)[2];
        Sw = maxW; Sh = Sw / a;
        if(Sh > maxH){ Sh = maxH; Sw = Sh * a; }
        stage.style.width = Sw+'px'; stage.style.height = Sh+'px';
        base = Math.max(Sw/W, Sh/H); z = 1; zoom.value = 1; px = W/2; py = H/2;
        ov.querySelectorAll('.crop-ratios .chip').forEach(c=>c.classList.toggle('on', c.dataset.r===key));
        layout();
      }
      ov.querySelectorAll('.crop-ratios .chip').forEach(c=>c.onclick = ()=>setRatio(c.dataset.r));
      setRatio(W/H > 1.15 ? '4:3' : '1:1');
      zoom.addEventListener('input', ()=>{ z = parseFloat(zoom.value); layout(); });
      const pts = new Map(); let lastDist = 0;
      stage.addEventListener('pointerdown', e=>{ stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastDist = 0; });
      stage.addEventListener('pointermove', e=>{
        if(!pts.has(e.pointerId)) return;
        const prev = pts.get(e.pointerId), cur = {x:e.clientX,y:e.clientY};
        if(pts.size===1){ px -= (cur.x-prev.x)/(base*z); py -= (cur.y-prev.y)/(base*z); }
        pts.set(e.pointerId, cur);
        if(pts.size===2){
          const [p1,p2] = [...pts.values()]; const d = Math.hypot(p1.x-p2.x, p1.y-p2.y);
          if(lastDist) z = Math.min(4, Math.max(1, z * d/lastDist));
          lastDist = d; zoom.value = z;
        }
        layout();
      });
      const up = e=>{ pts.delete(e.pointerId); lastDist = 0; };
      stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
      stage.addEventListener('wheel', e=>{ e.preventDefault(); z = Math.min(4, Math.max(1, z * (e.deltaY<0?1.08:0.93))); zoom.value = z; layout(); }, {passive:false});
      let navH=null;
      const close = v=>{ ov.remove(); navH.close(); resolve(v); };
      navH=navOverlayOpen(()=>close(null));
      ov.querySelector('#cr-no').onclick = ()=>close(null);
      ov.querySelector('#cr-ok').onclick = ()=>{
        const s = base*z, srcW = Sw/s, srcH = Sh/s;
        const ow = Math.max(1, Math.min(900, Math.round(srcW))), oh = Math.max(1, Math.round(ow * srcH / srcW));
        const c = document.createElement('canvas'); c.width = ow; c.height = oh;
        c.getContext('2d').drawImage(img, px - srcW/2, py - srcH/2, srcW, srcH, 0, 0, ow, oh);
        close(c.toDataURL('image/jpeg', 0.7));
      };
    };
    img.src = url;
  });
}

async function recropSource(dataUrl, path){
  if(dataUrl) return { url:dataUrl };
  const u = imgSrc(path); if(!u) return null;
  try{
    const r = await fetch(u); if(!r.ok) throw new Error('http');
    return { url: URL.createObjectURL(await r.blob()), revoke:true };
  }catch(e){ showToast('Impossible de recadrer cette photo : reprends-la avec « Changer la photo »'); return null; }
}

const NAV_FIELDS=['view','detailId','controlDetailId','batchDetailKey','batchDetailType','sheet','filter','groupFilter','famFilter','availFilter'];
const NAV_FREE=['loading','error','auth','resetPassword','mfaChallenge','unitSetup','unitPicker'];
const NAV_FORMS=['addEquip','addControl','loanOut','loanReturn','checkout','batchReturn','batchControl','importPreview','refuseLoan','transferOwnership'];
let _navCur=null, _navCurView=null, _navBusy=false, _ovSkip=0; const _ovStack=[];
function navSnap(){ const o={unit:(state.unit&&state.unit.id)||null}; NAV_FIELDS.forEach(k=>{ o[k]=state[k]===undefined?null:state[k]; }); return o; }
function navSync(){
  if(_navBusy) return;
  try{
    const snap=navSnap(), key=JSON.stringify(snap);
    if(NAV_FREE.includes(state.view)){ history.replaceState({nav:snap},'',location.href); _navCur=key; _navCurView=state.view; return; }
    if(key===_navCur) return;
    if(_navCur===null || NAV_FORMS.includes(_navCurView)) history.replaceState({nav:snap},'',location.href);
    else history.pushState({nav:snap},'',location.href);
    _navCur=key; _navCurView=state.view;
  }catch(e){}
}
function navOverlayOpen(onBack){
  const it={onBack,done:false};
  _ovStack.push(it);
  try{ history.pushState({nav:navSnap(),ov:1},'',location.href); }catch(e){}
  it.close=()=>{ if(it.done) return; it.done=true; const i=_ovStack.indexOf(it); if(i>=0) _ovStack.splice(i,1); _ovSkip++; try{ history.back(); }catch(e){} };
  return it;
}
window.addEventListener('popstate',e=>{
  if(_ovSkip>0){ _ovSkip--; return; }
  if(_ovStack.length){ const it=_ovStack.pop(); it.done=true; try{ it.onBack(); }catch(err){} return; }
  const s=e.state&&e.state.nav; if(!s) return;
  if(NAV_FREE.includes(state.view)) return;
  if(JSON.stringify(s)===_navCur){ history.back(); return; }
  _navBusy=true;
  try{
    const curUnit=(state.unit&&state.unit.id)||null;
    if(s.unit!==curUnit){ state.view='home'; state.detailId=null; }
    else NAV_FIELDS.forEach(k=>{ state[k]=s[k]; });
    render();
    _navCur=JSON.stringify(navSnap()); _navCurView=state.view;
  }catch(err){}
  _navBusy=false;
});

/* ---- List / detail ---- */
function equipCounts(){
  const active = state.equipment.filter(e=>!e.deleted_at);
  const c={tous:active.length,conforme:0,attention:0,horsService:0};
  active.forEach(e=>{ const s=statusOf(e); if(s.cls==='badge-ok')c.conforme++; else if(s.cls==='badge-warn')c.attention++; else c.horsService++; });
  return c;
}
function groupKey(e){ return [e.famille||'Sans famille', e.sous_famille||'', e.designation||'', e.marque||''].join('¦'); }
function nextControlDueDays(e){
  const controls = e.controls||[];
  const last = controls.length? controls.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  if(!last) return -999999;
  return daysUntil(addYears(last.date,1));
}
function urgencyScore(e){ const s=statusOf(e).cls; return s==='badge-danger'?0:s==='badge-warn'?1:2; }
function isEligibleControl(e){ const l=statusOf(e).label; return l!=='Hors service' && l!=='Réformé'; }
function needsCheck(e){ const l=statusOf(e).label; return l==='Contrôle dépassé' || l==='Contrôle proche' || l==='Jamais contrôlé'; }
function dueParts(e){
  /* lignes d'échéance d'une fiche : [{t, c}] c = couleur */
  if(isReformed(e)) return [];
  const out=[]; const last=lastCtl(e); const dfv=daysUntil(e.date_fin_vie);
  if(dfv!==null && dfv<0){ out.push({t:'Fin de vie dépassée',c:'var(--danger)'}); return out; }
  if(!last) out.push({t:'Jamais contrôlé',c:'var(--warn)'});
  else {
    const nx=addYears(last.date,1), d=daysUntil(nx);
    if(d<0) out.push({t:'Contrôle dépassé de '+(-d)+' j',c:'var(--danger)'});
    else if(d<30) out.push({t:'Contrôle dans '+d+' j',c:'var(--warn)'});
    else out.push({t:'Prochain contrôle '+fmtDate(nx),c:'var(--text-muted)'});
  }
  if(dfv!==null && dfv<60) out.push({t:'Fin de vie dans '+dfv+' j',c:'var(--warn)'});
  else if(dfv!==null && dfv<=365) out.push({t:'Fin de vie '+fmtDate(e.date_fin_vie),c:'var(--text-muted)'});
  return out;
}
function dueHtml(e){ return dueParts(e).map(p=>`<div style="font-size:12px;margin-top:2px;color:${p.c};">${esc(p.t)}</div>`).join(''); }
const SORTS = [['designation','Tri : désignation'],['urgence','Tri : urgence'],['controle','Tri : prochain contrôle'],['finvie','Tri : fin de vie'],['recent','Tri : ajouté récemment']];
const STATUS_FILTERS = [['tous','Statut : tous'],['conforme','Conforme'],['attention','À surveiller'],['acontroler','À contrôler (dépassé, < 30 j, jamais)'],['horsService','Hors service / réformé'],['depasse','Contrôle dépassé'],['proche','Contrôle à faire < 30 j'],['jamais','Jamais contrôlé'],['finvie','Fin de vie < 60 j']];
function renderList(){
  const c = equipCounts();
  const pendingLoanCount = can('validerPret') ? Object.keys(groupLoansByBatch(allLoans().filter(l=>l.status==='en_attente'))).length : 0;
  const pendingChangeCount = can('validerModificationMateriel') ? state.changeRequests.length : 0;
  const totalPending = pendingLoanCount + pendingChangeCount;
  const trashCount = state.equipment.filter(e=>e.deleted_at).length;

  const sel = 'flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 8px;font-size:13px;';
  const nCheck = state.equipment.filter(e=>!e.deleted_at && needsCheck(e)).length;
  const cnt = {tous:c.tous,conforme:c.conforme,attention:c.attention,horsService:c.horsService,acontroler:nCheck};
  const flat = state.selMode || state.tableView;
  return `
  ${totalPending>0?`<div class="card tap" style="border-color:var(--warn);margin-bottom:14px;" onclick="goto('approvals')"><div class="row"><b style="color:var(--warn);">⚠ ${totalPending} validation${totalPending>1?'s':''} en attente</b><span class="muted">›</span></div></div>`:''}
  ${c.attention>0&&state.filter!=='attention'?`<div class="card tap" style="margin-bottom:14px;" onclick="setFilter('attention')"><div class="row"><b style="color:var(--warn);">🔧 ${c.attention} matériel${c.attention>1?'s':''} à contrôler bientôt</b><span class="muted">›</span></div></div>`:''}
  <div class="list-sticky"><div class="search" style="margin:0;"><input id="search-input" placeholder="Rechercher désignation, marque, n° série, identification…" value="${esc(state.search)}" oninput="onSearchInput(this.value)"><button class="btn btn-secondary" style="width:auto;padding:0 14px;flex-shrink:0;" title="Scanner un QR code ou code-barres (photo)" onclick="document.getElementById('scan-in').click()">📷</button><input type="file" id="scan-in" accept="image/*" capture="environment" style="display:none;" onchange="scanSearch(this)"></div></div>
  <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">

    ${can('ajouterControle')?`<button class="chip" onclick="startBatchControl()">✔ Contrôle groupé</button>`:''}
    <button class="chip" onclick="goto('export')">📤 Export</button>

  </div>
  <div id="equip-results" class="${state.tableView?'':'grid'}">${renderListResults()}</div>
  <div id="sel-bar" class="sel-bar" style="display:none;"></div>`;
}
function setSort(v){ state.sortMode=v; render(); }
function toggleTableView(){ state.tableView=!state.tableView; state.groupFilter=null; render(); }
function toggleSelMode(){ state.selMode=!state.selMode; state.sel={}; state.groupFilter=null; render(); }
function onSearchInput(v){
  state.search = v;
  const el = document.getElementById('equip-results');
  if(el) el.innerHTML = renderListResults();
}
function listItems(){
  const q = state.search.toLowerCase();
  const items = state.equipment.filter(e=>{
    if(e.deleted_at) return false;
    if(q && !(`${e.designation} ${e.marque} ${e.numero_serie} ${e.identification}`.toLowerCase().includes(q))) return false;
    if(state.famFilter && (e.famille||'Sans famille')!==state.famFilter) return false;
    const busy = (e.loans||[]).some(l=>l.status==='en_cours'||l.status==='en_attente');
    if(state.availFilter==='out' && !busy) return false;
    if(state.availFilter==='free' && busy) return false;
    const lbl = statusOf(e).label, dfv = daysUntil(e.date_fin_vie);
    if(state.filter==='conforme') return statusOf(e).cls==='badge-ok';
    if(state.filter==='attention') return statusOf(e).cls==='badge-warn';
    if(state.filter==='horsService') return statusOf(e).cls==='badge-danger';
    if(state.filter==='acontroler') return needsCheck(e);
    if(state.filter==='depasse') return lbl==='Contrôle dépassé';
    if(state.filter==='jamais') return lbl==='Jamais contrôlé';
    if(state.filter==='proche') return lbl==='Contrôle proche';
    if(state.filter==='finvie') return lbl!=='Hors service' && lbl!=='Réformé' && dfv!==null && dfv>=0 && dfv<60;
    return true;
  });
  const dsg = (a,b)=>(a.designation||'').localeCompare(b.designation||'');
  const fv = e=>{ const d=daysUntil(e.date_fin_vie); return d===null?999999:d; };
  if(state.tableView){
    const k=state.tableSort.k, dir=state.tableSort.dir;
    const val={
      designation:e=>(e.designation||'').toLowerCase(), marque:e=>(e.marque||'').toLowerCase(), serie:e=>(e.numero_serie||'').toLowerCase(), ident:e=>(e.identification||'').toLowerCase(),
      last:e=>{ const l=lastCtl(e); return l?l.date:''; }, next:e=>nextControlDueDays(e), finvie:fv, statut:e=>urgencyScore(e)
    }[k]||(e=>0);
    return items.sort((a,b)=>{ const x=val(a), y=val(b); const r = x<y?-1:x>y?1:0; return (r||dsg(a,b))*dir; });
  }
  return items.sort((a,b)=>{
    if(state.sortMode==='urgence'){ const d=urgencyScore(a)-urgencyScore(b); return d!==0?d:(nextControlDueDays(a)-nextControlDueDays(b)||dsg(a,b)); }
    if(state.sortMode==='controle') return (nextControlDueDays(a)-nextControlDueDays(b))||dsg(a,b);
    if(state.sortMode==='finvie') return (fv(a)-fv(b))||dsg(a,b);
    if(state.sortMode==='recent') return (b.created_at||'').localeCompare(a.created_at||'')||dsg(a,b);
    return dsg(a,b);
  });
}

      else { const nx = g.map(e=>{ const l=lastCtl(e); return l?addYears(l.date,1):null; }).filter(Boolean).sort()[0]; due = nx?`<div style="font-size:12px;margin-top:2px;color:var(--text-muted);">Prochain contrôle ${fmtDate(nx)}</div>`:''; }
      const eol = g.filter(e=>{ const d=daysUntil(e.date_fin_vie); return isEligibleControl(e) && d!==null && d>=0 && d<60; }).length;
      if(eol) due += `<div style="font-size:12px;margin-top:2px;color:var(--warn);">${eol} fin de vie proche</div>`;
      return `
      <div class="card tap" onclick="state.groupFilter='${k.replace(/'/g,"\'")}'; render();">
        <div class="row">

            ${first.photo_url?`<img class="thumb" src="${imgSrc(first.photo_url)}">`:`<div class="thumb"></div>`}

              <div style="font-weight:600;font-size:15px;">${esc(first.designation)||'Sans désignation'}</div>
              <div class="muted">${esc(first.marque)||'—'}${first.famille?' · '+esc(first.famille):''}${first.sous_famille?' · '+esc(first.sous_famille):''}</div>
              ${due}
              ${(function(){ const n=g.filter(x=>(x.loans||[]).some(l=>l.status==='en_cours'||l.status==='en_attente')).length; return n?`<div style="font-size:12px;color:var(--warn);">${n} sorti${n>1?'s':''}</div>`:''; })()}

            <div style="font-family:var(--font-head);font-size:20px;font-weight:700;">${g.length}</div>
            <span class="badge ${worst}" style="margin-top:2px;">${worstLabel}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  if(state.groupFilter){
    const filtered = items.filter(e=>groupKey(e)===state.groupFilter);
    return `<div class="backlink" style="grid-column:1/-1;" onclick="state.groupFilter=null; render();">‹ Retour aux types de matériel</div>` + filtered.map(renderEquipRow).join('');
  }
  return items.map(renderEquipRow).join('');
}
function toggleGroupMode(){ state.viewMode = state.viewMode==='grouped' ? 'flat' : 'grouped'; state.groupFilter=null; render(); }
function tableSortBy(k){ const t=state.tableSort; if(t.k===k) t.dir=-t.dir; else { t.k=k; t.dir=1; } const el=document.getElementById('equip-results'); if(el) el.innerHTML=renderListResults(); }
function renderEquipTable(items){
  const cols=[['designation','Désignation'],['serie','N° série'],['ident','Identification'],['last','Dernier contrôle'],['next','Prochain contrôle'],['finvie','Fin de vie'],['statut','Statut']];

    <td class="mono">${esc(e.numero_serie)||'—'}</td><td class="mono">${esc(e.identification)||'—'}</td>

    <td><span class="badge ${s.cls}">${s.label}</span></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function selBatchControl(){

async function selTrash(){
  const ids=selIds(); if(!ids.length) return;
  const reason = await askReason('Mettre '+ids.length+' article'+(ids.length>1?'s':'')+' à la corbeille ?', "Les fiches iront à la corbeille : tu pourras les restaurer, et elles ne pourront être supprimées définitivement qu'après "+TRASH_DAYS+" jours. Le motif sera enregistré pour chacune.", 'Mettre à la corbeille');
  if(!reason) return;
  state.busy=true;
  const { error } = await sb.from('equipment').update({deleted_at:new Date().toISOString(), delete_reason:reason}).in('id', ids);
  state.busy=false;
  if(error){ showToast(error.message); return; }
  state.sel={}; state.selMode=false;
  await refreshAll(); render(); showToast(ids.length+' fiche'+(ids.length>1?'s':'')+' déplacée'+(ids.length>1?'s':'')+' vers la corbeille');
}
async function scanSearch(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  showToast('Lecture du code…');
  const url = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(null); fr.readAsDataURL(f); });
  const raw = url ? await decodeQrFromDataUrl(url) : null;
  if(!raw){ showToast('Code non reconnu — rapproche-toi ou améliore la lumière'); return; }
  const p = parseScanned(raw) || {};
  state.search = p.numero_serie || p.identification || String(raw).trim();
  state.groupFilter=null; render();
  const n = listItems().length;
  showToast(n?n+' résultat'+(n>1?'s':'')+' pour « '+state.search+' »':'Aucune fiche pour « '+state.search+' »');
}

/* ---- Pièces jointes du support ---- */
const SUP_MAX_FILES=3, SUP_MAX_BYTES=5*1024*1024;
function supPickFiles(inp){
  const cur=state.supFiles||[]; const err=[];
  for(const f of inp.files){
    if(cur.length>=SUP_MAX_FILES){ err.push('3 fichiers maximum'); break; }
    if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)){ err.push(f.name+' : format non pris en charge'); continue; }
    cur.push(f);
  }
  inp.value=''; state.supFiles=cur; supSyncDraft(); render(); if(err.length) showToast(err[0]);
}
function supRmFile(i){ state.supFiles.splice(i,1); supSyncDraft(); render(); }
function supSyncDraft(){ const s=document.getElementById('sup-subject'), b=document.getElementById('sup-body'), r=document.getElementById('sup-reply'); if(s&&state.supDraft) state.supDraft.subject=s.value; if(b&&state.supDraft) state.supDraft.body=b.value; if(r) state.supReply=r.value; }
function supFilesPicker(){
  const fs=state.supFiles||[];
  return `<div class="field"><label>Pièces jointes (facultatif)</label>
    ${fs.map((f,i)=>`<div class="card" style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;"><span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📎 ${esc(f.name)}</span><span class="muted" style="font-size:12px;">${Math.max(1,Math.round(f.size/1024))} Ko</span><button type="button" class="btn btn-ghost" style="width:auto;padding:4px 10px;" onclick="supRmFile(${i})">✕</button></div>`).join('')}
    ${fs.length<SUP_MAX_FILES?`<label class="btn btn-secondary" style="display:block;text-align:center;cursor:pointer;">+ Ajouter une photo ou un PDF<input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple style="display:none;" onchange="supPickFiles(this)"></label>`:''}
    <p class="muted" style="font-size:12px;margin-top:6px;">Images (JPG, PNG, WebP) ou PDF · 3 fichiers, 5 Mo chacun.</p></div>`;
}
async function supShrink(f){
  if(f.type==='application/pdf') return f;
  try{
    const bmp=await createImageBitmap(f); const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(sc===1 && f.size<=1.5*1024*1024) return f;
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob?new File([blob],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f;
  }catch(e){ return f; }
}
async function supUploadFiles(ticketId){
  const out=[];
  for(const f0 of (state.supFiles||[])){
    const f=await supShrink(f0);
    if(f.size>SUP_MAX_BYTES) throw new Error(f0.name+' dépasse 5 Mo');
    const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=ticketId+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(16).slice(2))+'.'+ext;
    const {error}=await sb.storage.from('support-files').upload(path,f,{contentType:f.type});
    if(error) throw error;
    out.push({path,name:f0.name,type:f.type,size:f.size});
  }
  return out;
}
async function supOpenFile(path){
  const {data,error}=await sb.storage.from('support-files').createSignedUrl(path,300);
  if(error||!data) return alert('Fichier indisponible');
  window.open(data.signedUrl,'_blank','noopener');
}
function supAttachHtml(m){
  const a=m.attachments||[]; if(!a.length) return '';
  return `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">${a.map(x=>`<button type="button" class="btn btn-secondary" style="width:auto;padding:6px 10px;font-size:12px;" onclick="supOpenFile('${esc(x.path)}')">📎 ${esc(x.name)}</button>`).join('')}</div>`;
}

async function submitSupportTicket(){
  supSyncDraft();
  const d=state.supDraft||{}; const subject=(d.subject||'').trim(); let body=(d.body||'').trim();
  if(subject.length<3) return showToast('Indique un sujet');
  if(!body && !(state.supFiles||[]).length) return showToast('Écris ton message');
  if(!body) body='(pièce jointe)';
  state.busy=true; render();
  const {data:t,error}=await sb.from('support_tickets').insert({unit_id:state.unit.id,subject,category:d.category||'question'}).select().single();
  if(error){ state.busy=false; render(); return showToast('Envoi impossible'); }
  let atts=[], upErr=null;
  try{ atts=await supUploadFiles(t.id); }catch(e){ upErr=e.message||'échec'; }
  const {data:m,error:e2}=await sb.from('support_messages').insert({ticket_id:t.id,body,attachments:atts}).select().single();
  state.busy=false;
  if(e2){ render(); return showToast('Envoi impossible'); }
  supNotify(m.id);
  state.supDraft=null; state.supFiles=[]; showToast(upErr?'Ticket envoyé, mais pièce jointe refusée':'Ticket envoyé ✓'); openSupportTicket(t.id);

async function refreshMfaFactors(){

function renderMfaSection(){
  const verified = state.mfaFactors.find(f=>f.status==='verified');
  if(state.mfaEnroll){
    return `

      <h3 class="mfa-title" style="margin-bottom:10px;">Double authentification</h3>
      <p class="muted" style="font-size:12px;margin-bottom:10px;">Scanne ce code avec une application comme Google Authenticator ou Authy, puis saisis le code à 6 chiffres généré.</p>
      <div style="background:#fff;padding:12px;border-radius:8px;margin-bottom:10px;max-width:220px;">${state.mfaEnroll.qr_code}</div>
      <p class="mono muted" style="font-size:11px;margin-bottom:10px;word-break:break-all;">Code secret (si le scan ne fonctionne pas) : ${esc(state.mfaEnroll.secret)}</p>
      <div class="field"><input id="mfa-enroll-code" inputmode="numeric" maxlength="6" placeholder="123456" style="text-align:center;font-size:20px;letter-spacing:6px;"></div>
      <div class="btn-row">
        <button class="btn btn-primary" ${state.busy?'disabled':''} onclick="confirmMfaEnroll()">${state.busy?'<span class="spinner"></span>':'Activer'}</button>
        <button class="btn btn-secondary" onclick="cancelMfaEnroll()">Annuler</button>
      </div>
    </div>`;
  }
  return `
  <div class="card">
    <h3 class="mfa-title" style="margin-bottom:6px;">Double authentification</h3>
    <p class="muted" style="font-size:12px;margin-bottom:10px;">${verified?'Activée sur ce compte — un code sera demandé à chaque connexion.':'Optionnelle : ajoute un code à usage unique en plus du mot de passe à chaque connexion.'}</p>
    ${verified
      ? `<button class="btn btn-danger" ${state.busy?'disabled':''} onclick="disableMfa('${verified.id}')">${state.busy?'<span class="spinner"></span>':'Désactiver'}</button>`
      : `<button class="btn btn-secondary" ${state.busy?'disabled':''} onclick="startMfaEnroll()">${state.busy?'<span class="spinner"></span>':'Activer la double authentification'}</button>`}
  </div>`;
}
async function startMfaEnroll(){
  state.busy=true; render();
  const { data, error } = await sb.auth.mfa.enroll({ factorType:'totp' });
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  state.mfaEnroll = { factorId:data.id, qr_code:data.totp.qr_code, secret:data.totp.secret };
  render();
}
function cancelMfaEnroll(){
  if(state.mfaEnroll) sb.auth.mfa.unenroll({ factorId: state.mfaEnroll.factorId }).catch(()=>{});
  state.mfaEnroll = null;
  render();
}
async function confirmMfaEnroll(){
  const code = document.getElementById('mfa-enroll-code').value.trim();
  if(!code){ showToast('Saisis le code à 6 chiffres'); return; }
  state.busy=true; render();
  try{
    const { data: challenge, error: chErr } = await sb.auth.mfa.challenge({ factorId: state.mfaEnroll.factorId });
    if(chErr) throw chErr;
    const { error: verErr } = await sb.auth.mfa.verify({ factorId: state.mfaEnroll.factorId, challengeId: challenge.id, code });
    if(verErr) throw verErr;
    state.mfaEnroll = null;
    await refreshMfaFactors();
    showToast('Double authentification activée');
  }catch(err){ showToast(err.message || 'Code invalide'); }
  state.busy=false; render();
}
async function disableMfa(factorId){
  if(!confirm('Désactiver la double authentification sur ce compte ?')) return;
  state.busy=true; render();
  const { error } = await sb.auth.mfa.unenroll({ factorId });
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  await refreshMfaFactors();
  render();
  showToast('Double authentification désactivée');
}

/* ---- Journal ---- */
async function openJournal(){ state.journalLimit=300; state.jf={user:'',cat:'',period:'',q:''}; await loadJournal(); state.view='journal'; render(); }
function catOfAction(a){
  a = a||'';
  if(/mission/i.test(a)) return 'Missions';
  if(/^Pr[êe]t|restitu/i.test(a)) return 'Prêts';
  if(/Contrôle/i.test(a)) return 'Contrôles';
  if(/Rôle|Membre|Propriét|Unité/i.test(a)) return 'Équipe et unité';
  return 'Matériel';
}
const JOURNAL_CATS = ['Matériel','Contrôles','Prêts','Missions','Équipe et unité'];
function journalFiltered(){
  const f = state.jf, now = Date.now(), days = f.period ? parseInt(f.period,10) : 0, q = (f.q||'').toLowerCase().trim();
  return state.journal.filter(j=>
    (!f.user || j.user_name===f.user) &&
    (!f.cat || catOfAction(j.action)===f.cat) &&
    (!days || (now - new Date(j.created_at).getTime()) <= days*86400000) &&
    (!q || `${j.action} ${j.target_label||''} ${j.user_name||''} ${journalDetailText(j)}`.toLowerCase().includes(q)));
}
function journalResultsHtml(){
  const list = journalFiltered();
  const filtered = state.jf.user || state.jf.cat || state.jf.period || state.jf.q;
  return `<p class="muted" style="font-size:12px;margin-bottom:8px;">${list.length} action${list.length>1?'s':''}${filtered?' (filtrées)':''}${state.journalHasMore?' — les plus récentes sont chargées':''}</p>`
    + (list.length===0?'<p class="muted">Aucune action ne correspond.</p>':list.map(j=>`
    <div class="journal-item" style="cursor:pointer;" onclick="openJournalDetail('${j.id}')">
      <div class="row"><b style="font-size:14px;">${esc(j.action)}</b><span class="muted" style="font-size:11px;">${fmtDateTime(j.created_at)} ›</span></div>
      <p class="muted" style="font-size:13px;margin-top:2px;">${esc(j.user_name)}${j.target_label?' · '+esc(j.target_label):''}</p>
      ${j.details&&j.details.motif?`<p style="font-size:12px;margin-top:3px;"><b>Motif :</b> ${esc(j.details.motif)}</p>`:''}
    </div>`).join(''))
    + (state.journalHasMore?`<button class="btn btn-ghost" style="margin-top:10px;" onclick="journalMore()">Charger les actions plus anciennes</button>`:'');
}
function journalDetailText(j){
  const d = j.details||{}; const parts=[];
  if(d.motif) parts.push('Motif : '+d.motif);
  (d.changes||[]).forEach(c=>parts.push(c.f+' : '+c.o+' → '+c.n));
  Object.keys(d.info||{}).forEach(k=>parts.push(k+' : '+d.info[k]));
  return parts.join(' | ');
}
function openJournalDetail(id){
  const j = state.journal.find(x=>x.id===id); if(!j) return;
  const d = j.details||{};
  const row = (k,v)=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;"><span class="muted" style="flex:0 0 42%;">${esc(k)}</span><span style="flex:1;word-break:break-word;">${esc(v)}</span></div>`;
  const changes = (d.changes||[]).map(c=>`<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;"><div class="muted" style="font-size:12px;">${esc(c.f)}</div><div><span style="text-decoration:line-through;opacity:.7;">${esc(c.o)}</span> → <b>${esc(c.n)}</b></div></div>`).join('');
  const info = Object.keys(d.info||{}).map(k=>row(k, d.info[k])).join('');
  const has = d.motif || changes || info;
  const ov = document.createElement('div'); ov.className='sheet-ov';
  ov.innerHTML = `<div class="sheet-box" style="max-height:85vh;overflow:auto;">
    <h3 style="margin:0;color:var(--text);">${esc(j.action)}</h3>
    ${row('Date', fmtDateTime(j.created_at))}${row('Par', j.user_name||'—')}${j.target_label?row('Concerne', j.target_label):''}
    ${d.motif?`<div style="margin-top:6px;padding:10px;background:var(--surface2);border-radius:8px;font-size:13px;"><b>Motif</b><br>${esc(d.motif)}</div>`:''}
    ${changes?`<div style="margin-top:6px;"><b style="font-size:13px;">Modifications</b>${changes}</div>`:''}
    ${info}
    ${has?'':'<p class="muted" style="font-size:12px;margin:6px 0 0;">Aucun détail supplémentaire n\'a été enregistré pour cette action (actions antérieures à cette fonctionnalité).</p>'}
    <button class="btn btn-ghost" id="jd-close" style="margin-top:6px;">Fermer</button></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('#jd-close').onclick=close; ov.addEventListener('click',ev=>{ if(ev.target===ov) close(); });
}
function refreshJournalResults(){ const el=document.getElementById('journal-results'); if(el) el.innerHTML = journalResultsHtml(); }

async function journalMore(){ state.journalLimit += 500; await loadJournal(); render(); }
function exportJournalCsv(){
  const list = journalFiltered();
  const rows = [['Date','Heure','Personne','Action','Détail','Précisions']].concat(list.map(j=>{ const d=new Date(j.created_at); return [d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}), j.user_name||'', j.action||'', j.target_label||'', journalDetailText(j)]; }));
  const csv = rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')).join(String.fromCharCode(10));
  const blob = new Blob([String.fromCharCode(0xFEFF)+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='journal-optepia.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

    <div class="field"><label>Période pour l'historique (contrôles, prêts, journal)</label><select style="${sel}" onchange="setInsp('months',this.value)">${[['3','3 derniers mois'],['6','6 derniers mois'],['12','12 derniers mois'],['24','24 derniers mois'],['0','Tout l\'historique']].map(o=>`<option value="${o[0]}" ${I.months===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
  </div>
  <div class="card"><h3 style="margin:0 0 6px;color:var(--text);">Contenu</h3>
    ${INSP_BLOCKS.map(b=>chk(b[1], I.blocks[b[0]], `setInspBlock('${b[0]}',this.checked)`)).join('')}
  </div>
  <div class="card"><h3 style="margin:0 0 6px;color:var(--text);">Options</h3>
    ${chk('Masquer les noms de personnes (vérificateurs, emprunteurs, auteurs) — pour un envoi hors de l\'unité', I.hideNames, "setInsp('hideNames',this.checked)")}
    ${chk('Inclure les signatures des contrôles (registre et fiches)', I.signatures, "setInsp('signatures',this.checked)")}
    ${chk('Inclure les photos dans les fiches individuelles', I.photos, "setInsp('photos',this.checked)")}

  <button class="btn btn-primary" ${state.busy?'disabled':''} onclick="buildInspection()">${state.busy?'<span class="spinner"></span>':'Générer le dossier'}</button>`;

async function buildInspection(){
  const I = state.insp; state.busy=true; render();
  try{
    I.audit = [];
    if(I.blocks.rebut || I.blocks.journal){
      const { data, error } = await sb.from('audit_log').select('*').eq('unit_id', state.unit.id).order('created_at',{ascending:false}).limit(2000);
      if(error) throw error;
      I.audit = data || [];
    }
    I.generatedAt = new Date(); state.busy=false; state.view='inspectionDoc'; render(); window.scrollTo(0,0);
  }catch(err){ state.busy=false; render(); showToast(err.message||'Erreur'); }
}
function inspStart(){ const m=parseInt(state.insp.months,10); if(!m) return null; const d=new Date(); d.setMonth(d.getMonth()-m); return d.toISOString().slice(0,10); }

function ctlLabel(s){ return s==='conforme'?'Conforme':s==='reserve'?'Conforme avec réserve':s==='reforme'?'Réformé':(s||'—'); }
function lastCtl(e){ const cs=(e.controls||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)); return cs[0]||null; }
function ctlColor(s){ return s==='conforme'?'#1a8f5f':s==='reserve'?'#b97800':'#c4243a'; }
function stColor(l){ return l==='Conforme'?'#1a8f5f':(l==='Contrôle proche'||l==='Fin de vie proche'||l==='Jamais contrôlé')?'#b97800':'#c4243a'; }
function renderInspectionDoc(){

  const inScope = e=>!I.famille || (e.famille||'Sans famille')===I.famille;
  const eq = state.equipment.filter(e=>!e.deleted_at && inScope(e));
  const trashed = state.equipment.filter(e=>e.deleted_at && inScope(e));
  const byName = (a,b)=>((a.famille||'Sans famille').localeCompare(b.famille||'Sans famille')) || (a.designation||'').localeCompare(b.designation||'');
  eq.sort(byName);
  const reformed = eq.filter(isReformed);
  const inService = eq.filter(e=>!isReformed(e));
  const cnt = {}; inService.forEach(e=>{ const l=statusOf(e).label; cnt[l]=(cnt[l]||0)+1; });
  const reserve = inService.filter(e=>{ const c=lastCtl(e); return c && c.statut==='reserve'; }).length;
  const aJour = inService.filter(e=>['Conforme','Contrôle proche','Fin de vie proche'].includes(statusOf(e).label)).length;
  const taux = inService.length ? Math.round(100*aJour/inService.length) : null;

          ${cs.map(c=>`<tr><td>${fmtDate(c.date)}</td><td><b style="color:${ctlColor(c.statut)};">${esc(ctlLabel(c.statut))}</b></td><td>${esc(c.observations||'—')}</td><td>${nm(c.verificateur_name)}</td>${I.signatures?`<td>${I.hideNames?'—':sigImg(c.signature_url)||'—'}</td>`:''}</tr>`).join('')}</tbody></table>`}</div>`; }).join(''));

  return `

  <div class="sheet insp"><div class="insp-w">${sections.join('')}</div></div>`;

function invOpts(){ if(!state.inv) state.inv={famille:'',detail:false,hs:true}; return state.inv; }
function invItems(){
  const o=invOpts();
  return state.equipment.filter(e=>!e.deleted_at && (!o.famille || (e.famille||'Sans famille')===o.famille) && (o.hs || !['Hors service','Réformé'].includes(statusOf(e).label)));
}
function invGroups(){
  const groups={};
  invItems().forEach(e=>{ (groups[groupKey(e)]=groups[groupKey(e)]||[]).push(e); });
  return Object.keys(groups).map(k=>{
    const g=groups[k], f=g[0];
    const cls=x=>statusOf(x).cls;
    return { famille:f.famille||'Sans famille', sous:f.sous_famille||'', designation:f.designation||'Sans désignation', marque:f.marque||'',
      items:g.slice().sort((a,b)=>(a.numero_serie||a.identification||'').localeCompare(b.numero_serie||b.identification||'')),
      n:g.length, ok:g.filter(x=>cls(x)==='badge-ok').length, warn:g.filter(x=>cls(x)==='badge-warn').length, ko:g.filter(x=>cls(x)==='badge-danger').length,
      out:g.filter(x=>(x.loans||[]).some(l=>l.status==='en_cours')).length };
  }).sort((a,b)=>a.famille.localeCompare(b.famille)||a.sous.localeCompare(b.sous)||a.designation.localeCompare(b.designation)||a.marque.localeCompare(b.marque));
}

function exportInventoryCsv(){

    headers=['Famille','Sous-famille','Désignation','Marque','N° série','Identification','Statut','Prochain contrôle','Fin de vie'];
    rows=[]; G.forEach(g=>g.items.forEach(e=>{ const l=lastCtl(e); rows.push([g.famille,g.sous,g.designation,g.marque,e.numero_serie,e.identification,statusOf(e).label,l?addYears(l.date,1):'',e.date_fin_vie]); }));
