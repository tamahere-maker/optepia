<style>
  :root{
    --bg:#0B1014; --surface:#121A20; --surface2:#1A242C; --border:#27343E;
    --text:#EEF3F5; --text-muted:#8A9AA5;
    --accent:#37D69A; --accent-dim:#06A58F; --on-accent:#06150F;
    --brand-grad:linear-gradient(135deg,#95F2A6 0%,#37D69A 50%,#0A9FA0 100%);

    --ok-bg:rgba(55,214,154,.14); --warn-bg:rgba(255,178,31,.14); --danger-bg:rgba(255,84,104,.14);

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  p{margin:0;} button{font-family:var(--font-body);cursor:pointer;border:none;}

  .topbar{position:sticky;top:0;z-index:10;background:rgba(11,16,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;}

  .topbar small{color:var(--text-muted);font-size:11px;font-weight:500;display:block;margin-top:2px;}
  main{padding:16px;max-width:760px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .card.tap{cursor:pointer;transition:border-color .15s,transform .1s;}

  .field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;}

  .unit-card.selected{border-color:var(--accent);background:linear-gradient(0deg,rgba(55,214,154,.06),rgba(55,214,154,.06)),var(--surface);}
  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(18,26,32,.97);border-top:1px solid var(--accent);backdrop-filter:blur(10px);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .grid2 .field input:disabled{opacity:.6;}
  .alert{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
  .alert:first-of-type{border-top:none;}
  .alert .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--text-muted);}
  .alert.warn .dot{background:var(--warn);} .alert.danger .dot{background:var(--danger);} .alert.info .dot{background:var(--accent-dim);}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(5,8,10,.78);display:flex;align-items:center;justify-content:center;padding:20px;}
  .dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .dlg-b{font-size:14px;line-height:1.5;color:var(--text);}
  .dlg-b p{margin:0 0 8px;}
  .dl{margin:8px 0;padding-left:18px;font-size:13px;}
  .dl li{margin-bottom:8px;}
  .dlg-in{width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:16px;}
  .dlg-act{display:flex;gap:10px;margin-top:16px;}
  .dlg-act .btn{flex:1;}
  .spinner.big{width:30px;height:30px;border-width:3px;border-color:rgba(238,243,245,.25);border-top-color:var(--accent);}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;max-width:90%;text-align:center;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(6,21,15,.3);border-top-color:var(--on-accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-wrap{padding:56px 24px 40px;max-width:400px;margin:0 auto;}
  .lockup{text-align:center;margin-bottom:26px;}
  .lockup img.m{width:92px;height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 22px rgba(55,214,154,.28));}
  .lockup img.w{width:150px;height:auto;display:block;margin:0 auto;}
  .lockup .tag-admin{display:inline-block;margin-top:14px;font-size:10px;padding:4px 9px;}
  .login-sub{text-align:center;margin-bottom:24px;}
  .splash{padding:90px 20px;text-align:center;color:var(--text-muted);}
  .splash img{width:64px;display:block;margin:0 auto 14px;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.45;}}
  .foot-brand{text-align:center;margin-top:26px;opacity:.55;}
  .foot-brand img{width:90px;height:auto;}
</style>

function freshState(){
  return { view:'loading', session:null, isAdmin:false, mfaEnrolled:true, mfaFactor:null,
    units:[], allMembers:[], allEquipment:[], platformStats:null, storageByUnit:{}, userEmails:{},
    billing:{}, unitAct:{}, userAct:[], backups:[], adminLog:null, sqlMissing:false, sqlMsg:'',
    sel:new Set(), sort:'name', filter:'all', unitDetailId:null, unitTab:'materiel', search:'',
    busy:false, error:null, modal:null, modalTyped:'', progress:null,
    catalog:[], catLoaded:false, catMissing:false, catSearch:'', catLimit:100 };

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let signedUrlCache = {};
async function resolveSignedUrls(paths){
  const all = [...new Set((paths||[]).filter(Boolean))];
  const uniq = all.filter(p=>!p.startsWith('catalogue:'));
  const now = Date.now();
  const cats = all.filter(p=>p.startsWith('catalogue:') && (!signedUrlCache[p] || signedUrlCache[p].expires < now + 5*60*1000));
  if(cats.length){
    try{
      const { data } = await sb.storage.from('catalogue').createSignedUrls(cats.map(p=>p.slice(10)), 3600);
      (data||[]).forEach(d=>{ if(d.signedUrl) signedUrlCache['catalogue:'+d.path] = { url:d.signedUrl, expires: now + 3600*1000 }; });
    }catch(e){}
  }
  const need = uniq.filter(p=>!signedUrlCache[p] || signedUrlCache[p].expires < now + 5*60*1000);
  if(need.length===0) return;
  try{
    const { data, error } = await sb.storage.from('registre-materiel').createSignedUrls(need, 3600);
    if(error) throw error;
    let failCount = 0; let firstErr = '';
    (data||[]).forEach(d=>{
      if(d.signedUrl) signedUrlCache[d.path] = { url: d.signedUrl, expires: now + 3600*1000 };
      else { failCount++; if(!firstErr && d.error) firstErr = d.error; }
    });
    if(failCount>0) state.error = `${failCount} lien(s) image non générés${firstErr?' — '+firstErr:''} (droits insuffisants sur ces fichiers ?)`;
  }catch(e){ state.error = "Erreur liens images : " + (e.message||String(e)); }
}
function imgSrc(v){ if(!v) return ''; const cached = signedUrlCache[v]; return cached ? cached.url : ''; }
function imgFallback(imgEl){
  const url = imgEl.src;
  const div = document.createElement('div');
  div.className = 'muted'; div.style.fontSize='11px';
  div.textContent = 'Image indisponible';
  imgEl.replaceWith(div);
}
function fmtDate(d){ if(!d) return '—'; const p=(''+d).slice(0,10).split('-'); if(p.length!==3) return d; return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function daysUntil(d){ if(!d) return null; const t=new Date((''+d).slice(0,10)+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function addYears(d,n){ if(!d) return null; const p=(''+d).slice(0,10).split('-').map(Number); return new Date(p[0]+n,p[1]-1,p[2]).toISOString().slice(0,10); }
function statusOf(e){
  const dfv = daysUntil(e.date_fin_vie);
  if(dfv!==null && dfv<0) return {label:'Hors service', cls:'badge-danger'};
  const controls = e.controls||[];
  const last = controls.length ? controls.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  if(last){
    const dNext = daysUntil(addYears(last.date,1));
    if(dNext!==null && dNext<0) return {label:'Contrôle dépassé', cls:'badge-danger'};
    if(dNext!==null && dNext<30) return {label:'Contrôle proche', cls:'badge-warn'};
  } else { return {label:'Jamais contrôlé', cls:'badge-warn'}; }
  if(dfv!==null && dfv<60) return {label:'Fin de vie proche', cls:'badge-warn'};
  return {label:'Conforme', cls:'badge-ok'};
}

function ago(d){
  if(!d) return null;
  const n = Math.floor((Date.now() - new Date(d).getTime())/86400000);
  if(n<=0) return "aujourd'hui"; if(n===1) return 'hier'; return 'il y a '+n+' j';
}
function daysSince(d){ return d ? Math.floor((Date.now() - new Date(d).getTime())/86400000) : null; }
function isRetry(){ return false; }

/* ---------------- Connexion / 2FA ---------------- */
async function init(){
  if(!sb) return;
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(!session){ state.view='login'; render(); return; }
  await checkAdminAndLoad();
}
async function checkAdminAndLoad(){
  try{
    const { data } = await sb.from('platform_admins').select('user_id').eq('user_id', state.session.user.id).maybeSingle();
    state.isAdmin = !!data;
    if(!state.isAdmin){ state.view='denied'; render(); return; }
    try{
      const aal = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      const d = aal.data || {};
      state.mfaEnrolled = (d.nextLevel==='aal2') || (d.currentLevel==='aal2');
      if(d.nextLevel==='aal2' && d.currentLevel!=='aal2'){
        const f = await sb.auth.mfa.listFactors();
        state.mfaFactor = ((f.data&&f.data.totp)||[]).find(x=>x.status==='verified') || null;
        state.view='mfa'; render(); return;
      }
    }catch(e){ state.mfaEnrolled = false; }
    await loadAll();
    state.view='units';
  }catch(err){ state.error = err.message; state.view='denied'; }
  render();
}
async function doMfa(){
  const code = (document.getElementById('au-code').value||'').trim();
  if(!/^\d{6}$/.test(code)){ showErr('Code à 6 chiffres requis'); return; }
  if(!state.mfaFactor){ showErr('Aucun facteur 2FA trouvé'); return; }
  state.busy=true; render();
  try{
    const ch = await sb.auth.mfa.challenge({ factorId: state.mfaFactor.id });
    if(ch.error) throw ch.error;
    const v = await sb.auth.mfa.verify({ factorId: state.mfaFactor.id, challengeId: ch.data.id, code });
    if(v.error) throw v.error;
  }catch(e){ state.busy=false; showErr(e.message||'Code incorrect'); return; }
  state.busy=false;
  await checkAdminAndLoad();
}

/* ----- place prise par le catalogue (lecture des tailles dans le bucket) ----- */
async function loadCatStorage(){
  state.catStorage = {loading:true};
  try{
    const out={fiches:0,photos:0,nf:0,np:0};
    for(const dir of ['fiches','photos']){
      for(let off=0; off<20000; off+=1000){
        const { data, error } = await sb.storage.from(CAT_BUCKET).list(dir, {limit:1000, offset:off});
        if(error) throw error;
        (data||[]).forEach(o=>{ if(o && o.id){ const sz=(o.metadata&&o.metadata.size)||0; if(dir==='fiches'){ out.fiches+=sz; out.nf++; } else { out.photos+=sz; out.np++; } } });
        if(!data || data.length<1000) break;
      }
    }
    state.catStorage = out;
  }catch(e){ state.catStorage = {error:e.message||'erreur'}; }
  if(state.view==='units') render();
}
/* ----- place prise par les sauvegardes (RPC admin_backup_stats) ----- */
async function loadBkStats(){
  state.bkStats = {loading:true};
  try{
    const { data, error } = await sb.rpc('admin_backup_stats');
    if(error) throw error;
    const r = Array.isArray(data)?data[0]:data;
    state.bkStats = {n:Number(r.backups_count)||0, db:Number(r.db_bytes)||0, files:Number(r.files_bytes)||0, nf:Number(r.files_count)||0};
  }catch(e){ state.bkStats = {error:e.message||'erreur'}; }
  if(state.view==='units') render();
}
/* ---------------- Chargement ---------------- */
async function loadAll(){
  const [unitsRes, membersRes, equipRes, statsRes, storageRes, emailsRes, billRes, actRes, uactRes, bkRes] = await Promise.all([
    sb.from('units').select('*'),
    sb.from('unit_members').select('*'),
    sb.from('equipment').select('*, controls(*), loans(*)'),
    sb.rpc('get_platform_stats'),
    sb.rpc('get_storage_stats_by_unit'),
    sb.rpc('get_user_emails'),
    sb.from('unit_billing').select('*'),
    sb.rpc('admin_unit_activity'),
    sb.rpc('admin_user_activity'),
    sb.rpc('admin_list_backups')
  ]);
  state.units = (unitsRes.data||[]).sort((a,b)=>a.name.localeCompare(b.name));
  state.allMembers = membersRes.data || [];
  state.allEquipment = equipRes.data || [];
  state.platformStats = (statsRes.data && statsRes.data[0]) || null;
  state.storageByUnit = {};
  (storageRes.data||[]).forEach(row=>{ state.storageByUnit[row.unit_id] = row; });
  state.userEmails = {};
  if(emailsRes.error){ state.error = "Emails indisponibles : " + emailsRes.error.message; }
  else (emailsRes.data||[]).forEach(row=>{ state.userEmails[row.user_id] = row.email; });
  state.sqlMissing = !!(bkRes.error || actRes.error || uactRes.error || billRes.error);
  state.sqlMsg = (bkRes.error||actRes.error||uactRes.error||billRes.error||{}).message || '';
  state.billing = {}; (billRes.data||[]).forEach(r=>{ state.billing[r.unit_id] = r; });

function formatBytes(bytes){
  if(bytes===null || bytes===undefined) return '—';
  if(bytes < 1024) return bytes + ' o';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' Ko';
  if(bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' Mo';
  return (bytes/(1024*1024*1024)).toFixed(2) + ' Go';
}

/* ---------------- Sauvegardes (client) ---------------- */
const EXISTS_RE = /exist|duplicate|409/i;
async function mirrorFiles(backupId, paths, prefix){
  const total = paths.length; let done=0, failed=0;
  const st = sb.storage.from('registre-materiel');
  for(let i=0;i<paths.length;i+=6){
    await Promise.all(paths.slice(i,i+6).map(async p=>{
      try{
        const { error } = await st.copy(p, p, { destinationBucket:'unit-backups' });
        if(error && !EXISTS_RE.test((error.message||'')+' '+(error.statusCode||'')+' '+(error.status||''))) failed++;
      }catch(e){ failed++; }
      done++;
    }));
    setProgress(`${prefix} — fichiers ${Math.min(done,total)}/${total}`);
  }
  await sb.rpc('admin_set_backup_mirrored', { p_id:backupId, p_ok: failed===0 });
  return { total, failed };
}
async function pruneBackups(){
  const { data, error } = await sb.rpc('admin_prune_backups');
  if(error || !data || !data.length) return;
  const b = sb.storage.from('unit-backups');
  for(let i=0;i<data.length;i+=100) await b.remove(data.slice(i,i+100));
}
async function backupUnits(ids, opts){
  opts = opts || {};
  const res = [];
  setProgress('Sauvegarde des données…');
  const { data, error } = await sb.rpc('admin_backup_units', { p_units:ids, p_label:opts.label||null, p_kind:opts.kind||'manual' });
  if(error) throw new Error(error.message + (/function|schema cache/i.test(error.message)?' — le SQL d\'installation des sauvegardes n\'est pas encore exécuté.':''));
  for(const it of (data||[])){
    const u = state.units.find(x=>x.id===it.unit_id);
    const m = await mirrorFiles(it.backup_id, it.file_paths||[], u?u.name:'Unité');
    res.push({ unit_id:it.unit_id, name:u?u.name:'', backup_id:it.backup_id, total:m.total, failed:m.failed, paths:it.file_paths||[] });
  }
  setProgress('Nettoyage des anciennes sauvegardes…');
  await pruneBackups();
  await loadBackupsOnly();
  return res;
}
function backupSummaryHtml(res){
  return '<ul class="dl">'+res.map(r=>`<li><b>${esc(r.name)}</b> — données sauvegardées${r.total?`, ${r.total-r.failed}/${r.total} fichier(s) copié(s)`:''}${r.failed?` <span style="color:var(--danger)">(${r.failed} fichier(s) non copié(s))</span>`:''}</li>`).join('')+'</ul>';
}

function askRestore(backupIds){
  const rows = backupIds.map(id=>state.backups.find(b=>b.id===id)).filter(Boolean);

    onConfirm:()=>doRestore(rows.map(b=>b.id)) });

function askRestoreLatest(unitIds){
  const ids = []; const none = [];
  unitIds.forEach(uid=>{ const b = latestBackup(uid); if(b) ids.push(b.id); else { const u=state.units.find(x=>x.id===uid); none.push(u?u.name:uid); } });
  if(!ids.length){ openInfo('Aucune sauvegarde', `<p>Aucune sauvegarde disponible pour : ${esc(none.join(', '))}.</p>`); return; }
  if(none.length) showErr('Sans sauvegarde (ignorées) : '+none.join(', '));
  askRestore(ids);
}
async function restoreFiles(paths, prefix){
  const src = sb.storage.from('unit-backups');
  let ok=0, there=0, missing=0;
  for(let i=0;i<paths.length;i+=6){
    await Promise.all(paths.slice(i,i+6).map(async p=>{
      try{
        const { error } = await src.copy(p, p, { destinationBucket:'registre-materiel' });
        if(!error) ok++;
        else if(EXISTS_RE.test((error.message||'')+' '+(error.statusCode||'')+' '+(error.status||''))) there++;
        else missing++;
      }catch(e){ missing++; }
    }));
    setProgress(`${prefix} — fichiers ${Math.min(i+6,paths.length)}/${paths.length}`);
  }
  return { ok, there, missing };
}
async function doRestore(ids){
  await runOp('Restauration en cours…', async ()=>{
    const out = [];
    for(const id of ids){
      const b = state.backups.find(x=>x.id===id);
      const name = b ? b.unit_name : 'Unité';
      setProgress(`${name} — restauration des données…`);
      const { data, error } = await sb.rpc('admin_restore_backup', { p_backup_id:id });
      if(error) throw new Error(`${name} : ${error.message}`);
      const f = await restoreFiles(data.file_paths||[], name);
      out.push({ name, data, f });
      delete journalCache[data.unit_id];
    }
    setProgress('Actualisation…');
    await pruneBackups();
    await loadAll();
    return { title:'Restauration terminée', body:'<ul class="dl">'+out.map(o=>`<li><b>${esc(o.name)}</b> — ${countsText(o.data.counts)}${o.f.ok+o.f.there+o.f.missing?`<div class="muted" style="font-size:12px;">Fichiers : ${o.f.ok} remis, ${o.f.there} déjà présents${o.f.missing?`, <span style="color:var(--warn)">${o.f.missing} introuvables dans la copie</span>`:''}</div>`:''}${o.data.members_skipped?`<div class="muted" style="font-size:12px;color:var(--warn)">${o.data.members_skipped} membre(s) non remis (compte supprimé depuis).</div>`:''}</li>`).join('')+'</ul>' };
  });
}
function countsText(c){

function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob); const a=document.createElement('a');

  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function csvCell(v){ v = (v===null||v===undefined)?'':String(v); return /[;"\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(filename, header, rows){
  const txt = '﻿' + [header].concat(rows).map(r=>r.map(csvCell).join(';')).join('\r\n');
  saveBlob(new Blob([txt], {type:'text/csv;charset=utf-8'}), filename);
}
function slug(s){ return (s||'unite').replace(/[^a-z0-9]+/gi,'-').toLowerCase(); }
function exportEquipCsv(unitId){

function exportLoansCsv(unitId){

    fmtDate(l.checkout_date), fmtDate(l.expected_return_date), fmtDate(l.return_date), l.return_condition, l.refusal_reason, l.created_by_name ]);
  downloadCsv(`prets-${slug(u.name)}-${new Date().toISOString().slice(0,10)}.csv`,

}

function visibleUnits(){
  const q = state.search.toLowerCase();
  let list = state.units.filter(u=>!q || u.name.toLowerCase().includes(q));
  const f = state.filter;
  list = list.filter(u=>{
    const b = state.billing[u.id];
    if(f==='essai') return b && b.status==='essai';
    if(f==='impaye') return b && b.status==='impaye';
    if(f==='dormant') return isDormant(u);
    if(f==='problems') return problemsOf(u.id)>0;
    if(f==='nobackup'){ const lb=latestBackup(u.id); return !lb || daysSince(lb.created_at)>7; }
    return true;
  });
  const act = u=>{ const a=state.unitAct[u.id]; return a&&a.last_action_at?new Date(a.last_action_at).getTime():0; };
  const S = {
    name:(a,b)=>a.name.localeCompare(b.name),
    recent:(a,b)=>new Date(b.created_at)-new Date(a.created_at),
    activity:(a,b)=>act(b)-act(a),
    problems:(a,b)=>problemsOf(b.id)-problemsOf(a.id),
    storage:(a,b)=>((state.storageByUnit[b.id]||{}).total_bytes||0)-((state.storageByUnit[a.id]||{}).total_bytes||0)
  };
  return list.sort(S[state.sort]||S.name);
}

function renderAlerts(){

  if(!state.mfaEnrolled) A.push({lvl:'warn', t:"Double authentification non activée sur ton compte admin", d:"Active-la dans le profil de l'application : l'accès admin est très sensible."});

    const catB = (state.catStorage && !state.catStorage.loading && !state.catStorage.error) ? state.catStorage.fiches+state.catStorage.photos : 0;
    const bkF = (state.bkStats && !state.bkStats.loading && !state.bkStats.error) ? state.bkStats.files : 0;
    const p = (s.storage_total_bytes+catB+bkF)/(1024*1024*1024);
    if(p>0.7) A.push({lvl:p>0.9?'danger':'warn', t:`Stockage fichiers à ${(p*100).toFixed(0)} % de 1 Go`, d:'Passe en Supabase Pro ou nettoie les fichiers inutiles.'});
    const d = s.db_size_bytes/(500*1024*1024);

function renderStackedBar(parts, capBytes){
  const total = parts.reduce((t,x)=>t+x.bytes,0);
  const over = capBytes && total/capBytes>0.9;
  let used=0;
  const segs = parts.map(x=>{ const w = capBytes? Math.min(100-used, (x.bytes/capBytes)*100) : 0; used+=w; return `<div style="width:${w.toFixed(1)}%;height:100%;background:${x.color};"></div>`; }).join('');
  return `<div style="display:flex;background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;margin:6px 0 4px;${over?'outline:1px solid var(--danger);':''}">${segs}</div>`;
}
function renderUsageBar(usedBytes, capBytes){
  const pct = capBytes ? Math.min(100, (usedBytes/capBytes)*100) : 0;
  const color = pct>90?'var(--danger)':pct>70?'var(--warn)':'var(--accent)';
  return `<div style="background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;margin:6px 0 4px;"><div style="width:${pct.toFixed(1)}%;height:100%;background:${color};"></div></div>`;
}

/* ----- détail d'une unité ----- */
const GRACE_DAYS = 14; // doit rester identique à unit_access() en SQL
function accessOf(b){
  if(!b) return {mode:'full', label:'Accès complet (aucun abonnement renseigné)'};
  const today = new Date(); today.setHours(0,0,0,0);
  const D = x=>{ const d=new Date(String(x).slice(0,10)+'T00:00:00'); return d; };
  const add = (x,n)=>{ const d=D(x); d.setDate(d.getDate()+n); return d; };
  const f = d=>d.toLocaleDateString('fr-FR');
  if(b.status==='actif') return {mode:'full', label:'Accès complet'};
  if(b.status==='essai'){
    if(!b.trial_ends || today<=D(b.trial_ends)) return {mode:'full', label:'Accès complet'+(b.trial_ends?' (essai jusqu\'au '+f(D(b.trial_ends))+')':'')};
    const g = add(b.trial_ends, GRACE_DAYS);
    return today<=g ? {mode:'grace', label:'Période de grâce jusqu\'au '+f(g)} : {mode:'readonly', label:'Lecture seule (essai terminé)'};
  }
  if(b.status==='impaye'){
    const g = b.grace_ends ? D(b.grace_ends) : add(b.updated_at||new Date(), GRACE_DAYS);
    return today<=g ? {mode:'grace', label:'Période de grâce jusqu\'au '+f(g)} : {mode:'readonly', label:'Lecture seule (impayé)'};
  }
  return {mode:'readonly', label:'Lecture seule (résilié)'};
}
async function extendTrial(unitId, days){
  const b = state.billing[unitId] || {};
  const base = b.trial_ends && new Date(b.trial_ends) > new Date() ? new Date(b.trial_ends) : new Date();
  base.setDate(base.getDate()+days);
  const iso = base.toISOString().slice(0,10);
  state.busy=true; render();
  const { error } = await sb.from('unit_billing').upsert({ unit_id:unitId, plan:b.plan||'essai', status:'essai', trial_ends:iso, seats:b.seats??null, price_month:b.price_month??null, notes:b.notes||null }, { onConflict:'unit_id' });
  state.busy=false;
  if(error){ showErr(error.message); return; }
  state.billing[unitId] = Object.assign({}, b, { status:'essai', trial_ends:iso });
  const u = state.units.find(x=>x.id===unitId);
  logAdmin('Essai prolongé', u?u.name:unitId, { jours:days, trial_ends:iso });
  showErr('Essai prolongé jusqu\'au '+new Date(iso+'T12:00:00').toLocaleDateString('fr-FR'));
}

function askDeleteUnit(unitId){
  const u = state.units.find(x=>x.id===unitId); if(!u) return;
  openModal({ title:'Supprimer cette unité ?', danger:true, typed:u.name, confirmLabel:'Supprimer',
    body:`<p>Une sauvegarde complète (données + fichiers) est créée automatiquement avant la suppression.</p><p style="font-size:13px;margin-top:10px;">Pour confirmer, tape exactement le nom de l'unité :</p><p><b>${esc(u.name)}</b></p>`,
    onConfirm:()=>runOp('Sauvegarde avant suppression…', async ()=>{
      const res = await backupUnits([unitId], { kind:'pre-delete', label:'Avant suppression' });
      if(!res.length || res[0].failed>0) throw new Error('La sauvegarde des fichiers est incomplète : suppression annulée, rien n\'a été supprimé.');
      setProgress('Suppression de l\'unité…');
      const { error } = await sb.rpc('delete_unit_as_admin', { target_unit_id: unitId });
      if(error) throw error;
      // Supabase interdit le DELETE direct sur storage.objects : les fichiers sont supprimés par l'API Storage
      const paths = res[0].paths || []; let rmFailed = 0;
      for(let i=0;i<paths.length;i+=100){
        setProgress(`Suppression des fichiers ${Math.min(i+100,paths.length)}/${paths.length}…`);
        const { error: e2 } = await sb.storage.from('registre-materiel').remove(paths.slice(i,i+100));
        if(e2) rmFailed += Math.min(100, paths.length-i);
      }
      logAdmin('Unité supprimée', u.name, { unit_id:unitId, backup_id:res[0].backup_id });
      state.view='units';
      await loadAll();
      return { title:'Unité supprimée', body:`<p>« ${esc(u.name)} » a été supprimée. Elle reste restaurable depuis l'onglet <b>Sauvegardes</b>.</p>${rmFailed?`<p class="muted" style="font-size:12px;">${rmFailed} fichier(s) n'ont pas pu être effacés du stockage (ils restent dans la sauvegarde).</p>`:''}` };
    }) });
}

/* ---- Pièces jointes du support ---- */
const SUP_MAX_FILES=3, SUP_MAX_BYTES=5*1024*1024;
function supPickFiles(inp){
  const cur=state.supFiles||[]; const err=[];
  for(const f of inp.files){
    if(cur.length>=SUP_MAX_FILES){ err.push('3 fichiers maximum'); break; }
    if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)){ err.push(f.name+' : format non pris en charge'); continue; }
    cur.push(f);
  }
  inp.value=''; state.supFiles=cur; supSyncDraft(); render(); if(err.length) showErr(err[0]);
}
function supRmFile(i){ state.supFiles.splice(i,1); supSyncDraft(); render(); }
function supSyncDraft(){ const s=document.getElementById('sup-subject'), b=document.getElementById('sup-body'), r=document.getElementById('sup-reply'); if(s&&state.supDraft) state.supDraft.subject=s.value; if(b&&state.supDraft) state.supDraft.body=b.value; if(r) state.supReply=r.value; }
function supFilesPicker(){
  const fs=state.supFiles||[];
  return `<div class="field"><label>Pièces jointes (facultatif)</label>
    ${fs.map((f,i)=>`<div class="card" style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;"><span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📎 ${esc(f.name)}</span><span class="muted" style="font-size:12px;">${Math.max(1,Math.round(f.size/1024))} Ko</span><button type="button" class="btn btn-ghost" style="width:auto;padding:4px 10px;" onclick="supRmFile(${i})">✕</button></div>`).join('')}
    ${fs.length<SUP_MAX_FILES?`<label class="btn btn-secondary" style="display:block;text-align:center;cursor:pointer;">+ Ajouter une photo ou un PDF<input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple style="display:none;" onchange="supPickFiles(this)"></label>`:''}
    <p class="muted" style="font-size:12px;margin-top:6px;">Images (JPG, PNG, WebP) ou PDF · 3 fichiers, 5 Mo chacun.</p></div>`;
}
async function supShrink(f){
  if(f.type==='application/pdf') return f;
  try{
    const bmp=await createImageBitmap(f); const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(sc===1 && f.size<=1.5*1024*1024) return f;
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob?new File([blob],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f;
  }catch(e){ return f; }
}
async function supUploadFiles(ticketId){
  const out=[];
  for(const f0 of (state.supFiles||[])){
    const f=await supShrink(f0);
    if(f.size>SUP_MAX_BYTES) throw new Error(f0.name+' dépasse 5 Mo');
    const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=ticketId+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(16).slice(2))+'.'+ext;
    const {error}=await sb.storage.from('support-files').upload(path,f,{contentType:f.type});
    if(error) throw error;
    out.push({path,name:f0.name,type:f.type,size:f.size});
  }
  return out;
}

const CAT_BUCKET = 'catalogue';
let catUrlCache = {};
function catNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/œ/g,'o').replace(/æ/g,'a').replace(/[^a-z0-9]+/g,''); }
async function resolveCatUrls(paths){
  const now=Date.now();
  const need=[...new Set((paths||[]).filter(Boolean))].filter(p=>!catUrlCache[p]||catUrlCache[p].expires<now+300000);
  if(!need.length) return;
  try{
    for(let i=0;i<need.length;i+=100){
      const { data } = await sb.storage.from(CAT_BUCKET).createSignedUrls(need.slice(i,i+100), 3600);
      (data||[]).forEach(d=>{ if(d.signedUrl) catUrlCache[d.path]={url:d.signedUrl,expires:now+3600000}; });
    }
  }catch(e){}
}
function catUrl(p){ const c=p&&catUrlCache[p]; return c?c.url:''; }

let catLoading=false;
async function loadCatalog(){
  if(catLoading) return; catLoading=true;
  const { data, error } = await sb.from('equipment_catalog').select('*').order('marque').order('designation').limit(5000);
  if(error){
    state.catMissing = /equipment_catalog|relation|schema cache|does not exist|42P01/i.test(error.message||error.code||'');
    state.catalog = []; state.catLoaded = true;
    if(!state.catMissing) state.error = error.message;
  } else { state.catalog = data||[]; state.catMissing=false; state.catLoaded=true; }
  await resolveCatUrls(state.catalog.map(c=>c.photo_path));
  catLoading=false;
  if(state.view==='catalog') render();
}
function visibleCatalog(){
  const q = catNorm(state.catSearch||'');

/* ----- fichiers : photo réduite en JPEG ----- */
function fileToJpegBlob(file, maxDim){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      let w=img.width,h=img.height; const k=Math.min(1,(maxDim||900)/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
      x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error('Image illisible')); },'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Image illisible : '+file.name)); };
    img.src=url;
  });
}
function newId(){ return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);})); }
async function catUploadPhoto(id, file){
  state.catStorage = undefined;
  const blob = await fileToJpegBlob(file, 900); const path = `photos/${id}.jpg`;
  const { error } = await sb.storage.from(CAT_BUCKET).upload(path, blob, {upsert:true, contentType:'image/jpeg'});
  if(error) throw error; return path;
}
function md5hex(buf){
  const bytes=new Uint8Array(buf), n=bytes.length;
  const K=new Int32Array(64), S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i=0;i<64;i++) K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const padLen=((n+8)>>6<<6)+64, m=new Uint8Array(padLen);
  m.set(bytes); m[n]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(padLen-8,(n<<3)>>>0,true); dv.setUint32(padLen-4,Math.floor(n/536870912),true);
  let a0=0x67452301|0,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476|0;
  const M=new Int32Array(16);
  for(let off=0;off<padLen;off+=64){
    for(let i=0;i<16;i++) M[i]=dv.getInt32(off+i*4,true);
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i;} else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)&15;} else if(i<48){F=B^C^D;g=(3*i+5)&15;} else {F=C^(B|~D);g=(7*i)&15;}
      F=(F+A+K[i]+M[g])|0; A=D; D=C; C=B; B=(B+((F<<S[i])|(F>>>(32-S[i]))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  const out=new DataView(new ArrayBuffer(16)); out.setInt32(0,a0,true);out.setInt32(4,b0,true);out.setInt32(8,c0,true);out.setInt32(12,d0,true);
  let h=''; for(let i=0;i<16;i++) h+=out.getUint8(i).toString(16).padStart(2,'0'); return h;
}

/* ----- fiches techniques partagées : un PDF identique n'est stocké qu'une seule fois ----- */
async function catFicheList(force){
  if(state.catFicheList && !force) return state.catFicheList;
  const list=[];
  for(let off=0; off<20000; off+=1000){
    const { data, error } = await sb.storage.from(CAT_BUCKET).list('fiches', {limit:1000, offset:off});
    if(error) throw error;
    (data||[]).forEach(o=>{ if(o && o.id){ const m=o.metadata||{}; list.push({path:'fiches/'+o.name, size:m.size||0, md5:String(m.eTag||'').replace(/"/g,'').toLowerCase()}); } });
    if(!data || data.length<1000) break;
  }
  state.catFicheList = list; return list;
}
async function catUploadFiche(id, file){
  if(file.size > 15*1024*1024) throw new Error('PDF trop lourd (15 Mo max) : '+file.name);
  state.catStorage = undefined;
  const md5 = md5hex(await file.arrayBuffer());
  const list = await catFicheList();
  const same = list.find(x=>x.md5===md5 && x.size===file.size);
  if(same){ if(same.path!==`fiches/${id}.pdf`) state.catShareHits=(state.catShareHits||0)+1; return same.path; }   /* déjà en stock : on réutilise ce fichier */
  let path = `fiches/${id}.pdf`;
  if(state.catalog.some(r=>r.id!==id && r.fiche_path===path)) path = `fiches/${id}-${Date.now().toString(36)}.pdf`;  /* ne jamais écraser un fichier partagé */
  const { error } = await sb.storage.from(CAT_BUCKET).upload(path, file, {upsert:true, contentType:'application/pdf'});
  if(error) throw error;
  const i=list.findIndex(x=>x.path===path); if(i>=0) list.splice(i,1);
  list.push({path, size:file.size, md5});
  return path;
}
/* supprime un ancien PDF seulement s'il n'est plus utilisé par aucune référence ni aucun matériel */
async function catReleaseFiche(oldPath){
  if(!oldPath) return false;
  if(state.catalog.some(r=>r.fiche_path===oldPath)) return false;
  if((state.allEquipment||[]).some(e=>e.fiche_technique_url==='catalogue:'+oldPath)) return false;
  const { error } = await sb.storage.from(CAT_BUCKET).remove([oldPath]);
  if(error) return false;
  if(state.catFicheList) state.catFicheList = state.catFicheList.filter(x=>x.path!==oldPath);
  state.catStorage = undefined; return true;
}

function closeCatEditor(){ const o=document.getElementById('cat-ov'); if(o) o.remove(); }
async function saveCat(id){
  const g=i=>(document.getElementById(i).value||'').trim();
  const err=document.getElementById('ce-err'), btn=document.getElementById('ce-save');
  const marque=g('ce-marque'), designation=g('ce-designation');
  if(!marque||!designation){ err.textContent='La marque et la désignation sont obligatoires.'; return; }
  let url=g('ce-url'); if(url && !/^https?:\/\//i.test(url)){ err.textContent='Le lien doit commencer par https://'; return; }
  const duree = g('ce-duree') ? parseInt(g('ce-duree'),10) : null;
  if(duree!==null && (isNaN(duree)||duree<1||duree>60)){ err.textContent='Durée de vie : entre 1 et 60 ans.'; return; }
  btn.disabled=true; btn.textContent='Enregistrement…'; err.textContent='';
  try{
    const old = id ? state.catalog.find(x=>x.id===id) : null;
    const oldFiche = old ? old.fiche_path : null;
    const rid = id || newId();
    const row = { marque, designation, famille:g('ce-famille')||null, sous_famille:g('ce-sous')||null, duree_vie_ans:duree, fiche_url:url||null };
    const pf=document.getElementById('ce-photo').files[0], ff=document.getElementById('ce-fiche').files[0];
    if(pf) row.photo_path = await catUploadPhoto(rid, pf);
    if(ff){ row.fiche_path = await catUploadFiche(rid, ff); }
    let res;
    if(old) res = await sb.from('equipment_catalog').update(row).eq('id', rid);
    else { row.id = rid; row.created_by = state.session.user.id; res = await sb.from('equipment_catalog').insert(row); }
    if(res.error){
      if(/duplicate|unique|23505/i.test(res.error.message||res.error.code)) throw new Error('Cette marque + désignation existe déjà dans le catalogue.');
      throw res.error;
    }
    if(old) Object.assign(old,row);
    if(ff && old && oldFiche && oldFiche!==row.fiche_path) await catReleaseFiche(oldFiche);
    logAdmin(old?'Catalogue : référence modifiée':'Catalogue : référence ajoutée', marque+' — '+designation);
    closeCatEditor(); await loadCatalog();
  }catch(e){ err.textContent = e.message||String(e); btn.disabled=false; btn.textContent='Enregistrer'; }
}
function catAskDelete(id){
  const c=state.catalog.find(x=>x.id===id); if(!c) return;
  closeCatEditor();
  openModal({ title:'Supprimer cette référence ?', danger:true, confirmLabel:'Supprimer',
    body:`<p><b>${esc(c.marque)} — ${esc(c.designation)}</b></p><p class="muted" style="font-size:12px;">Les matériels déjà créés dans les unités ne sont pas touchés, mais ceux qui utilisaient la fiche ou la photo du catalogue perdront ce fichier. Supprime plutôt la référence quand elle est une erreur.</p>`,
    onConfirm:()=>runOp('Suppression…', async ()=>{
      const { error } = await sb.from('equipment_catalog').delete().eq('id',id);
      if(error) throw error;
      state.catalog = state.catalog.filter(x=>x.id!==id);
      if(c.photo_path){ await sb.storage.from(CAT_BUCKET).remove([c.photo_path]); state.catStorage = undefined; }
      await catReleaseFiche(c.fiche_path);
      logAdmin('Catalogue : référence supprimée', c.marque+' — '+c.designation);
      await loadCatalog();
    }) });
}

/* ----- CSV ----- */
function parseCsv(text){
  text = String(text||'').replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0]||'';
  const delim = (first.split(';').length>first.split(',').length)?';':(first.includes('\t')?'\t':',');
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(v=>v.trim()!=='')) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if(row.some(v=>v.trim()!=='')) rows.push(row);
  return rows;
}
const CSV_COLS = ['marque','designation','famille','sous_famille','duree_vie_ans','fiche_url'];
function csvKey(h){
  const k=catNorm(h);
  if(k==='marque'||k==='brand') return 'marque';
  if(k==='designation'||k==='nom'||k==='produit'||k==='modele') return 'designation';
  if(k==='famille') return 'famille';
  if(k==='sousfamille') return 'sous_famille';
  if(k==='dureedevieans'||k==='dureevieans'||k==='dureedevie'||k==='dureevie'||k==='duree'||k==='dureedevieannees') return 'duree_vie_ans';
  if(k==='ficheurl'||k==='fiche'||k==='lien'||k==='lienfiche'||k==='url'||k==='fichetechnique') return 'fiche_url';
  return null;
}
function csvCell(v){ v=(v==null?'':String(v)); return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function catDownloadTemplate(){
  const lines=[CSV_COLS.join(';'),
    ['Petzl',"Am'D Auto",'Métallique','Connecteur','','https://www.petzl.com/…'].map(csvCell).join(';'),
    ['Petzl','Grillon','Textile','Longe','10',''].map(csvCell).join(';')];
  saveBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'modele-catalogue.csv');
}
function catExportCsv(){
  const lines=[CSV_COLS.join(';')].concat(state.catalog.map(c=>CSV_COLS.map(k=>csvCell(c[k])).join(';')));
  saveBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'catalogue-optepia-'+new Date().toISOString().slice(0,10)+'.csv');
}
function catPickCsv(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv,text/plain'; inp.style.display='none'; document.body.appendChild(inp);
  inp.onchange=async()=>{ const f=inp.files[0]; inp.remove(); if(!f) return; catPrepareImport(await f.text()); };
  inp.click();
}
let catPending = null;
function catPrepareImport(text){
  const rows=parseCsv(text);
  if(rows.length<2){ openInfo('Fichier vide','<p>Aucune ligne de données trouvée. Utilise le « Modèle CSV ».</p>'); return; }
  const head=rows[0].map(csvKey);
  if(!head.includes('marque')||!head.includes('designation')){ openInfo('Colonnes manquantes','<p>Le fichier doit avoir au moins les colonnes <b>marque</b> et <b>designation</b>. Utilise le « Modèle CSV ».</p>'); return; }
  const byKey=new Map(state.catalog.map(c=>[catNorm(c.marque)+'|'+catNorm(c.designation),c]));
  const seen=new Set(); const add=[], upd=[]; let skipped=0, dupInFile=0;
  rows.slice(1).forEach(r=>{
    const o={}; head.forEach((k,i)=>{ if(k) o[k]=(r[i]||'').trim(); });
    if(!o.marque||!o.designation){ skipped++; return; }
    const key=catNorm(o.marque)+'|'+catNorm(o.designation);
    if(seen.has(key)){ dupInFile++; return; } seen.add(key);
    if(o.duree_vie_ans){ const n=parseInt(o.duree_vie_ans,10); o.duree_vie_ans=(n>=1&&n<=60)?n:null; } else o.duree_vie_ans=null;
    if(o.fiche_url && !/^https?:\/\//i.test(o.fiche_url)) o.fiche_url='';
    const ex=byKey.get(key);
    if(ex){ const patch={}; ['famille','sous_famille','duree_vie_ans','fiche_url'].forEach(k=>{ if(o[k]!==undefined && o[k]!==''&&o[k]!==null) patch[k]=o[k]; }); if(Object.keys(patch).length) upd.push({id:ex.id,patch}); }
    else add.push(o);
  });
  catPending={add,upd};
  openModal({ title:'Importer ce fichier ?', confirmLabel:'Importer',
    body:`<ul class="dl"><li><b>${add.length}</b> nouvelle(s) référence(s)</li><li><b>${upd.length}</b> référence(s) existante(s) complétée(s) (seules les cases remplies sont écrites)</li>${skipped?`<li>${skipped} ligne(s) ignorée(s) (marque ou désignation vide)</li>`:''}${dupInFile?`<li>${dupInFile} doublon(s) dans le fichier ignoré(s)</li>`:''}</ul>`,
    onConfirm:()=>runOp('Import en cours…', async ()=>{
      const { add, upd } = catPending; let nAdd=0, nUpd=0, errs=[];
      for(let i=0;i<add.length;i+=200){
        const chunk=add.slice(i,i+200).map(o=>{ const r={marque:o.marque,designation:o.designation,created_by:state.session.user.id};
          ['famille','sous_famille','duree_vie_ans','fiche_url'].forEach(k=>{ r[k]=(o[k]===''||o[k]===undefined)?null:o[k]; }); return r; });
        const { error } = await sb.from('equipment_catalog').insert(chunk);
        if(error) errs.push(error.message); else nAdd+=chunk.length;
      }
      for(let i=0;i<upd.length;i+=10){
        const res=await Promise.all(upd.slice(i,i+10).map(u=>sb.from('equipment_catalog').update(u.patch).eq('id',u.id)));
        res.forEach(r=>{ if(r.error) errs.push(r.error.message); else nUpd++; });
      }
      logAdmin('Catalogue : import CSV', nAdd+' ajoutées, '+nUpd+' mises à jour');
      await loadCatalog();
      return { title:'Import terminé', body:`<p>${nAdd} ajoutée(s), ${nUpd} mise(s) à jour.</p>${errs.length?`<p style="color:var(--danger);font-size:12px;">${errs.length} erreur(s) : ${esc(errs[0])}</p>`:''}<p class="muted" style="font-size:12px;">Ajoute ensuite les photos et PDF avec « Associer des fichiers ».</p>` };
    }) });
}

/* ----- fichiers en lot : « Marque - Désignation.pdf / .jpg » ----- */
function catPickFiles(){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.accept='image/*,application/pdf,.pdf'; inp.style.display='none'; document.body.appendChild(inp);
  inp.onchange=()=>{ const fs=[...inp.files]; inp.remove(); if(fs.length) catPrepareFiles(fs); };
  inp.click();
}
function catMatchFile(f){
  const base=f.name.replace(/\.[^.]+$/,'');
  const nb=catNorm(base);
  let m=state.catalog.filter(c=>catNorm(c.marque+c.designation)===nb);
  if(m.length===1) return m[0];
  /* nom de fichier = désignation seule, si elle est unique dans le catalogue */
  m=state.catalog.filter(c=>catNorm(c.designation)===nb);
  return m.length===1?m[0]:null;
}
function catPrepareFiles(files){
  const ok=[], ko=[];
  files.forEach(f=>{
    const isPdf=/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name), isImg=/^image\//.test(f.type);
    if(!isPdf&&!isImg){ ko.push(f.name+' (type non pris en charge)'); return; }
    const c=catMatchFile(f); if(c) ok.push({f,c,kind:isPdf?'fiche':'photo'}); else ko.push(f.name+' (aucune référence correspondante)');
  });
  catPendingFiles=ok;
  openModal({ title:'Associer ces fichiers ?', confirmLabel: ok.length?'Associer '+ok.length+' fichier(s)':'OK', noConfirm:!ok.length,
    body:`<p><b>${ok.length}</b> fichier(s) reconnu(s), <b>${ko.length}</b> non reconnu(s).</p><p class="muted" style="font-size:12px;">Un fichier est associé quand son nom est « Marque Désignation » (ex. <i>Petzl Am'D Auto.pdf</i>). Les accents, majuscules et tirets sont ignorés. Un PDF devient la fiche, une image devient la photo.</p>${ko.length?`<details><summary class="muted" style="font-size:12px;">Non reconnus</summary><ul class="dl" style="font-size:12px;">${ko.slice(0,60).map(n=>`<li>${esc(n)}</li>`).join('')}${ko.length>60?'<li>…</li>':''}</ul></details>`:''}`,
    onConfirm:()=>runOp('Envoi des fichiers…', async ()=>{
      let done=0, errs=[], freed=0;
      state.catFicheList=undefined; state.catShareHits=0;
      for(const it of catPendingFiles){
        try{
          const oldFiche = it.c.fiche_path;
          const patch = it.kind==='fiche' ? { fiche_path: await catUploadFiche(it.c.id, it.f) } : { photo_path: await catUploadPhoto(it.c.id, it.f) };
          const { error } = await sb.from('equipment_catalog').update(patch).eq('id',it.c.id);
          if(error) throw error; done++;
          Object.assign(it.c, patch);
          if(it.kind==='fiche' && oldFiche && oldFiche!==patch.fiche_path){ if(await catReleaseFiche(oldFiche)) freed++; }
          setProgress(`Envoi des fichiers… ${done}/${catPendingFiles.length}`);
        }catch(e){ errs.push(it.f.name+' : '+(e.message||e)); }
      }
      logAdmin('Catalogue : fichiers associés', done+' fichier(s)');
      await loadCatalog();
      return { title:'Terminé', body:`<p>${done} fichier(s) associé(s).</p>${state.catShareHits?`<p class="muted" style="font-size:12px;">♻️ ${state.catShareHits} fiche(s) identique(s) à un PDF déjà en stock : partagée(s), non dupliquée(s).${freed?' '+freed+' ancien(s) fichier(s) supprimé(s).':''}</p>`:''}${errs.length?`<p style="color:var(--danger);font-size:12px;">${errs.length} erreur(s) :</p><ul class="dl" style="font-size:12px;">${errs.slice(0,10).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}` };
    }) });
}
let catPendingFiles = [];

init();
</script>
