<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="apple-touch-icon" href="icon-180.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#181D20; --surface:#20272B; --surface2:#2A3237; --border:#3A434A;
    --text:#ECEFEF; --text-muted:#8B979E; --accent:#E4572E; --accent-dim:#B8431F;
    --ok:#4F9D69; --warn:#D9A441; --danger:#C1443A;
    --font-head:'Barlow Condensed',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"]{
    --bg:#F5F3EF; --surface:#FFFFFF; --surface2:#ECE8E1; --border:#DAD5CC;
    --text:#22282B; --text-muted:#6B7378; --accent:#D14E27; --accent-dim:#B8431F;
    --ok:#3D8256; --warn:#B8811F; --danger:#B23A30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;}
  body{padding-bottom:calc(120px + env(safe-area-inset-bottom));min-height:100vh;}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;letter-spacing:0.2px;margin:0 0 4px 0;}
  h1{font-size:26px;} h2{font-size:20px;} h3{font-size:16px;color:var(--text-muted);font-weight:600;}
  p{margin:0;} a{color:var(--accent);}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  input,select,textarea{font-family:var(--font-body);}
  .topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{display:flex;flex-direction:row;align-items:center;}
  .topbar .brand small{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px 6px 6px;cursor:pointer;}
  .user-dot{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-head);flex-shrink:0;}
  .user-chip .role{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;display:block;}
  .user-chip .name{font-size:13px;font-weight:600;}
  main{padding:16px;padding-bottom:32px;max-width:640px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
  .card.tap{cursor:pointer;transition:border-color .15s;}
  .card.tap:active{border-color:var(--accent);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 12px;font-size:15px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;width:100%;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:active{background:var(--accent-dim);}
  .btn-primary:disabled{opacity:0.5;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--accent);padding:10px;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:110px;}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:20px;font-weight:700;}
  .badge-ok{background:rgba(79,157,105,0.18);color:var(--ok);}
  .badge-warn{background:rgba(217,164,65,0.18);color:var(--warn);}
  .badge-danger{background:rgba(193,68,58,0.18);color:var(--danger);}
  .mono{font-family:var(--font-mono);font-size:13px;letter-spacing:0.3px;}
  .muted{color:var(--text-muted);font-size:13px;}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;}
  .thumb-lg{width:100%;height:180px;border-radius:10px;object-fit:cover;background:var(--surface2);border:1px solid var(--border);}
  .thumb-contain{width:100%;max-height:420px;height:auto;object-fit:contain;background:var(--surface2);border-radius:10px;border:1px solid var(--border);display:block;}
  .search{display:flex;gap:8px;margin-bottom:14px;}
  .search input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;}
  .filter-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom);}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 1px 7px;color:var(--text-muted);font-size:8.8px;text-transform:uppercase;letter-spacing:0.2px;font-weight:600;background:transparent;}
  .navitem.active{color:var(--accent);}
  .navitem svg{width:18px;height:18px;}
  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .empty h3{color:var(--text-muted);}
  .backlink{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;margin-bottom:14px;font-weight:600;}
  .divider{height:1px;background:var(--border);margin:16px 0;}
  .photo-picker{display:flex;gap:10px;align-items:center;}
  .photo-picker .thumb{cursor:pointer;}
  .control-item{border-left:2px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px;}
  .control-item.tap{cursor:pointer;}
  .control-item .cdate{font-family:var(--font-head);font-size:16px;font-weight:600;}
  canvas.sigpad{width:100%;height:150px;background:#fff;border:1px dashed var(--border);border-radius:8px;touch-action:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:20;display:flex;align-items:flex-end;}
  .modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
  .role-pick{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .role-opt{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:13px 14px;}
  .qr-status{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px;}
  .qr-status.info{background:rgba(139,151,158,0.12);color:var(--text-muted);}
  .qr-status.ok{background:rgba(79,157,105,0.15);color:var(--ok);}
  .qr-status.err{background:rgba(193,68,58,0.15);color:var(--danger);}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,0.4);max-width:88vw;text-align:center;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-muted);background:transparent;}
  .tab.active{background:var(--accent);color:#fff;}
  .code-display{font-family:var(--font-mono);font-size:24px;letter-spacing:4px;text-align:center;padding:14px;background:var(--surface2);border:1px dashed var(--border);border-radius:8px;margin:10px 0;}
  .journal-item{padding:11px 0;border-bottom:1px solid var(--border);}
  .journal-item:last-child{border-bottom:none;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>
/* ---------- Supabase setup ---------- */
const SUPABASE_URL = 'https://djgetorzygsanetsxlzn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqZ2V0b3J6eWdzYW5ldHN4bHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjUyNDcsImV4cCI6MjEwNDc0MTI0N30.YoCSv80O1Fexd9ETTh_mfNhtqI_wu6cxTxiPR_lT1kA';
const TURNSTILE_SITE_KEY = '0x4AAAAAAFIxtzEQNiT-i15G';
let turnstileToken = null;
const sb = (function(){
  try{
    if(typeof supabase === 'undefined' || window.__sbLoadFailed){
      throw new Error("La librairie Supabase n'a pas pu se charger (connexion réseau bloquée, contenu tiers restreint, ou navigateur qui empêche ce script). Vérifie ta connexion et réessaie, ou ouvre ce fichier dans un autre navigateur.");

    });
    if(document.readyState !== 'loading'){
      document.getElementById('app').innerHTML =
        '<div style="padding:60px 24px;text-align:center;max-width:420px;margin:0 auto;color:#ECEFEF;font-family:sans-serif;">'
        + "<h2 style=\"font-family:sans-serif;\">Impossible de charger l'application</h2>"
        + '<p style="color:#8B979E;margin:14px 0;font-size:14px;">' + e.message + '</p>'
        + '<button onclick="location.reload()" style="background:#E4572E;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:600;font-size:14px;">Réessayer</button>'
        + '</div>';
    }
    return null;
  }
})();
const BUCKET = 'registre-materiel';

/* ---- Thème clair/sombre ---- */
(function(){
  try{
    if(localStorage.getItem('optepia-theme')==='light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
})();
function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme')==='light';
  if(isLight){ document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.setAttribute('data-theme','light'); }
  try{ localStorage.setItem('optepia-theme', isLight?'dark':'light'); }catch(e){}
  render();
}

/* ---------- State ---------- */
let state = {
  view:'loading', authMode:'login', busy:false,
  session:null, unit:null, role:null, myMemberId:null, myDisplayName:'',
  memberships:[], activeMembershipId:null, pendingActivateUnitId:null,
  members:[], equipment:[], journal:[], changeRequests:[], myAvatarUrl:null, importPreview:{rows:[],errors:[]},
  detailId:null, search:'', filter:'tous', viewMode:'flat', groupFilter:null, sortMode:'designation',
  mfaFactorId:null, mfaChallengeId:null, mfaFactors:[], mfaEnroll:null,
  loanTab:'pret', checkoutSelection:[], checkoutType:'pret', batchReturn:{}, controlDetailId:null,
  setupMode:'create', qrStatus:null, toast:null, loadError:null
};
const ROLES = {
  administrateur:{label:'Administrateur', can:['creerMateriel','supprimerMateriel','editerMateriel','ajouterControle','gererMembres','exporter','gererPret','validerPret','validerModificationMateriel']},
  verificateur:{label:'Vérificateur', can:['creerMateriel','ajouterControle','gererMembres','exporter','gererPret','validerPret','proposerModificationMateriel']},
  assistant:{label:'Assistant', can:['exporter','gererPret']},
  lecteur:{label:'Lecteur', can:['exporter']}
};
function can(action){ return (ROLES[state.role]?.can || []).includes(action); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function genUUID(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(ch){ const r=Math.random()*16|0; const v=ch==='x'?r:(r&0x3|0x8); return v.toString(16); });
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function imgFallback(imgEl){
  const url = imgEl.src;
  const div = document.createElement('div');
  div.className = 'muted'; div.style.fontSize='13px';
  div.innerHTML = `Image indisponible — <a href="${esc(url)}" target="_blank" style="color:var(--accent);">ouvrir le lien</a>`;
  imgEl.replaceWith(div);
}
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2400); }
function fmtDate(d){ if(!d) return '—'; const p=(''+d).slice(0,10).split('-'); if(p.length!==3) return d; return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function daysUntil(d){ if(!d) return null; const t=new Date((''+d).slice(0,10)+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function addYears(d,n){ if(!d) return null; const p=(''+d).slice(0,10).split('-').map(Number); return new Date(p[0]+n,p[1]-1,p[2]).toISOString().slice(0,10); }
function statusOf(e){
  const dfv = daysUntil(e.date_fin_vie);
  if(dfv!==null && dfv<0) return {label:'Hors service', cls:'badge-danger'};
  const controls = e.controls||[];
  const last = controls.length ? controls.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  if(last){
    const dNext = daysUntil(addYears(last.date,1));
    if(dNext!==null && dNext<0) return {label:'Contrôle dépassé', cls:'badge-danger'};
    if(dNext!==null && dNext<30) return {label:'Contrôle proche', cls:'badge-warn'};
  } else { return {label:'Jamais contrôlé', cls:'badge-warn'}; }
  if(dfv!==null && dfv<60) return {label:'Fin de vie proche', cls:'badge-warn'};
  return {label:'Conforme', cls:'badge-ok'};
}
function translateAuthError(msg){
  if(!msg) return 'Erreur inconnue';
  if(/invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect';
  if(/already registered|already exists/i.test(msg)) return 'Un compte existe déjà avec cet email';
  if(/password.*(least|short)/i.test(msg)) return 'Mot de passe trop court (8 caractères minimum)';
  if(/email not confirmed/i.test(msg)) return "Confirme d'abord ton email (lien reçu par mail)";
  if(/captcha/i.test(msg)) return 'Captcha refusé par Supabase (' + msg + ') — vérifie la secret key Turnstile dans Supabase (Attack Protection)';
  if(/code invalide/i.test(msg)) return 'Code invalide — vérifie-le auprès de ton administrateur';
  return msg;
}

/* ---------- Auth & data loading ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((event, sess)=>{
    state.session = sess;
    if(event==='SIGNED_OUT'){ state.unit=null; state.role=null; state.view='auth'; state.authMode='login'; render(); }
  });
  if(!session){ state.view='auth'; render(); return; }
  await loadUnitContext();
}
async function loadUnitContext(){
  try{
    refreshMfaFactors();
    const { data: memberships, error } = await sb.from('unit_members').select('*, units(*)').eq('user_id', state.session.user.id);
    if(error) throw error;
    state.memberships = memberships || [];
    if(state.memberships.length===0){ state.view='unitSetup'; render(); return; }
    let target = null;
    if(state.pendingActivateUnitId){ target = state.memberships.find(m=>m.unit_id===state.pendingActivateUnitId); state.pendingActivateUnitId=null; }
    if(!target && state.activeMembershipId) target = state.memberships.find(m=>m.id===state.activeMembershipId);
    if(!target && state.memberships.length===1) target = state.memberships[0];
    if(target){ await selectMembership(target); return; }
    state.view='unitPicker';
  }catch(err){ state.loadError = err.message; state.view='error'; }
  render();
}
async function selectMembership(m){
  state.unit = m.units; state.role = m.role; state.myMemberId = m.id; state.myDisplayName = m.display_name; state.activeMembershipId = m.id; state.myAvatarUrl = m.avatar_url || null;
  await refreshAll();
  state.view='list';
  render();
}
function selectMembershipById(id){ const m = state.memberships.find(x=>x.id===id); if(m) selectMembership(m); }
async function openUnitSwitcher(){
  const { data } = await sb.from('unit_members').select('*, units(*)').eq('user_id', state.session.user.id);
  state.memberships = data || [];
  state.view='unitPicker'; render();
}
function startJoinOrCreateAnother(){ state.setupMode='join'; state.view='unitSetup'; render(); }
async function refreshAll(){
  const [eqRes, memRes, crRes] = await Promise.all([
    sb.from('equipment').select('*, controls(*), loans(*)').eq('unit_id', state.unit.id),
    sb.from('unit_members').select('*').eq('unit_id', state.unit.id),
    sb.from('change_requests').select('*').eq('unit_id', state.unit.id).eq('status','en_attente')
  ]);
  state.equipment = eqRes.data || [];
  state.members = (memRes.data||[]).sort((a,b)=>a.display_name.localeCompare(b.display_name));
  state.changeRequests = crRes.data || [];
  collectAndResolveUnitFiles().then(()=>{
    const formViews = ['addControl','addEquip','checkout','loanOut','loanReturn','batchReturn'];
    if(!formViews.includes(state.view)) render();
  });
}
async function loadJournal(){
  const { data } = await sb.from('audit_log').select('*').eq('unit_id', state.unit.id).order('created_at', {ascending:false}).limit(80);
  state.journal = data || [];
}
async function logAction(action, target_label){
  try{
    await sb.from('audit_log').insert({unit_id: state.unit.id, user_id: state.session.user.id, user_name: state.myDisplayName, action, target_label});
  }catch(e){ /* non-bloquant */ }
}

/* ---------- Auth actions ---------- */
async function doSignUp(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  const password2 = document.getElementById('au-password2').value;
  if(!email || password.length<8){ showToast('Email valide et mot de passe (8+ caractères) requis'); return; }
  if(password!==password2){ showToast('Les mots de passe ne correspondent pas'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const signUpOpts = { email, password, options: { emailRedirectTo: 'https://app.optepia.fr/confirmed.html' } };
  if(captchaToken) signUpOpts.options.captchaToken = captchaToken;
  const { data, error } = await sb.auth.signUp(signUpOpts);
  state.busy=false;
  if(error){ showToast(translateAuthError(error.message)); render(); return; }
  if(!data.session){ state.authMode='confirmSent'; render(); return; }
  state.session = data.session;
  await loadUnitContext();
}
async function doLogin(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  if(!email || !password){ showToast('Email et mot de passe requis'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const loginOpts = { email, password };

/* ---------- Image helpers ---------- */
function resizeDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width,h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c = document.getElementById('workCanvas'); c.width=w; c.height=h;
      const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}
function readFile(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function dataUrlToBlob(dataUrl){
  const [header, b64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
async function uploadImage(dataUrl, path){
  const blob = dataUrlToBlob(dataUrl);
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, {upsert:true, contentType:blob.type});
  if(error) throw error;
  return path;
}
function isExternalLink(v){ return !!v && /^https?:\/\//.test(v); }
let signedUrlCache = {};
async function resolveSignedUrls(paths){
  const uniq = [...new Set((paths||[]).filter(p=>p && !isExternalLink(p)))];
  const now = Date.now();
  const need = uniq.filter(p=>!signedUrlCache[p] || signedUrlCache[p].expires < now + 5*60*1000);
  if(need.length===0) return;
  try{
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
    if(error) throw error;
    (data||[]).forEach(d=>{ if(d.signedUrl) signedUrlCache[d.path] = { url: d.signedUrl, expires: now + 3600*1000 }; });
  }catch(e){ /* silencieux : imgFallback prendra le relais à l'affichage */ }
}
function imgSrc(v){
  if(!v) return '';
  if(isExternalLink(v)) return v;
  const cached = signedUrlCache[v];
  return cached ? cached.url : '';
}
async function collectAndResolveUnitFiles(){
  const paths = [];
  state.equipment.forEach(e=>{
    paths.push(e.photo_url, e.fiche_technique_url);
    (e.controls||[]).forEach(c=>paths.push(c.photo_url, c.signature_url));
    (e.loans||[]).forEach(l=>paths.push(l.checkout_signature_url, l.return_signature_url));
  });
  state.members.forEach(m=>paths.push(m.avatar_url));
  if(state.unit) paths.push(state.unit.avatar_url);
  await resolveSignedUrls(paths);
}
function decodeQrFromDataUrl(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.getElementById('workCanvas');
      function tryDecode(maxDim){
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; } }
        c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const imgData = ctx.getImageData(0,0,w,h);
        return (typeof jsQR==='function') ? jsQR(imgData.data,w,h,{inversionAttempts:'attemptBoth'}) : null;
      }
      const result = tryDecode(1600) || tryDecode(900) || tryDecode(2400);
      resolve(result ? result.data : null);
    };
    img.src = dataUrl;
  });
}

    return true;
  }).slice().sort((a,b)=>{
    if(state.sortMode==='urgence'){
      const d = urgencyScore(a)-urgencyScore(b);
      if(d!==0) return d;
      return nextControlDueDays(a)-nextControlDueDays(b);
    }
    return (a.designation||'').localeCompare(b.designation||'');
  });
  if(items.length===0){
    return `<div class="empty"><h3>Aucun matériel</h3><p>${can('creerMateriel')?"Ajoute une première fiche depuis l'onglet « Ajouter ».":'Aucune fiche pour le moment.'}</p></div>`;
  }
  if(state.viewMode==='grouped' && !state.groupFilter){
    const groups = {};
    items.forEach(e=>{ const k=groupKey(e); (groups[k]=groups[k]||[]).push(e); });
    return Object.keys(groups).sort().map(k=>{
      const g = groups[k]; const first = g[0];
      const worst = g.some(e=>statusOf(e).cls==='badge-danger') ? 'badge-danger' : g.some(e=>statusOf(e).cls==='badge-warn') ? 'badge-warn' : 'badge-ok';
      const worstLabel = worst==='badge-danger'?'À vérifier':worst==='badge-warn'?'À surveiller':'Conforme';
      return `
      <div class="card tap" onclick="state.groupFilter='${k.replace(/'/g,"\\'")}'; render();">
        <div class="row">
          <div class="row" style="gap:12px;">
            ${first.photo_url?`<img class="thumb" src="${imgSrc(first.photo_url)}">`:`<div class="thumb"></div>`}
            <div>
              <div style="font-weight:600;font-size:15px;">${esc(first.designation)||'Sans désignation'}</div>
              <div class="muted">${esc(first.marque)||'—'}${first.famille?' · '+esc(first.famille):''}${first.sous_famille?' · '+esc(first.sous_famille):''}</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--font-head);font-size:20px;font-weight:700;">${g.length}</div>
            <span class="badge ${worst}" style="margin-top:2px;">${worstLabel}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  if(state.groupFilter){
    const filtered = items.filter(e=>groupKey(e)===state.groupFilter);
    return `<div class="backlink" onclick="state.groupFilter=null; render();">‹ Retour aux types de matériel</div>` + filtered.map(renderEquipRow).join('');
  }
  return items.map(renderEquipRow).join('');
}

function renderLoanSection(e){

  return html;

async function startMfaEnroll(){
  state.busy=true; render();
  const { data, error } = await sb.auth.mfa.enroll({ factorType:'totp' });
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  state.mfaEnroll = { factorId:data.id, qr_code:data.totp.qr_code, secret:data.totp.secret };
  render();
}
function cancelMfaEnroll(){
  if(state.mfaEnroll) sb.auth.mfa.unenroll({ factorId: state.mfaEnroll.factorId }).catch(()=>{});
  state.mfaEnroll = null;
  render();
}
async function confirmMfaEnroll(){
  const code = document.getElementById('mfa-enroll-code').value.trim();
  if(!code){ showToast('Saisis le code à 6 chiffres'); return; }
  state.busy=true; render();
  try{
    const { data: challenge, error: chErr } = await sb.auth.mfa.challenge({ factorId: state.mfaEnroll.factorId });
    if(chErr) throw chErr;
    const { error: verErr } = await sb.auth.mfa.verify({ factorId: state.mfaEnroll.factorId, challengeId: challenge.id, code });
    if(verErr) throw verErr;
    state.mfaEnroll = null;
    await refreshMfaFactors();
    showToast('Double authentification activée');
  }catch(err){ showToast(err.message || 'Code invalide'); }
  state.busy=false; render();
}
async function disableMfa(factorId){
  if(!confirm('Désactiver la double authentification sur ce compte ?')) return;
  state.busy=true; render();
  const { error } = await sb.auth.mfa.unenroll({ factorId });
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  await refreshMfaFactors();
  render();
  showToast('Double authentification désactivée');
}

function downloadImportTemplate(){

  const example = ['Baudrier','Petzl','Textile','Baudrier','SN-00123','ID-045','2023-01-15','2023-02-01','2030-01-15'];
  const csv = [headers, example].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')).join(String.fromCharCode(10));
  const blob = new Blob([String.fromCharCode(0xFEFF)+csv], {type:'text/csv;charset=utf-8;'});

function parseCsvText(text){
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ';' || c === ',') { row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r[0]||'').trim()!=='');
}
function parseFlexibleDate(s){
  if(!s) return null;
  s = s.trim();
  if(!s) return null;
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    const [y,m,d] = s.split('-').map(Number);
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    const [d,m,y] = s.split('/').map(Number);
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return null;
}

  const dataRows = allRows.slice(1);
  const parsed = []; const errors = [];
  dataRows.forEach((r, idx)=>{
    const designation = (r[0]||'').trim();
    if(!designation){
      if(r.some(c=>(c||'').trim())) errors.push(`Ligne ${idx+2} : désignation manquante, ignorée.`);
      return;
    }
    parsed.push({
      designation, marque:(r[1]||'').trim()||null, famille:(r[2]||'').trim()||null, sous_famille:(r[3]||'').trim()||null,
      numero_serie:(r[4]||'').trim()||null, identification:(r[5]||'').trim()||null,
      date_fabrication: parseFlexibleDate(r[6]), date_premiere_utilisation: parseFlexibleDate(r[7]), date_fin_vie: parseFlexibleDate(r[8])
    });
  });
  state.importPreview = { rows: parsed, errors };
  state.view = 'importPreview';
  render();
});

async function confirmImport(){

function exportCsv(){
  const headers = ['Désignation','Marque','N° série','Identification','Date fabrication','Date 1ère utilisation','Date fin de vie','Statut','Dernier contrôle','Dernier vérificateur','Créé par'];
  const rows = state.equipment.map(e=>{
    const last = (e.controls||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    return [e.designation,e.marque,e.numero_serie,e.identification,e.date_fabrication,e.date_premiere_utilisation,e.date_fin_vie,statusOf(e).label,last?last.date:'',last?last.verificateur_name:'',e.created_by_name];
  });
  const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')).join(String.fromCharCode(10));
  const blob = new Blob([String.fromCharCode(0xFEFF)+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`registre-materiel-${state.unit.name}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Export CSV téléchargé');
}

      Object.keys(map).forEach(k=>{ if(obj[k]){ equipDraft[map[k]] = obj[k]; } });
    }catch(err){ /* pas du JSON : contenu brut */ }
    if(!matched) equipDraft.numero_serie = data.trim();
    render();

  });

      <div class="row"><div><div style="font-weight:600;">${esc(l._equip.designation)}</div><div class="mono muted" style="font-size:12px;">${esc(l._equip.numero_serie||'')}</div></div><span class="muted">›</span></div>
    </div>`).join('')}
  ${(first.status==='restitue') ? `
  <h3 style="margin:20px 0 10px;">${type==='pret'?'Restitution':'Retour'}</h3>
  <div class="card">
    <div class="field"><label>Date</label><p>${fmtDate(first.return_date)}</p></div>
    ${first.return_condition?`<div class="field"><label>État</label><p>${first.return_condition==='endommage'?'Endommagé':first.return_condition==='reserve'?'Avec réserve':'Bon état'}</p></div>`:''}
    ${first.returned_by_name?`<div class="field"><label>Restitué par</label><p>${esc(first.returned_by_name)}</p></div>`:''}
    ${first.return_signature_url?`<div class="field"><label>Signature</label><img src="${imgSrc(first.return_signature_url)}" onerror="imgFallback(this)" style="width:100%;max-width:340px;display:block;background:#fff;border-radius:8px;border:1px solid var(--border);padding:10px;"></div>`:''}
  </div>` : (isCurrent && can('gererPret') ? `<button class="btn btn-primary" style="margin:16px 0 48px;" onclick="startBatchReturn('${batchKey}','${type}')">${type==='pret'?'Marquer restitué':'Marquer rentré'}</button>` : '')}
  `;
}
async function validateLoanBatch(batchKey){
  const items = allLoans().filter(l=>(l.batch_id||l.id)===batchKey && l.status==='en_attente');
  const ids = items.map(l=>l.id);
  const { error } = await sb.from('loans').update({status:'en_cours'}).in('id', ids);
  if(error){ showToast(error.message); return; }
  await logAction('Prêt validé', `${items[0]?items[0].borrower_name:''} — ${items.length} article(s)`);
  await refreshAll(); if(state.view==='batchDetail') state.view='loans'; render();
  showToast('Prêt validé');
}
async function rejectLoanBatch(batchKey){
  if(!confirm('Refuser ce prêt ?')) return;
  const items = allLoans().filter(l=>(l.batch_id||l.id)===batchKey && l.status==='en_attente');
  const ids = items.map(l=>l.id);
  const { error } = await sb.from('loans').update({status:'refuse'}).in('id', ids);
  if(error){ showToast(error.message); return; }
  await logAction('Prêt refusé', `${items[0]?items[0].borrower_name:''}`);
  await refreshAll(); if(state.view==='batchDetail') state.view='loans'; render();
  showToast('Prêt refusé');
}
function startCheckout(type){ state.checkoutType=type; state.checkoutSelection=[]; state.view='checkout'; render(); }
function renderCheckout(){
  const type = state.checkoutType;
  const available = state.equipment.filter(e=>!(e.loans||[]).some(l=>l.status==='en_cours'||l.status==='en_attente')).slice().sort((a,b)=>(a.designation||'').localeCompare(b.designation||''));
  const n = state.checkoutSelection.length;
  return `
  <div class="backlink" onclick="goto('loans')">‹ Annuler</div>
  <h2>${type==='pret'?'Nouveau prêt':'Nouvelle sortie mission'}</h2>
  <div class="card">
    <div class="field"><label>${type==='pret'?"Nom de l'emprunteur":'Intitulé de la mission / responsable'}</label><input id="co-name" placeholder="${type==='pret'?'Prénom Nom':'Ex. Mission Verdon — Cne Dupont'}"></div>
    <div class="field"><label>Date de ${type==='pret'?'perception':'sortie'}</label><input id="co-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    ${type==='pret'?`<div class="field"><label>Date de retour prévue (optionnelle)</label><input id="co-expected" type="date"></div>`:''}
    <div class="field"><label>Signature (à la ${type==='pret'?'perception':'sortie'})</label>
      <canvas id="sigpad" class="sigpad"></canvas>
      <button type="button" class="btn btn-ghost" style="width:auto;margin-top:6px;" onclick="clearSignature()">Effacer la signature</button>
    </div>
  </div>
  <h3 id="co-count-header" style="margin-bottom:10px;">Sélectionner le matériel (${n} sélectionné${n!==1?'s':''})</h3>
  ${available.length===0?'<p class="muted">Aucun matériel disponible (tout est déjà prêté/sorti).</p>':available.map(e=>`
    <div class="card tap" onclick="const cb=this.querySelector('input[type=checkbox]'); if(event.target!==cb){ cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); }">
      <div class="row">
        <div class="row" style="gap:12px;">
          <input type="checkbox" ${state.checkoutSelection.includes(e.id)?'checked':''} onchange="onCheckoutCheckboxChange('${e.id}', this.checked)" style="width:20px;height:20px;flex-shrink:0;accent-color:var(--accent);">
          ${e.photo_url?`<img class="thumb" src="${imgSrc(e.photo_url)}">`:`<div class="thumb"></div>`}
          <div><div style="font-weight:600;font-size:14px;">${esc(e.designation)}</div><div class="mono muted" style="font-size:12px;">${esc(e.numero_serie||'')}</div></div>
        </div>
      </div>
    </div>`).join('')}
  <button id="co-submit-btn" class="btn btn-primary" style="margin:16px 0 48px;" ${state.busy?'disabled':''} onclick="saveCheckout()">${state.busy?'<span class="spinner"></span>':'Confirmer ('+n+' article'+(n!==1?'s':'')+')'}</button>
  `;
}
function onCheckoutCheckboxChange(id, checked){
  const i = state.checkoutSelection.indexOf(id);
  if(checked && i<0) state.checkoutSelection.push(id);
  if(!checked && i>=0) state.checkoutSelection.splice(i,1);
  const n = state.checkoutSelection.length;
  const header = document.getElementById('co-count-header');
  if(header) header.textContent = `Sélectionner le matériel (${n} sélectionné${n!==1?'s':''})`;
  const btn = document.getElementById('co-submit-btn');
  if(btn && !state.busy) btn.textContent = `Confirmer (${n} article${n!==1?'s':''})`;
}
async function saveCheckout(){
  const name = document.getElementById('co-name').value.trim();
  const date = document.getElementById('co-date').value;
  const expectedEl = document.getElementById('co-expected');
  const expected = expectedEl ? (expectedEl.value||null) : null;
  if(!name || !date){ showToast('Nom et date requis'); return; }
  if(state.checkoutSelection.length===0){ showToast('Sélectionne au moins un article'); return; }
  if(sigEmpty){ showToast('La signature est requise'); return; }
  const sigDataUrl = sigCanvas.toDataURL('image/png');
  state.busy=true; render();
  try{
    const batchId = genUUID();
    const sigUrl = await uploadImage(sigDataUrl, `${state.unit.id}/loans/${batchId}-checkout-sig.png`);
    const needsApproval = (state.checkoutType==='pret' && state.role==='assistant');
    const rows = state.checkoutSelection.map(eid=>({
      equipment_id: eid, unit_id: state.unit.id, borrower_name: name, checkout_date: date, expected_return_date: expected,
      status: needsApproval?'en_attente':'en_cours', type: state.checkoutType, batch_id: batchId, checkout_signature_url: sigUrl,
      created_by: state.session.user.id, created_by_name: state.myDisplayName
    }));
    const { error } = await sb.from('loans').insert(rows);
    if(error) throw error;
    await logAction(state.checkoutType==='pret'?(needsApproval?'Prêt proposé':'Prêt enregistré'):'Sortie mission enregistrée', `${name} — ${rows.length} article(s)`);
    await refreshAll(); state.view='loans';
    showToast(needsApproval?'Prêt enregistré — en attente de validation':'Enregistré');
  }catch(err){ showToast(err.message); }
  state.busy=false; render();
}
function startBatchReturn(batchKey, type){ state.batchReturn = {batchKey, type, return_date:new Date().toISOString().slice(0,10)}; state.view='batchReturn'; render(); }
function renderBatchReturn(){
  const { batchKey, type } = state.batchReturn;
  const items = allLoans().filter(l=>(l.batch_id||l.id)===batchKey && l.status==='en_cours');
  const first = items[0];
  return `
  <div class="backlink" onclick="goto('loans')">‹ Annuler</div>
  <h2>${type==='pret'?'Restitution':'Retour de mission'}</h2>
  <p class="muted" style="margin-bottom:16px;">${esc(first?first.borrower_name:'')} — ${items.length} article(s)</p>
  <div class="card">
    <div class="field"><label>Date de ${type==='pret'?'retour':'rentrée'}</label><input id="br-date" type="date" value="${state.batchReturn.return_date}"></div>
    ${type==='pret'?`
    <div class="field"><label>État du matériel</label><select id="br-etat">
      <option value="bon_etat">Bon état</option><option value="reserve">Avec réserve</option><option value="endommage">Endommagé</option>
    </select></div>
    <div class="field"><label>Restitué par</label><input id="br-restituePar" value="${esc(first?first.borrower_name:'')}"></div>
    <div class="field"><label>Signature</label>
      <canvas id="sigpad" class="sigpad"></canvas>
      <button class="btn btn-ghost" style="width:auto;margin-top:6px;" onclick="clearSignature()">Effacer la signature</button>
    </div>`:''}
  </div>
  <button class="btn btn-primary" style="margin-bottom:48px;" ${state.busy?'disabled':''} onclick="saveBatchReturn()">${state.busy?'<span class="spinner"></span>':'Confirmer'}</button>
  `;
}
async function saveBatchReturn(){
  const { batchKey, type } = state.batchReturn;
  const date = document.getElementById('br-date').value;
  if(!date){ showToast('Date requise'); return; }
  const payload = { return_date: date, status:'restitue' };
  if(type==='pret'){
    const etat = document.getElementById('br-etat').value;
    const restituePar = document.getElementById('br-restituePar').value.trim();
    if(!restituePar){ showToast('Nom requis'); return; }
    if(sigEmpty){ showToast('La signature est requise'); return; }
    const sigDataUrl = sigCanvas.toDataURL('image/png');
    state.busy=true; render();
    try{
      const sigUrl = await uploadImage(sigDataUrl, `${state.unit.id}/loans/${uid()}-sig.png`);
      payload.return_condition = etat; payload.returned_by_name = restituePar; payload.return_signature_url = sigUrl;
    }catch(err){ showToast(err.message); state.busy=false; render(); return; }
  } else {
    state.busy=true; render();
  }
  const items = allLoans().filter(l=>(l.batch_id||l.id)===batchKey && l.status==='en_cours');
  const ids = items.map(l=>l.id);
  const { error } = await sb.from('loans').update(payload).in('id', ids);
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  await logAction(type==='pret'?'Matériel restitué':'Matériel rentré de mission', `${items[0]?items[0].borrower_name:''} — ${items.length} article(s)`);
  await refreshAll(); state.view='loans'; render();
  showToast('Enregistré');
}
function startLoanOut(equipId){ loanDraft = {equipId, checkout_date:new Date().toISOString().slice(0,10)}; state.view='loanOut'; render(); }
function cancelLoan(){ state.detailId = loanDraft.equipId; state.view='detail'; render(); }
function renderLoanOut(){
  const e = state.equipment.find(x=>x.id===loanDraft.equipId);
  return `
  <div class="backlink" onclick="cancelLoan()">‹ Annuler</div>
  <h2>Prêter ce matériel</h2>
  <p class="muted" style="margin-bottom:16px;">${esc(e?e.designation:'')} ${e&&e.numero_serie?'· <span class="mono">'+esc(e.numero_serie)+'</span>':''}</p>
  <div class="card">
    <div class="field"><label>Nom de l'emprunteur</label><input id="lo-borrower" placeholder="Prénom Nom"></div>
    <div class="field"><label>Date de perception</label><input id="lo-checkout" type="date" value="${loanDraft.checkout_date}"></div>
    <div class="field"><label>Date de retour prévue (optionnelle)</label><input id="lo-expected" type="date"></div>
    <div class="field"><label>Signature (à la perception)</label>
      <canvas id="sigpad" class="sigpad"></canvas>
      <button type="button" class="btn btn-ghost" style="width:auto;margin-top:6px;" onclick="clearSignature()">Effacer la signature</button>
    </div>
  </div>
  <button class="btn btn-primary" style="margin-bottom:48px;" ${state.busy?'disabled':''} onclick="saveLoanOut()">${state.busy?'<span class="spinner"></span>':'Confirmer le prêt'}</button>
  `;
}
async function saveLoanOut(){
  const borrower = document.getElementById('lo-borrower').value.trim();
  const checkout = document.getElementById('lo-checkout').value;
  const expected = document.getElementById('lo-expected').value || null;
  if(!borrower || !checkout){ showToast('Nom et date de perception requis'); return; }
  if(sigEmpty){ showToast('La signature est requise'); return; }
  const sigDataUrl = sigCanvas.toDataURL('image/png');
  state.busy=true; render();
  try{
    const e = state.equipment.find(x=>x.id===loanDraft.equipId);
    const batchId = genUUID();
    const sigUrl = await uploadImage(sigDataUrl, `${state.unit.id}/loans/${batchId}-checkout-sig.png`);
    const needsApproval = state.role==='assistant';
    const { error } = await sb.from('loans').insert({
      equipment_id: loanDraft.equipId, unit_id: state.unit.id, borrower_name: borrower, checkout_date: checkout,
      expected_return_date: expected, status: needsApproval?'en_attente':'en_cours', type:'pret', batch_id: batchId, checkout_signature_url: sigUrl,
      created_by: state.session.user.id, created_by_name: state.myDisplayName
    });
    if(error) throw error;
    await logAction(needsApproval?'Prêt proposé':'Matériel prêté', `${e?e.designation:''} → ${borrower}`);
    await refreshAll(); state.detailId = loanDraft.equipId; state.view='detail';
    showToast(needsApproval?'Prêt enregistré — en attente de validation':'Prêt enregistré');
  }catch(err){ showToast(err.message); }
  state.busy=false; render();
}
function startLoanReturn(equipId, loanId){ loanDraft = {equipId, loanId, return_date:new Date().toISOString().slice(0,10)}; state.view='loanReturn'; render(); }
function renderLoanReturn(){
  const e = state.equipment.find(x=>x.id===loanDraft.equipId);
  const loan = (e.loans||[]).find(l=>l.id===loanDraft.loanId);
  return `
  <div class="backlink" onclick="cancelLoan()">‹ Annuler</div>
  <h2>Restitution du matériel</h2>
  <p class="muted" style="margin-bottom:16px;">${esc(e?e.designation:'')} — prêté à ${esc(loan?loan.borrower_name:'')}</p>
  <div class="card">
    <div class="field"><label>Date de retour</label><input id="lr-date" type="date" value="${loanDraft.return_date}"></div>
    <div class="field"><label>État du matériel au retour</label><select id="lr-etat">
      <option value="bon_etat">Bon état</option><option value="reserve">Avec réserve</option><option value="endommage">Endommagé</option>
    </select></div>
    <div class="field"><label>Restitué par</label><input id="lr-restituePar" value="${esc(loan?loan.borrower_name:'')}"></div>
    <div class="field"><label>Signature</label>
      <canvas id="sigpad" class="sigpad"></canvas>
      <button class="btn btn-ghost" style="width:auto;margin-top:6px;" onclick="clearSignature()">Effacer la signature</button>
    </div>
  </div>
  <button class="btn btn-primary" style="margin-bottom:48px;" ${state.busy?'disabled':''} onclick="saveLoanReturn()">${state.busy?'<span class="spinner"></span>':'Confirmer la restitution'}</button>
  `;
}
async function saveLoanReturn(){
  const date_retour = document.getElementById('lr-date').value;
  const etat = document.getElementById('lr-etat').value;
  const restituePar = document.getElementById('lr-restituePar').value.trim();
  if(!date_retour || !restituePar){ showToast('Date et nom requis'); return; }
  if(sigEmpty){ showToast('La signature est requise'); return; }
  const sigDataUrl = sigCanvas.toDataURL('image/png');
  state.busy=true; render();
  try{
    const sigUrl = await uploadImage(sigDataUrl, `${state.unit.id}/loans/${uid()}-sig.png`);
    const e = state.equipment.find(x=>x.id===loanDraft.equipId);
    const { error } = await sb.from('loans').update({
      return_date: date_retour, return_condition: etat, returned_by_name: restituePar, return_signature_url: sigUrl, status:'restitue'
    }).eq('id', loanDraft.loanId);
    if(error) throw error;
    await logAction('Matériel restitué', `${e?e.designation:''} par ${restituePar}`);
    await refreshAll(); state.detailId = loanDraft.equipId; state.view='detail';
    showToast('Restitution enregistrée');
  }catch(err){ showToast(err.message); }
  state.busy=false; render();
}

/* ---------- Post-render wiring ---------- */
function afterRender(){
  if(state.view==='auth' && typeof turnstile==='undefined' && !window.__tsRetry){ window.__tsRetry=setTimeout(function(){ window.__tsRetry=null; if(typeof turnstile!=='undefined') afterRender(); },800); }
  if(state.view==='auth' && (state.authMode==='signup' || state.authMode==='login') && typeof turnstile!=='undefined'){
    const el = document.querySelector('.cf-turnstile');
    if(el && !el.dataset.rendered){
      el.dataset.rendered='1';
      turnstile.render(el, { sitekey: TURNSTILE_SITE_KEY, theme:'dark',
        callback: function(token){ turnstileToken = token; },
        'expired-callback': function(){ turnstileToken = null; },
        'error-callback': function(code){ turnstileToken = null; showToast('Captcha Cloudflare (widget) : erreur ' + code + ' — vérifie le nom de domaine autorisé dans Turnstile'); return true; } });
    }
  }
  if(state.view==='addControl' || state.view==='loanOut' || state.view==='loanReturn' || state.view==='checkout' || state.view==='batchReturn'){
    sigCanvas = document.getElementById('sigpad');
    if(sigCanvas){
      const ratio = window.devicePixelRatio||1; const rect = sigCanvas.getBoundingClientRect();
      sigCanvas.width = rect.width*ratio; sigCanvas.height = rect.height*ratio;
      sigCtx = sigCanvas.getContext('2d'); sigCtx.scale(ratio,ratio);
      sigCtx.strokeStyle='#1a1a1a'; sigCtx.lineWidth=2.2; sigCtx.lineCap='round';
      sigEmpty=true; let last=null;
      const pos = (ev)=>{ const r=sigCanvas.getBoundingClientRect(); const p=ev.touches?ev.touches[0]:ev; return {x:p.clientX-r.left,y:p.clientY-r.top}; };
      const start=(ev)=>{ ev.preventDefault(); sigDrawing=true; last=pos(ev); };
      const move=(ev)=>{ if(!sigDrawing) return; ev.preventDefault(); const p=pos(ev); sigCtx.beginPath(); sigCtx.moveTo(last.x,last.y); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); last=p; sigEmpty=false; };
      const end=()=>{ sigDrawing=false; };
      sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      sigCanvas.addEventListener('touchstart', start, {passive:false}); sigCanvas.addEventListener('touchmove', move, {passive:false}); sigCanvas.addEventListener('touchend', end);
    }
  }
}
window.addEventListener('error', function(e){
  console.error('Erreur registre matériel:', e.error||e.message);
  if(state.view==='loading'){ state.loadError = e.message||'Erreur JavaScript au chargement.'; state.view='error'; render(); }
});
/* ---- Déconnexion automatique après inactivité ---- */
const INACTIVITY_LIMIT_MS = 2 * 60 * 60 * 1000; // 2 heures
let lastActivityAt = Date.now();
['click','keydown','touchstart','mousemove','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ lastActivityAt = Date.now(); }, {passive:true});
});
setInterval(()=>{
  if(state.session && Date.now() - lastActivityAt > INACTIVITY_LIMIT_MS){
    doLogout();
  }
}, 60000);

if(sb) init();
</script>
