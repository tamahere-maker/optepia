<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0B1014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1014; --surface:#121A20; --surface2:#1A242C; --border:#27343E;
    --text:#EEF3F5; --text-muted:#8A9AA5; --accent:#37D69A; --accent-dim:#06A58F;
    --ok:#22D39A; --warn:#FFB21F; --danger:#FF5468;
    --on-accent:#0B1014; --brand-grad:linear-gradient(135deg,#95F2A6 0%,#37D69A 50%,#0A9FA0 100%);
    --ok-bg:rgba(34,211,154,0.15); --warn-bg:rgba(255,178,31,0.16); --danger-bg:rgba(255,84,104,0.16);
    --font-head:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"]{
    --bg:#F3F6F7; --surface:#FFFFFF; --surface2:#E8EEF0; --border:#D3DCE1;
    --text:#0F1A20; --text-muted:#5A6A74; --accent:#0A8068; --accent-dim:#07665A;
    --ok:#0C8A63; --warn:#A86A00; --danger:#C4243A; --on-accent:#FFFFFF;
    --ok-bg:rgba(12,138,99,0.12); --warn-bg:rgba(168,106,0,0.13); --danger-bg:rgba(196,36,58,0.11);
  }
  .hd-avatars{position:relative;width:56px;height:52px;flex-shrink:0;margin-left:12px;cursor:pointer;}
  .hd-team{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .hd-logo{height:30px;width:auto;flex-shrink:0;margin-left:10px;opacity:.95;}
  @media (max-width:340px){.hd-logo{display:none;}}
  .hd-team.hd-fallback img{height:62%;width:auto;}
  .hd-me{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);background:var(--surface2);box-shadow:0 1px 4px rgba(0,0,0,.35);}
  .hd-dot{background:var(--brand-grad);color:var(--on-accent);font-size:10px;font-weight:700;font-family:var(--font-head);display:flex;align-items:center;justify-content:center;}
  .sheet-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;}
  .sheet-box{width:100%;max-width:480px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;}
  .crop-ov{position:fixed;inset:0;z-index:210;background:rgba(5,8,10,.96);display:flex;align-items:center;justify-content:center;overflow:auto;}
  .crop-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;width:100%;max-width:420px;}
  .crop-stage{position:relative;overflow:hidden;background:#000;border-radius:6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;}
  .crop-stage img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none;}
  .crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.62);border:2px solid rgba(255,255,255,.85);pointer-events:none;}
  .crop-zoom{width:100%;accent-color:#37D69A;}
  .crop-mask.rect{border-radius:6px;}
  .crop-ratios{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .crop-ratios .chip.on{background:var(--ok-bg);color:var(--accent);border-color:var(--accent);}
  .logo-wm{display:block;height:auto;}
  :root[data-theme="light"] .logo-wm{filter:brightness(0) saturate(100%);opacity:.9;}
  .pw-rules{margin:8px 0 2px;padding:0;list-style:none;font-size:12px;color:var(--text-muted);}
  .pw-rules li{display:flex;align-items:center;gap:8px;padding:2px 0;transition:color .15s;}
  .pw-rules .box{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:transparent;flex-shrink:0;transition:all .15s;}
  .pw-rules li.ok{color:var(--ok);}
  .pw-rules li.ok .box{background:var(--ok);border-color:var(--ok);color:#fff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;}
  body{padding-bottom:calc(120px + env(safe-area-inset-bottom));min-height:100vh;}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;letter-spacing:0.2px;margin:0 0 4px 0;}
  h1{font-size:24px;} h2{font-size:18px;} h3{font-size:15px;color:var(--text-muted);font-weight:600;}
  p{margin:0;} a{color:var(--accent);}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  input,select,textarea{font-family:var(--font-body);}
  .topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px 9px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{display:flex;flex-direction:row;align-items:center;}
  .topbar .brand small{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px 6px 6px;cursor:pointer;}
  .user-dot{width:26px;height:26px;border-radius:50%;background:var(--brand-grad);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-head);flex-shrink:0;}
  .user-chip .role{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;display:block;}
  .user-chip .name{font-size:13px;font-weight:600;}
  main{padding:16px;padding-bottom:32px;max-width:640px;margin:0 auto;}
  .sheet{background:#fff;color:#111;border-radius:8px;padding:22px;margin-bottom:24px;font-size:13px;line-height:1.45;}
  .sheet-t{width:100%;border-collapse:collapse;margin-bottom:4px;}
  .sheet-t th,.sheet-t td{border:1px solid #c8c8c8;padding:6px 8px;text-align:left;vertical-align:top;}
  .sheet-t th{background:#f2f2f2;font-weight:600;}
  @media print{
    html,body{background:#fff !important;}
    .topbar,.navbar,.noprint,.toast{display:none !important;}
    main{padding:0 !important;max-width:none !important;}
    .sheet{border-radius:0;padding:0;margin:0;}
  }
  .acc{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .acc>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;-webkit-tap-highlight-color:transparent;}
  .acc>summary::-webkit-details-marker{display:none;}
  .acc>summary::after{content:'›';color:var(--text-muted);font-size:20px;line-height:1;transition:transform .15s;margin-left:10px;}
  .acc>summary>span:first-child{flex:1;}
  .acc[open]>summary::after{transform:rotate(90deg);}
  .acc-body{padding:2px 16px 16px;}
  .acc-body .card{background:var(--surface2);}
  .acc-body>.card:last-child{margin-bottom:0;}
  .acc-body .mfa-title{display:none;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
  .card.tap{cursor:pointer;transition:border-color .15s;}
  .card.tap:active{border-color:var(--accent);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 12px;font-size:15px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;width:100%;}
  .btn-primary{background:var(--brand-grad);color:var(--on-accent);} .btn-primary:active{filter:brightness(.9);}
  .btn-primary:disabled{opacity:0.5;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--accent);padding:10px;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:110px;}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:20px;font-weight:700;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .mono{overflow-wrap:anywhere;font-family:var(--font-mono);font-size:13px;letter-spacing:0.3px;}
  .muted{color:var(--text-muted);font-size:13px;}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:contain;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;}
  .thumb-lg{width:100%;height:180px;border-radius:10px;object-fit:cover;background:var(--surface2);border:1px solid var(--border);}
  .thumb-full{width:auto;max-width:35%;height:auto;max-height:80px;flex-shrink:0;object-fit:contain;background:var(--surface2);border-radius:10px;border:1px solid var(--border);display:block;cursor:zoom-in;}
  .thumb-hist{height:76px;width:auto;max-width:130px;object-fit:contain;background:var(--surface2);border-radius:8px;border:1px solid var(--border);flex-shrink:0;cursor:zoom-in;}
  .lb-ov{position:fixed;inset:0;z-index:300;background:rgba(3,5,7,.96);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;}
  .lb-ov img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform;}
  .lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .lb-hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#9aa8b2;font-size:12px;pointer-events:none;}
  .thumb-contain{width:100%;max-height:220px;height:auto;object-fit:contain;background:var(--surface2);border-radius:10px;border:1px solid var(--border);display:block;}
  .search{display:flex;gap:8px;margin-bottom:14px;}
  .search input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;}
  .filter-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);}
  .chip.active{background:var(--brand-grad);color:var(--on-accent);border-color:transparent;font-weight:700;}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom);}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 1px 7px;color:var(--text-muted);font-size:8.8px;text-transform:uppercase;letter-spacing:0.2px;font-weight:600;background:transparent;}
  .navitem.active{color:var(--accent);}
  .navitem svg{width:18px;height:18px;}
  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .empty::before{content:"";display:block;width:68px;height:66px;margin:0 auto 14px;background:url(logo-mark.png) center/contain no-repeat;opacity:.3;filter:grayscale(1);}
  @keyframes pulse-logo{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.07);opacity:1;}}
  .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;color:var(--text-muted);font-size:13px;}
  .splash img{height:84px;width:auto;animation:pulse-logo 1.6s ease-in-out infinite;}
  .legal-links{text-align:center;margin-top:26px;font-size:12px;color:var(--text-muted);}
  .legal-links a{color:var(--text-muted);}
  .brand-sign a{color:var(--text-muted);}
  .brand-sign{text-align:center;margin:8px 0 28px;color:var(--text-muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
  .brand-sign img{height:30px;width:auto;display:block;margin:0 auto 8px;opacity:.9;}
  .empty h3{color:var(--text-muted);}
  .backlink{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;margin-bottom:14px;font-weight:600;}
  .divider{height:1px;background:var(--border);margin:16px 0;}
  .photo-picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .photo-picker .thumb{cursor:pointer;}
  .control-item{border-left:2px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px;}
  .control-item.tap{cursor:pointer;}
  .control-item .cdate{font-family:var(--font-head);font-size:16px;font-weight:600;}
  canvas.sigpad{width:100%;height:150px;background:#fff;border:1px dashed var(--border);border-radius:8px;touch-action:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:20;display:flex;align-items:flex-end;}
  .modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
  .role-pick{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .role-opt{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:13px 14px;}
  .qr-status{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px;}
  .qr-status.info{background:rgba(139,151,158,0.12);color:var(--text-muted);}
  .qr-status.warn{background:var(--warn-bg);color:var(--warn);}
  .qr-status.ok{background:var(--ok-bg);color:var(--ok);}
  .qr-status.err{background:var(--danger-bg);color:var(--danger);}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,0.4);max-width:88vw;text-align:center;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-muted);background:transparent;}
  .tab.active{background:var(--brand-grad);color:var(--on-accent);}
  .code-display{font-family:var(--font-mono);font-size:24px;letter-spacing:4px;text-align:center;padding:14px;background:var(--surface2);border:1px dashed var(--border);border-radius:8px;margin:10px 0;}
  .journal-item{padding:11px 0;border-bottom:1px solid var(--border);}
  .journal-item:last-child{border-bottom:none;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function genUUID(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(ch){ const r=Math.random()*16|0; const v=ch==='x'?r:(r&0x3|0x8); return v.toString(16); });
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function imgFallback(imgEl){
  const url = imgEl.src;
  const div = document.createElement('div');
  div.className = 'muted'; div.style.fontSize='13px';
  div.innerHTML = `Image indisponible — <a href="${esc(url)}" target="_blank" style="color:var(--accent);">ouvrir le lien</a>`;
  imgEl.replaceWith(div);
}
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2400); }
function fmtDate(d){ if(!d) return '—'; const p=(''+d).slice(0,10).split('-'); if(p.length!==3) return d; return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function equipIds(e){
  const a=[]; if(e && e.numero_serie) a.push('N° série '+esc(e.numero_serie)); if(e && e.identification) a.push('Identif. '+esc(e.identification));
  return a.join(' · ');
}
function fmtHM(ts){ if(!ts) return ''; const dt=new Date(ts); if(isNaN(dt)) return ''; return dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDT(date, ts){ const h=fmtHM(ts); return fmtDate(date)+(h?' à '+h:''); }
function daysUntil(d){ if(!d) return null; const t=new Date((''+d).slice(0,10)+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function addYears(d,n){ if(!d) return null; const p=(''+d).slice(0,10).split('-').map(Number); return new Date(p[0]+n,p[1]-1,p[2]).toISOString().slice(0,10); }
/* Conservation légale : un matériel réformé doit rester consultable 5 ans après la date de réforme */
const RETENTION_YEARS = 5;
function plusYears(d,n){ const p=(''+d).slice(0,10).split('-'); return (Number(p[0])+n)+'-'+p[1]+'-'+p[2]; }
function reformInfo(e){
  const rs = (e&&e.controls||[]).filter(c=>c.statut==='reforme').sort((a,b)=>b.date.localeCompare(a.date));
  if(!rs.length) return null;
  const date = rs[0].date.slice(0,10), until = plusYears(date, RETENTION_YEARS);
  return { date, until, locked: daysUntil(until) > 0 };
}
function isReformed(e){
  const cs = (e&&e.controls||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  return cs.length>0 && cs[0].statut==='reforme';
}
function reformBanner(e){
  const r = reformInfo(e); if(!r) return '';
  return `<div class="qr-status ${r.locked?'warn':'info'}" style="margin:10px 0;"><b>${isReformed(e)?'Matériel réformé':'Réforme enregistrée'} le ${fmtDate(r.date)}</b><br><span style="font-size:12px;">${r.locked?`Conservation obligatoire jusqu'au ${fmtDate(r.until)} (5 ans) en cas de contrôle : la fiche et son historique ne peuvent pas être supprimés définitivement avant cette date.`:`Délai de conservation de 5 ans écoulé depuis le ${fmtDate(r.until)} : suppression définitive possible.`}</span></div>`;
}
function statusOf(e){
  if(isReformed(e)) return {label:'Réformé', cls:'badge-danger'};
  const dfv = daysUntil(e.date_fin_vie);
  if(dfv!==null && dfv<0) return {label:'Hors service', cls:'badge-danger'};
  const controls = e.controls||[];
  const last = controls.length ? controls.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  if(last){
    const dNext = daysUntil(addYears(last.date,1));
    if(dNext!==null && dNext<0) return {label:'Contrôle dépassé', cls:'badge-danger'};
    if(dNext!==null && dNext<30) return {label:'Contrôle proche', cls:'badge-warn'};
  } else { return {label:'Jamais contrôlé', cls:'badge-warn'}; }
  if(dfv!==null && dfv<60) return {label:'Fin de vie proche', cls:'badge-warn'};
  return {label:'Conforme', cls:'badge-ok'};
}
function translateAuthError(msg){
  if(!msg) return 'Erreur inconnue';
  if(/invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect';
  if(/already registered|already exists/i.test(msg)) return 'Un compte existe déjà avec cet email';
  if(/password.*(least|short)/i.test(msg)) return 'Mot de passe trop court (8 caractères minimum)';
  if(/email not confirmed/i.test(msg)) return "Confirme d'abord ton email (lien reçu par mail)";
  if(/captcha/i.test(msg)) return 'Captcha refusé par Supabase (' + msg + ') — vérifie la secret key Turnstile dans Supabase (Attack Protection)';
  if(/code invalide/i.test(msg)) return 'Code invalide — vérifie-le auprès de ton administrateur';
  return msg;
}

/* ---------- Auth & data loading ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((event, sess)=>{
    state.session = sess;
    if(event==='PASSWORD_RECOVERY'){ startPasswordReset(); return; }
    if(event==='SIGNED_OUT'){ state.unit=null; state.role=null; state.view='auth'; state.authMode='login'; render(); }
  });
  if(session && RECOVERY_LINK){ await startPasswordReset(); return; }
  if(!session){
    state.view='auth';
    if(LINK_ERROR){ state.authMode='forgot'; history.replaceState(null,'',location.pathname); render(); showToast('Lien invalide ou expiré — refais une demande'); return; }
    render(); return;
  }
  await loadUnitContext();
}
async function checkPlatformAdmin(){
  if(state.isPlatformAdmin!==undefined) return;
  try{
    const { data } = await sb.from('platform_admins').select('user_id').eq('user_id', state.session.user.id).maybeSingle();
    state.isPlatformAdmin = !!data;
    if(state.isPlatformAdmin && state.view==='profile') render();
  }catch(e){ state.isPlatformAdmin = false; }
}
async function loadUnitContext(){
  try{
    refreshMfaFactors();
    checkPlatformAdmin();
    const { data: memberships, error } = await sb.from('unit_members').select('*, units(*)').eq('user_id', state.session.user.id);
    if(error) throw error;
    state.memberships = memberships || [];
    if(state.memberships.length===0){ state.view='unitSetup'; render(); return; }
    let target = null;
    if(state.pendingActivateUnitId){ target = state.memberships.find(m=>m.unit_id===state.pendingActivateUnitId); state.pendingActivateUnitId=null; }
    if(!target && state.activeMembershipId) target = state.memberships.find(m=>m.id===state.activeMembershipId);
    if(!target && state.memberships.length===1) target = state.memberships[0];
    if(target){ await selectMembership(target); return; }
    state.view='unitPicker';
  }catch(err){ state.loadError = err.message; state.view='error'; }
  render();
}

  state.unit = m.units; state.role = m.role; state.myMemberId = m.id; state.myDisplayName = m.display_name; state.activeMembershipId = m.id; state.myAvatarUrl = m.avatar_url || null;

/* ---------- Règles de mot de passe ---------- */
const PW_RULES = [
  { id:'len',   label:'8 caractères minimum',        test: p => p.length >= 8 },
  { id:'upper', label:'Une majuscule',               test: p => /[A-Z]/.test(p) },
  { id:'lower', label:'Une minuscule',               test: p => /[a-z]/.test(p) },
  { id:'digit', label:'Un chiffre',                  test: p => /[0-9]/.test(p) },
  { id:'spec',  label:'Un caractère spécial (!@#$…)', test: p => /[^A-Za-z0-9\s]/.test(p) }
];
function isStrongPw(p){ return PW_RULES.every(r=>r.test(p||'')); }
function pwChecklistHtml(inputId){
  return `<ul class="pw-rules" id="${inputId}-rules">` + PW_RULES.map(r=>`<li data-rule="${r.id}"><span class="box">✓</span>${r.label}</li>`).join('') + `</ul>`;
}
function updatePwRules(inputId){
  const el = document.getElementById(inputId); const box = document.getElementById(inputId+'-rules');
  if(!el || !box) return;
  PW_RULES.forEach(r=>{
    const li = box.querySelector('[data-rule="'+r.id+'"]');
    if(li) li.classList.toggle('ok', r.test(el.value));
  });
}

const LEGAL_VERSION = '2026-10-01';
async function doSignUp(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  const password2 = document.getElementById('au-password2').value;
  if(!email || !password){ showToast('Email et mot de passe requis'); return; }
  if(!document.getElementById('au-cgu') || !document.getElementById('au-cgu').checked){ showToast('Accepte les conditions d\'utilisation pour créer ton compte'); return; }
  if(!isStrongPw(password)){ showToast('Le mot de passe ne respecte pas toutes les conditions'); return; }
  if(password!==password2){ showToast('Les mots de passe ne correspondent pas'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const signUpOpts = { email, password, options: { emailRedirectTo: 'https://app.optepia.fr/confirmed.html', data: { cgu_accepted_at: new Date().toISOString(), cgu_version: LEGAL_VERSION } } };
  if(captchaToken) signUpOpts.options.captchaToken = captchaToken;
  const { data, error } = await sb.auth.signUp(signUpOpts);
  state.busy=false;
  if(error){ showToast(translateAuthError(error.message)); render(); return; }
  if(!data.session){ state.authMode='confirmSent'; render(); return; }
  state.session = data.session;
  await loadUnitContext();
}
async function doLogin(){
  const email = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  if(!email || !password){ showToast('Email et mot de passe requis'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null; /* jeton à usage unique */
  state.busy=true; render();
  const loginOpts = { email, password };
  if(captchaToken) loginOpts.options = { captchaToken };
  const { data, error } = await sb.auth.signInWithPassword(loginOpts);
  state.busy=false;
  if(error){ showToast(translateAuthError(error.message)); render(); return; }
  state.session = data.session;
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal && aal.currentLevel==='aal1' && aal.nextLevel==='aal2'){
    const { data: factors } = await sb.auth.mfa.listFactors();
    const factor = factors && factors.totp && factors.totp[0];
    if(factor){ state.mfaFactorId = factor.id; state.view='mfaChallenge'; render(); return; }
  }
  await loadUnitContext();
}
async function submitMfaChallenge(){
  const code = document.getElementById('mfa-code').value.trim();
  if(!code){ showToast('Saisis le code à 6 chiffres'); return; }
  state.busy=true; render();
  const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: state.mfaFactorId, code });
  state.busy=false;
  if(error){ showToast('Code invalide'); render(); return; }
  state.mfaFactorId = null;
  await loadUnitContext();
}
async function doLogout(){
  await sb.auth.signOut();
  state = Object.assign(state, {unit:null, role:null, equipment:[], members:[], journal:[], memberships:[], activeMembershipId:null, mfaFactorId:null, isPlatformAdmin:undefined, mfaChallengeId:null, view:'auth', authMode:'login'});

}

async function doForgot(){
  const email = document.getElementById('au-email').value.trim();
  if(!email){ showToast('Saisis ton adresse email'); return; }
  if(TURNSTILE_SITE_KEY!=='REMPLACE_PAR_TA_CLE_TURNSTILE' && !turnstileToken){ showToast('Merci de valider le contrôle anti-robot'); return; }
  const captchaToken = turnstileToken; turnstileToken = null;
  state.busy=true; render();
  const opts = { redirectTo: 'https://app.optepia.fr/' };
  if(captchaToken) opts.captchaToken = captchaToken;
  const { error } = await sb.auth.resetPasswordForEmail(email, opts);
  state.busy=false;
  if(error && /captcha/i.test(error.message)){ showToast(translateAuthError(error.message)); render(); return; }
  if(error && /rate limit|too many|seconds/i.test(error.message)){ showToast('Trop de demandes — réessaie dans quelques minutes'); render(); return; }
  /* réponse volontairement identique que le compte existe ou non */
  state.authMode='forgotSent'; render();
}
async function startPasswordReset(){
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  let needsMfa = false, factorId = null;
  try{
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.currentLevel==='aal1' && aal.nextLevel==='aal2'){
      const { data: f } = await sb.auth.mfa.listFactors();
      const factor = f && f.totp && f.totp.find(x=>x.status==='verified');
      if(factor){ needsMfa = true; factorId = factor.id; }
    }
  }catch(e){}
  state.resetNeedsMfa = needsMfa; state.resetFactorId = factorId;
  state.view='resetPassword'; render();
}
async function submitPasswordReset(){
  const pw = document.getElementById('rp-new').value;
  const pw2 = document.getElementById('rp-confirm').value;
  if(!isStrongPw(pw)){ showToast('Le mot de passe ne respecte pas toutes les conditions'); return; }
  if(pw!==pw2){ showToast('Les mots de passe ne correspondent pas'); return; }
  const btn = document.getElementById('rp-btn'); if(btn) btn.disabled = true;
  if(state.resetNeedsMfa){
    const code = (document.getElementById('rp-mfa').value||'').trim();
    if(!code){ showToast('Saisis le code à 6 chiffres'); if(btn) btn.disabled=false; return; }
    const { error: mErr } = await sb.auth.mfa.challengeAndVerify({ factorId: state.resetFactorId, code });
    if(mErr){ showToast('Code de vérification invalide'); if(btn) btn.disabled=false; return; }
  }
  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){
    showToast(/same.*password|different/i.test(error.message) ? "Choisis un mot de passe différent de l'ancien" : translateAuthError(error.message));
    if(btn) btn.disabled=false; return;
  }
  state.resetNeedsMfa=false; state.resetFactorId=null;
  await sb.auth.signOut();
  state.view='auth'; state.authMode='login'; render();
  showToast('Mot de passe modifié — connecte-toi avec le nouveau');
}

/* ---------- Image helpers ---------- */
function resizeDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width,h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c = document.getElementById('workCanvas'); c.width=w; c.height=h;
      const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}
function readFile(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function dataUrlToBlob(dataUrl){
  const [header, b64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
async function uploadImage(dataUrl, path){
  const blob = dataUrlToBlob(dataUrl);
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, {upsert:true, contentType:blob.type});
  if(error) throw error;
  return path;
}
/* Fichiers du catalogue partagé : stockés une seule fois dans le bucket « catalogue », référencés par « catalogue:chemin » */
const CAT_PREFIX = 'catalogue:';
function isCatRef(v){ return typeof v==='string' && v.startsWith(CAT_PREFIX); }
async function resolveCatRefs(refs){
  const now = Date.now();
  const need = [...new Set(refs)].filter(v=>!signedUrlCache[v] || signedUrlCache[v].expires < now + 5*60*1000);
  if(!need.length) return;
  try{
    const paths = need.map(v=>v.slice(CAT_PREFIX.length));
    for(let i=0;i<paths.length;i+=100){
      const { data } = await sb.storage.from('catalogue').createSignedUrls(paths.slice(i,i+100), 3600);
      (data||[]).forEach(d=>{ if(d.signedUrl) signedUrlCache[CAT_PREFIX+d.path] = { url:d.signedUrl, expires: now+3600*1000 }; });
    }
  }catch(e){ /* silencieux : imgFallback prendra le relais */ }
}
/* Anciennes données : certaines signatures sont stockées sous forme d'URL publique complète du bucket (devenu privé).
   On en extrait le chemin pour générer un lien signé. */
function storagePathOf(v){
  const m = /\/storage\/v1\/object\/(?:public|sign|authenticated)\/registre-materiel\/([^?#]+)/.exec(v||'');
  if(!m) return null;
  try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; }
}
function isExternalLink(v){ return !!v && /^https?:\/\//.test(v) && !storagePathOf(v); }
let signedUrlCache = {};
async function resolveSignedUrls(paths){
  const byPath = {};   /* chemin réel -> valeurs stockées qui y mènent */
  const catRefs = [];
  (paths||[]).forEach(v=>{
    if(!v || isExternalLink(v)) return;
    if(isCatRef(v)){ catRefs.push(v); return; }
    const real = storagePathOf(v) || v;
    (byPath[real] = byPath[real] || []).push(v);
  });
  const now = Date.now();
  await resolveCatRefs(catRefs);
  const need = Object.keys(byPath).filter(real=>byPath[real].some(v=>!signedUrlCache[v] || signedUrlCache[v].expires < now + 5*60*1000));
  if(need.length===0) return;
  try{
    for(let i=0;i<need.length;i+=100){
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i,i+100), 3600);
      if(error) throw error;
      (data||[]).forEach(d=>{
        if(!d.signedUrl) return;
        const entry = { url: d.signedUrl, expires: now + 3600*1000 };
        signedUrlCache[d.path] = entry;
        (byPath[d.path]||[]).forEach(v=>{ signedUrlCache[v] = entry; });
      });
    }
  }catch(e){ /* silencieux : imgFallback prendra le relais à l'affichage */ }
}
function imgSrc(v){

let _zxReader=null;
function zxReader(ZX){
  if(_zxReader) return _zxReader;
  const hints=new Map();
  hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.QR_CODE,ZX.BarcodeFormat.DATA_MATRIX,ZX.BarcodeFormat.CODE_128,ZX.BarcodeFormat.CODE_39,ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.PDF_417,ZX.BarcodeFormat.AZTEC]);
  hints.set(ZX.DecodeHintType.TRY_HARDER,true);
  _zxReader=new ZX.MultiFormatReader(); _zxReader.setHints(hints);
  return _zxReader;
}
function zxDecodeCanvas(ZX,canvas){
  const w=canvas.width,h=canvas.height;
  const d=canvas.getContext('2d').getImageData(0,0,w,h).data;
  const lum=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<lum.length;i++,j+=4) lum[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  const src=new ZX.RGBLuminanceSource(lum,w,h);
  const rd=zxReader(ZX);
  for(const inv of [false,true]){
    try{
      const bmp=new ZX.BinaryBitmap(new ZX.HybridBinarizer(inv?src.invert():src));
      const r=rd.decode(bmp);
      if(r&&r.getText()) return r.getText();
    }catch(e){}
  }
  return null;
}
async function decodeCanvas(canvas){
  const bd=await getBarcodeDetector();

}

/* Extrait le numéro de série d'un contenu de code : JSON Optepia, URL, GS1 (AI 21) ou texte brut */
function parseScanned(data){
  const out={};
  const t=String(data||'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001c]/g,'').trim();
  try{
    const obj=JSON.parse(t);
    if(obj && typeof obj==='object'){
      if(obj.numeroSerie) out.numero_serie=String(obj.numeroSerie);
      const map={designation:'designation',marque:'marque',identification:'identification',dateFabrication:'date_fabrication',datePremiereUtilisation:'date_premiere_utilisation',dateFinVie:'date_fin_vie'};
      Object.keys(map).forEach(k=>{ if(obj[k]) out[map[k]]=String(obj[k]); });
      if(out.numero_serie) return out;
    }
  }catch(e){}
  if(/^https?:\/\//i.test(t)){
    try{
      const u=new URL(t);
      for(const k of ['serial','sn','s','serie','serialnumber','numeroserie','numero_serie','numero','id']){
        for(const [pk,pv] of u.searchParams.entries()){ if(pk.toLowerCase()===k && pv){ out.numero_serie=pv; return out; } }
      }
    }catch(e){}
  }
  /* GS1 entre parenthèses : (01)GTIN(21)SERIE(10)LOT */
  let m=t.match(/\(21\)([^(\u001d]+)/);
  if(m){ out.numero_serie=m[1].trim(); return out; }
  /* GS1 brut : 01 + 14 chiffres + 21 + série (jusqu'au séparateur GS ou la fin) */
  m=t.match(/^\u001d?01\d{14}21([^\u001d]+)/);
  if(m){ out.numero_serie=m[1].trim(); return out; }
  out.numero_serie=t;
  return out;
}

    apply();
  });
  const up=e=>{
    const wasSingle = pts.size===1; pts.delete(e.pointerId); lastDist=0;

        const prev = pts.get(e.pointerId), cur = {x:e.clientX,y:e.clientY};
        if(pts.size===1){ px -= (cur.x-prev.x)/(base*z); py -= (cur.y-prev.y)/(base*z); }
        pts.set(e.pointerId, cur);
        if(pts.size===2){
          const [p1,p2] = [...pts.values()]; const d = Math.hypot(p1.x-p2.x, p1.y-p2.y);
          if(lastDist) z = Math.min(4, Math.max(1, z * d/lastDist));
          lastDist = d; zoom.value = z;
        }
        layout();
      });
      const up = e=>{ pts.delete(e.pointerId); lastDist = 0; };
      stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
      stage.addEventListener('wheel', e=>{ e.preventDefault(); z = Math.min(4, Math.max(1, z * (e.deltaY<0?1.08:0.93))); zoom.value = z; layout(); }, {passive:false});
      const close = v=>{ ov.remove(); resolve(v); };
      ov.querySelector('#cr-no').onclick = ()=>close(null);
      ov.querySelector('#cr-ok').onclick = ()=>{
        const s = base*z, srcW = Sw/s, srcH = Sh/s;
        const ow = Math.max(1, Math.min(900, Math.round(srcW))), oh = Math.max(1, Math.round(ow * srcH / srcW));
        const c = document.createElement('canvas'); c.width = ow; c.height = oh;
        c.getContext('2d').drawImage(img, px - srcW/2, py - srcH/2, srcW, srcH, 0, 0, ow, oh);
        close(c.toDataURL('image/jpeg', 0.7));
      };
    };
    img.src = url;
  });
}
async function pickPhotoCrop(cb){
  const f = await chooseImageSource('environment'); if(!f) return;

async function recropSource(dataUrl, path){
  if(dataUrl) return { url:dataUrl };
  const u = imgSrc(path); if(!u) return null;
  try{
    const r = await fetch(u); if(!r.ok) throw new Error('http');
    return { url: URL.createObjectURL(await r.blob()), revoke:true };
  }catch(e){ showToast('Impossible de recadrer cette photo : reprends-la avec « Changer la photo »'); return null; }
}

}
function toggleSortMode(){ state.sortMode = state.sortMode==='urgence' ? 'designation' : 'urgence'; render(); }
function onSearchInput(v){
  state.search = v;
  const el = document.getElementById('equip-results');
  if(el) el.innerHTML = renderListResults();
}
function renderListResults(){
  const q = state.search.toLowerCase();
  let items = state.equipment.filter(e=>{
    if(e.deleted_at) return false;
    if(q && !(`${e.designation} ${e.marque} ${e.numero_serie} ${e.identification}`.toLowerCase().includes(q))) return false;
    if(state.famFilter && (e.famille||'Sans famille')!==state.famFilter) return false;
    const busy = (e.loans||[]).some(l=>l.status==='en_cours'||l.status==='en_attente');
    if(state.availFilter==='out' && !busy) return false;
    if(state.availFilter==='free' && busy) return false;
    const lbl = statusOf(e).label, dfv = daysUntil(e.date_fin_vie);
    if(state.filter==='conforme') return statusOf(e).cls==='badge-ok';
    if(state.filter==='attention') return statusOf(e).cls==='badge-warn';
    if(state.filter==='horsService') return statusOf(e).cls==='badge-danger';
    if(state.filter==='depasse') return lbl==='Contrôle dépassé';
    if(state.filter==='jamais') return lbl==='Jamais contrôlé';
    if(state.filter==='proche') return lbl==='Contrôle proche';
    if(state.filter==='finvie') return lbl!=='Hors service' && lbl!=='Réformé' && dfv!==null && dfv>=0 && dfv<60;
    return true;
  }).slice().sort((a,b)=>{
    if(state.sortMode==='urgence'){
      const d = urgencyScore(a)-urgencyScore(b);
      if(d!==0) return d;
      return nextControlDueDays(a)-nextControlDueDays(b);
    }
    return (a.designation||'').localeCompare(b.designation||'');
  });
  if(items.length===0){
    return `<div class="empty"><h3>Aucun matériel</h3><p>${can('creerMateriel')?"Ajoute une première fiche depuis l'onglet « Ajouter ».":'Aucune fiche pour le moment.'}</p></div>`;
  }
  if(state.viewMode==='grouped' && !state.groupFilter){
    const groups = {};
    items.forEach(e=>{ const k=groupKey(e); (groups[k]=groups[k]||[]).push(e); });
    return Object.keys(groups).sort().map(k=>{
      const g = groups[k]; const first = g[0];
      const worst = g.some(e=>statusOf(e).cls==='badge-danger') ? 'badge-danger' : g.some(e=>statusOf(e).cls==='badge-warn') ? 'badge-warn' : 'badge-ok';
      const worstLabel = worst==='badge-danger'?'À vérifier':worst==='badge-warn'?'À surveiller':'Conforme';
      return `
      <div class="card tap" onclick="state.groupFilter='${k.replace(/'/g,"\\'")}'; render();">
        <div class="row">
          <div class="row" style="gap:12px;">
            ${first.photo_url?`<img class="thumb" src="${imgSrc(first.photo_url)}">`:`<div class="thumb"></div>`}
            <div>
              <div style="font-weight:600;font-size:15px;">${esc(first.designation)||'Sans désignation'}</div>
              <div class="muted">${esc(first.marque)||'—'}${first.famille?' · '+esc(first.famille):''}${first.sous_famille?' · '+esc(first.sous_famille):''}</div>
              ${(function(){ const n=g.filter(x=>(x.loans||[]).some(l=>l.status==='en_cours'||l.status==='en_attente')).length; return n?`<div style="font-size:12px;color:var(--warn);">${n} sorti${n>1?'s':''}</div>`:''; })()}
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--font-head);font-size:20px;font-weight:700;">${g.length}</div>
            <span class="badge ${worst}" style="margin-top:2px;">${worstLabel}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  if(state.groupFilter){
    const filtered = items.filter(e=>groupKey(e)===state.groupFilter);
    return `<div class="backlink" onclick="state.groupFilter=null; render();">‹ Retour aux types de matériel</div>` + filtered.map(renderEquipRow).join('');
  }
  return items.map(renderEquipRow).join('');
}

function renderLoanSection(e){

  if(current){

      </div>`).join('');
  }
  return html;
}

async function performTransfer(newOwnerUserId, name){

async function leaveUnit(){

    const otherAdmins = state.members.filter(m=>m.role==='administrateur' && m.id!==state.myMemberId).length;
    if(otherAdmins===0){

      return;

  const { error } = await sb.from('unit_members').delete().eq('id', state.myMemberId);
  if(error){ showToast(error.message); return; }
  state.unit=null; state.role=null; state.myMemberId=null; state.activeMembershipId=null;

async function changePassword(){
  const cur = document.getElementById('pw-current').value;
  const pw = document.getElementById('pw-new').value;
  const pw2 = document.getElementById('pw-confirm').value;
  if(!cur){ showToast('Saisis ton mot de passe actuel'); return; }
  if(!isStrongPw(pw)){ showToast('Le nouveau mot de passe ne respecte pas toutes les conditions'); return; }
  if(pw!==pw2){ showToast('Les mots de passe ne correspondent pas'); return; }
  if(pw===cur){ showToast("Le nouveau mot de passe doit être différent de l'actuel"); return; }
  state.busy=true; render();
  const { data: okCur, error: verifErr } = await sb.rpc('verify_current_password', { current_pw: cur });
  if(verifErr || okCur!==true){
    state.busy=false;
    showToast(verifErr ? verifErr.message : 'Mot de passe actuel incorrect');
    render(); return;
  }
  const { error } = await sb.auth.updateUser({ password: pw, current_password: cur });
  state.busy=false;
  if(error){ showToast(/current password|invalid.*password/i.test(error.message) ? 'Mot de passe actuel incorrect' : error.message); render(); return; }
  showToast('Mot de passe changé');
  render();
}

/* ---- Double authentification (2FA / TOTP) ---- */
async function refreshMfaFactors(){
  const { data } = await sb.auth.mfa.listFactors();
  state.mfaFactors = (data && data.totp) || [];
}
function renderMfaSection(){
  const verified = state.mfaFactors.find(f=>f.status==='verified');
  if(state.mfaEnroll){
    return `
    <div class="card">
      <h3 class="mfa-title" style="margin-bottom:10px;">Double authentification</h3>
      <p class="muted" style="font-size:12px;margin-bottom:10px;">Scanne ce code avec une application comme Google Authenticator ou Authy, puis saisis le code à 6 chiffres généré.</p>
      <div style="background:#fff;padding:12px;border-radius:8px;margin-bottom:10px;max-width:220px;">${state.mfaEnroll.qr_code}</div>
      <p class="mono muted" style="font-size:11px;margin-bottom:10px;word-break:break-all;">Code secret (si le scan ne fonctionne pas) : ${esc(state.mfaEnroll.secret)}</p>
      <div class="field"><input id="mfa-enroll-code" inputmode="numeric" maxlength="6" placeholder="123456" style="text-align:center;font-size:20px;letter-spacing:6px;"></div>
      <div class="btn-row">
        <button class="btn btn-primary" ${state.busy?'disabled':''} onclick="confirmMfaEnroll()">${state.busy?'<span class="spinner"></span>':'Activer'}</button>
        <button class="btn btn-secondary" onclick="cancelMfaEnroll()">Annuler</button>
      </div>
    </div>`;
  }
  return `
  <div class="card">
    <h3 class="mfa-title" style="margin-bottom:6px;">Double authentification</h3>
    <p class="muted" style="font-size:12px;margin-bottom:10px;">${verified?'Activée sur ce compte — un code sera demandé à chaque connexion.':'Optionnelle : ajoute un code à usage unique en plus du mot de passe à chaque connexion.'}</p>
    ${verified
      ? `<button class="btn btn-danger" ${state.busy?'disabled':''} onclick="disableMfa('${verified.id}')">${state.busy?'<span class="spinner"></span>':'Désactiver'}</button>`
      : `<button class="btn btn-secondary" ${state.busy?'disabled':''} onclick="startMfaEnroll()">${state.busy?'<span class="spinner"></span>':'Activer la double authentification'}</button>`}
  </div>`;
}
async function startMfaEnroll(){
  state.busy=true; render();
  const { data, error } = await sb.auth.mfa.enroll({ factorType:'totp' });
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  state.mfaEnroll = { factorId:data.id, qr_code:data.totp.qr_code, secret:data.totp.secret };
  render();
}
function cancelMfaEnroll(){
  if(state.mfaEnroll) sb.auth.mfa.unenroll({ factorId: state.mfaEnroll.factorId }).catch(()=>{});
  state.mfaEnroll = null;
  render();
}
async function confirmMfaEnroll(){
  const code = document.getElementById('mfa-enroll-code').value.trim();
  if(!code){ showToast('Saisis le code à 6 chiffres'); return; }
  state.busy=true; render();
  try{
    const { data: challenge, error: chErr } = await sb.auth.mfa.challenge({ factorId: state.mfaEnroll.factorId });
    if(chErr) throw chErr;
    const { error: verErr } = await sb.auth.mfa.verify({ factorId: state.mfaEnroll.factorId, challengeId: challenge.id, code });
    if(verErr) throw verErr;
    state.mfaEnroll = null;
    await refreshMfaFactors();
    showToast('Double authentification activée');
  }catch(err){ showToast(err.message || 'Code invalide'); }
  state.busy=false; render();
}
async function disableMfa(factorId){
  if(!confirm('Désactiver la double authentification sur ce compte ?')) return;
  state.busy=true; render();
  const { error } = await sb.auth.mfa.unenroll({ factorId });
  state.busy=false;
  if(error){ showToast(error.message); render(); return; }
  await refreshMfaFactors();
  render();
  showToast('Double authentification désactivée');
}

function parseCsvText(text){
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ';' || c === ',') { row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r[0]||'').trim()!=='');
}
function parseFlexibleDate(s){
  if(!s) return null;
  s = s.trim();
  if(!s) return null;
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    const [y,m,d] = s.split('-').map(Number);
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    const [d,m,y] = s.split('/').map(Number);
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return null;
}

let _catP = null;
function _catN(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/œ/g,'o').replace(/æ/g,'a').replace(/[^a-z0-9]+/g,''); }
function loadCatalogOnce(){
  if(_catP) return _catP;
  _catP = (async()=>{
    try{
      const { data, error } = await sb.from('equipment_catalog').select('id,marque,designation,famille,sous_famille,photo_path,fiche_path,fiche_url,duree_vie_ans').order('marque').order('designation').limit(5000);
      if(error) throw error;
      state.catalog = (data||[]).map(c=>Object.assign(c,{_nm:_catN(c.marque),_nd:_catN(c.designation)}));
    }catch(e){ state.catalog = []; _catP = null; }
    refreshCatalogMatch();
  })();
  return _catP;
}
function catalogMatches(des, mar){
  const nd=_catN(des), nm=_catN(mar), cat=state.catalog||[];
  if(nd.length<2) return {exact:null,list:[]};
  let exact = nm ? cat.find(c=>c._nm===nm && c._nd===nd) : null;
  if(!exact && !nm){ const u=cat.filter(c=>c._nd===nd); if(u.length===1) exact=u[0]; }
  const list = cat.filter(c=>c!==exact && (!nm || c._nm.includes(nm) || nm.includes(c._nm)) && (c._nd.includes(nd) || nd.includes(c._nd)))
    .sort((a,b)=>(b._nd.startsWith(nd)?1:0)-(a._nd.startsWith(nd)?1:0)).slice(0,5);
  return {exact,list};
}
function catSummary(c){
  const bits=[]; if(c.famille) bits.push(c.famille+(c.sous_famille?' › '+c.sous_famille:'')); if(c.photo_path) bits.push('photo'); if(c.fiche_path||c.fiche_url) bits.push('fiche technique');
  return bits.join(' · ');
}
function refreshCatalogMatch(){
  const box = document.getElementById('cat-match'); if(!box) return;
  if(!state.catalog){ loadCatalogOnce(); return; }
  if(!state.catalog.length){ box.innerHTML=''; return; }
  const d=(document.getElementById('f-designation')||{}).value, m=(document.getElementById('f-marque')||{}).value;
  const {exact,list} = catalogMatches(d,m);
  if(exact && equipDraft._catId===exact.id){ box.innerHTML = `<div class="qr-status ok" style="margin:-4px 0 6px;">✓ Données du catalogue appliquées</div><div class="muted" style="font-size:11px;margin:0 0 14px;line-height:1.4;">ℹ️ Aide au remplissage : la photo, la fiche et les données du catalogue sont indicatives. Vérifie qu'elles correspondent bien à ton matériel (modèle, version, taille) et à sa notice.</div>`; return; }
  let html='';
  if(exact) html += `<button type="button" class="btn btn-primary" style="margin:-4px 0 12px;flex-direction:column;gap:2px;text-align:left;align-items:flex-start;" onclick="useCatalog('${exact.id}')"><span>📚 Trouvé dans le catalogue — Utiliser</span><span style="font-size:12px;font-weight:500;opacity:.85;">${esc(exact.marque)} · ${esc(exact.designation)}${catSummary(exact)?' — '+esc(catSummary(exact)):''}</span></button>`;
  if(list.length) html += `<div class="muted" style="font-size:12px;margin:-2px 0 6px;">${exact?'Autres références proches':'Suggestions du catalogue'}</div>`+
    list.map(c=>`<button type="button" class="btn btn-secondary" style="margin:0 0 6px;justify-content:flex-start;text-align:left;gap:8px;" onclick="useCatalog('${c.id}')">📚 <span style="min-width:0;"><b>${esc(c.designation)}</b> <span class="muted" style="font-size:12px;">${esc(c.marque)}</span></span></button>`).join('');
  box.innerHTML = html ? `<div style="margin-bottom:12px;">${html}<div class="muted" style="font-size:11px;line-height:1.4;">ℹ️ Aide au remplissage : la photo, la fiche et les données du catalogue sont indicatives. Vérifie qu'elles correspondent bien à ton matériel (modèle, version, taille) et à sa notice.</div></div>` : '';
}

/* Fin de vie proposée : durée du catalogue, sinon règle Petzl (10 ans hors métal), à partir de la date de fabrication */
function autoFinVie(){
  if(!equipDraft.date_fabrication || equipDraft.date_fin_vie) return '';
  let n = equipDraft._catDuree || 0;
  if(!n){
    const marque=((document.getElementById('f-marque')||{}).value||equipDraft.marque||'');
    const fam=((document.getElementById('f-famille')||{}).value||equipDraft.famille||'').trim();

  }
  if(!n) return '';
  equipDraft.date_fin_vie = plusYears(equipDraft.date_fabrication, n);
  return ' · fin de vie '+fmtDate(equipDraft.date_fin_vie);
}

async function applySharedFile(id, field, label, logText){
  const e = state.equipment.find(x=>x.id===id); if(!e) return;
  const targets = identicalOf(e).filter(x=>x[field]!==e[field]);
  if(!targets.length) return;
  const n = targets.length, pl = n>1?'s':'';
  if(!confirm(`Appliquer la ${label} de « ${e.designation} » à ${n} fiche${pl} identique${pl} (même désignation et même marque) ?\n\nLeur ${label} actuelle sera remplacée et les anciens fichiers devenus inutiles seront supprimés pour libérer de l'espace.`)) return;
  const ids = targets.map(x=>x.id);
  const old = [...new Set(targets.map(x=>x[field]).filter(Boolean))];
  state.busy=true; render();
  try{
    const { error } = await sb.from('equipment').update({ [field]:e[field], updated_by:state.session.user.id, updated_by_name:state.myDisplayName, updated_at:new Date().toISOString() }).in('id', ids);
    if(error) throw error;
    /* supprime uniquement les fichiers que plus aucune fiche n'utilise */
    const stillUsed = new Set(state.equipment.filter(x=>!ids.includes(x.id)).flatMap(x=>[x.photo_url, x.fiche_technique_url]));
    const removable = old.filter(pth=>!stillUsed.has(pth) && !isExternalLink(pth) && !isCatRef(pth)).map(pth=>storagePathOf(pth)||pth);
    let removed = 0;
    if(removable.length){ const r = await sb.storage.from(BUCKET).remove(removable); if(!r.error) removed = removable.length; }
    await logAction(logText, e.designation);
    await refreshAll();
    showToast(`${label[0].toUpperCase()+label.slice(1)} appliquée à ${n} fiche${pl}${removed?` · ${removed} fichier${removed>1?'s':''} supprimé${removed>1?'s':''}`:''}`);
  }catch(err){ showToast(err.message); }
  state.busy=false; render();
}

/* Numéro de série Petzl récent : AAXnnnnn… → AA = année, X = mois (A=janvier … L=décembre) */
function petzlFabDate(serial){
  const m=String(serial||'').trim().toUpperCase().match(/^(\d{2})([A-L])\d/);
  if(!m) return null;
  const yy=parseInt(m[1],10), mo=m[2].charCodeAt(0)-64;
  if(yy<10||yy>new Date().getFullYear()%100+1) return null;
  return `20${m[1]}-${String(mo).padStart(2,'0')}-01`;
}
function applyScanned(data){

  if(/petzl/i.test(marque) && !equipDraft.date_fabrication){
    const d=petzlFabDate(p.numero_serie);
    if(d){ equipDraft.date_fabrication=d; extra=' · fabrication '+fmtDate(d); }
  }
  extra += autoFinVie();
  render();
  showToast('Numéro de série rempli : '+(p.numero_serie||'').slice(0,40)+extra);
}

async function validateLoanBatch(batchKey){
  const items = allLoans().filter(l=>(l.batch_id||l.id)===batchKey && l.status==='en_attente');
  const ids = items.map(l=>l.id);
  const { error } = await sb.from('loans').update({status:'en_cours'}).in('id', ids);
  if(error){ showToast(error.message); return; }
  await logAction('Prêt validé', `${items[0]?items[0].borrower_name:''} — ${items.length} article(s)`);
  await refreshAll(); if(state.view==='batchDetail') state.view='loans'; render();
  showToast('Prêt validé');
}
function rejectLoanBatch(batchKey){
  state.refuseBatch = { batchKey, from: state.view };
  state.view = 'refuseLoan'; render();
}

function filterCheckoutList(q){

function onCheckoutCheckboxChange(id, checked){

  if(checked && i<0) state.checkoutSelection.push(id);
  if(!checked && i>=0) state.checkoutSelection.splice(i,1);
  const n = state.checkoutSelection.length;
  const header = document.getElementById('co-count-header');
  if(header) header.textContent = `Sélectionner le matériel (${n} sélectionné${n!==1?'s':''})`;
  const btn = document.getElementById('co-submit-btn');
  if(btn && !state.busy) btn.textContent = `Confirmer (${n} article${n!==1?'s':''})`;

  if(type==='pret'){
    const etat = document.getElementById('br-etat').value;
    const restituePar = document.getElementById('br-restituePar').value.trim();
    if(!restituePar){ showToast('Nom requis'); return; }
    if(sigEmpty){ showToast('La signature est requise'); return; }
    const sigDataUrl = sigCanvas.toDataURL('image/png');
    state.busy=true; render();

/* ---------- Accueil (tableau de bord) ---------- */
function goFilter(f){ state.filter=f; state.famFilter=''; state.availFilter=''; state.search=''; state.groupFilter=null; state.view='list'; render(); }
function dashData(){
  const active = state.equipment.filter(e=>!e.deleted_at);
  const d = {total:active.length, conforme:0, depasse:0, jamais:0, proche:0, finvie:0, hs:0};
  active.forEach(e=>{
    const lbl = statusOf(e).label, dfv = daysUntil(e.date_fin_vie);
    if(lbl==='Hors service' || lbl==='Réformé') d.hs++;
    else {
      if(lbl==='Contrôle dépassé') d.depasse++; else if(lbl==='Jamais contrôlé') d.jamais++; else if(lbl==='Contrôle proche') d.proche++; else if(lbl==='Conforme') d.conforme++;
      if(dfv!==null && dfv>=0 && dfv<60) d.finvie++;
    }
  });
  const cur = groupLoansByBatch(allLoans().filter(l=>l.status==='en_cours'));
  d.batches = Object.keys(cur).map(k=>{ const first=cur[k][0]; const late = first.type==='pret' && first.expected_return_date && daysUntil(first.expected_return_date)<0; return {key:k, items:cur[k], first, late:!!late}; });
  d.pretsRetard = d.batches.filter(b=>b.late).length;
  d.pretsEnCours = d.batches.filter(b=>b.first.type==='pret').length;
  d.missions = d.batches.filter(b=>b.first.type==='mission').length;
  d.pendingLoans = can('validerPret') ? Object.keys(groupLoansByBatch(allLoans().filter(l=>l.status==='en_attente'))).length : 0;
  d.pendingChanges = can('validerModificationMateriel') ? state.changeRequests.length : 0;
  return d;
}
function renderHome(){
  const d = dashData();
  const rows = [
    {n:d.pendingLoans+d.pendingChanges, ico:'⚠', txt:'Validation(s) en attente', col:'var(--warn)', act:"goto('approvals')"},
    {n:d.pretsRetard, ico:'⏰', txt:'Prêt(s) en retard', col:'var(--danger)', act:"state.loanTab='pret'; goto('loans')"},
    {n:d.depasse, ico:'🔴', txt:'Contrôle(s) dépassé(s)', col:'var(--danger)', act:"goFilter('depasse')"},
    {n:d.hs, ico:'⛔', txt:'Hors service (fin de vie dépassée)', col:'var(--danger)', act:"goFilter('horsService')"},
    {n:d.jamais, ico:'🆕', txt:'Jamais contrôlé(s)', col:'var(--warn)', act:"goFilter('jamais')"},
    {n:d.proche, ico:'🔧', txt:'Contrôle(s) à faire sous 30 jours', col:'var(--warn)', act:"goFilter('proche')"},
    {n:d.finvie, ico:'⏳', txt:'Fin(s) de vie sous 60 jours', col:'var(--warn)', act:"goFilter('finvie')"}
  ].filter(r=>r.n>0);
  const cur = d.batches.slice().sort((a,b)=>(b.late-a.late) || (a.first.expected_return_date||'9999').localeCompare(b.first.expected_return_date||'9999')).slice(0,6);
  const actions = [
    can('gererPret') ? `<button class="btn btn-secondary" onclick="startCheckout('pret')">📤 Nouveau prêt</button>` : '',
    can('gererPret') ? `<button class="btn btn-secondary" onclick="startCheckout('mission')">🎯 Nouvelle mission</button>` : '',
    can('ajouterControle') ? `<button class="btn btn-secondary" onclick="startBatchControl()">✔ Contrôle groupé</button>` : '',
    can('creerMateriel') ? `<button class="btn btn-secondary" onclick="startAddEquip()">➕ Ajouter du matériel</button>` : '',
    `<button class="btn btn-secondary" onclick="goto('export')">📥 Export</button>`
  ].filter(Boolean);
  const tile = (n,l)=>`<div class="card" style="flex:1;min-width:0;text-align:center;padding:12px 6px;margin:0;"><div style="font-family:var(--font-head);font-size:24px;font-weight:700;">${n}</div><div class="muted" style="font-size:11px;">${l}</div></div>`;
  return `
  <h2>Accueil</h2>
  <p class="muted" style="margin-bottom:14px;">${esc(state.unit.name)} · ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</p>
  <div style="display:flex;gap:8px;margin-bottom:16px;">${tile(d.total,'Matériel')}${tile(d.conforme,'Conformes')}${tile(d.pretsEnCours,'En prêt')}${tile(d.missions,'En mission')}</div>
  <h3 style="margin-bottom:10px;">À traiter</h3>
  ${rows.length===0?`<div class="card" style="border-color:var(--ok);"><b style="color:var(--ok);">✅ Tout est conforme</b><p class="muted" style="font-size:13px;margin-top:4px;">Aucun contrôle, prêt ou validation en attente de ta part.</p></div>`
    : rows.map(r=>`<div class="card tap" style="margin-bottom:8px;" onclick="${r.act}"><div class="row"><div style="display:flex;align-items:center;gap:10px;"><span style="font-family:var(--font-head);font-size:22px;font-weight:700;color:${r.col};min-width:28px;">${r.n}</span><span style="font-size:14px;">${r.ico} ${r.txt}</span></div><span class="muted">›</span></div></div>`).join('')}
  <h3 style="margin:20px 0 10px;">En cours</h3>
  ${cur.length===0?'<p class="muted">Aucun prêt ni mission en cours.</p>':cur.map(b=>`
    <div class="card tap" style="margin-bottom:8px;" onclick="openBatchDetail('${b.key}','${b.first.type}')">
      <div class="row" style="align-items:flex-start;">
        <div>
          <div style="font-weight:600;">${b.first.type==='mission'?'🎯':'📤'} ${esc(b.first.borrower_name)}</div>
          <div class="muted" style="font-size:12px;">${b.items.length} article${b.items.length>1?'s':''} · depuis le ${fmtDT(b.first.checkout_date,b.first.checkout_at)}${b.first.expected_return_date?' · retour prévu '+fmtDate(b.first.expected_return_date):''}</div>
        </div>
        ${b.late?'<span class="badge badge-danger">En retard</span>':''}
      </div>
    </div>`).join('')}
  ${d.batches.length>cur.length?`<button class="btn btn-ghost" onclick="goto('loans')">Voir tout (${d.batches.length}) ›</button>`:''}
  <h3 style="margin:20px 0 10px;">Actions rapides</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;">${actions.join('')}</div>
  `;
}

/* ---------- Fiche de prêt / sortie imprimable ---------- */
function openLoanSheet(batchKey,type){ state.sheet={key:batchKey,type}; state.view='loanSheet'; render(); window.scrollTo(0,0); }
function renderLoanSheet(){
  const {key,type} = state.sheet||{};
  const items = allLoans().filter(l=>(l.batch_id||l.id)===key && l.type===type);
  if(items.length===0) return `<div class="backlink" onclick="goto('loans')">‹ Retour</div><div class="empty">Introuvable.</div>`;
  const f = items[0], isPret = type==='pret';
  const statut = f.status==='en_attente'?'En attente de validation':f.status==='en_cours'?'En cours':f.status==='refuse'?'Refusé':(isPret?'Restitué':'Rentré');
  const sig = (u)=>u?`<img src="${imgSrc(u)}" onerror="imgFallback(this)" style="height:70px;max-width:100%;border:1px solid #bbb;border-radius:4px;background:#fff;">`:'<span style="color:#888;">—</span>';
  const now = new Date();
  const row = (k,v)=>`<tr><th style="width:38%;">${k}</th><td>${v}</td></tr>`;
  return `
  <div class="noprint">
    <div class="backlink" onclick="state.view='batchDetail'; render();">‹ Retour</div>
    <button class="btn btn-primary" style="margin-bottom:14px;" onclick="window.print()">🖨 Imprimer / Enregistrer en PDF</button>
    <p class="muted" style="font-size:12px;margin-bottom:12px;">Dans la fenêtre d'impression, choisis « Enregistrer au format PDF » pour obtenir un fichier.</p>
  </div>
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0A9FA0;padding-bottom:8px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:12px;"><img src="logo-mark.png" alt="" style="height:38px;width:auto;"><div><div style="font-size:19px;font-weight:700;letter-spacing:2px;">OPTEPIA</div><div style="color:#555;">${esc(state.unit.name)}</div></div></div>
      <div style="text-align:right;color:#555;font-size:12px;">Édité le ${now.toLocaleDateString('fr-FR')} à ${now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}<br>par ${esc(state.myDisplayName)}</div>
    </div>
    <h1 style="font-size:18px;margin:0 0 12px;">${isPret?'Fiche de prêt de matériel':'Fiche de sortie en mission'}</h1>
    <table class="sheet-t">
      ${row(isPret?'Emprunteur':'Mission / responsable', `<b>${esc(f.borrower_name)}</b>`)}
      ${row(isPret?'Perception':'Sortie', esc(fmtDT(f.checkout_date,f.checkout_at)).replace('&nbsp;',' '))}
      ${f.expected_return_date?row('Retour prévu', fmtDate(f.expected_return_date)):''}
      ${row('Enregistré par', esc(f.created_by_name||'—'))}
      ${row('Statut', statut)}
      ${f.status==='refuse'?row('Motif du refus', esc(f.refusal_reason||'—')):''}
    </table>
    <h3 style="color:#111;font-size:14px;margin:16px 0 6px;">Matériel (${items.length})</h3>
    <table class="sheet-t">
      <tr><th style="width:28px;">#</th><th>Désignation</th><th>Marque</th><th>N° de série</th><th>Identification</th></tr>
      ${items.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l._equip.designation)}</td><td>${esc(l._equip.marque||'')}</td><td>${esc(l._equip.numero_serie||'')}</td><td>${esc(l._equip.identification||'')}</td></tr>`).join('')}
    </table>
    <div style="display:flex;gap:16px;margin-top:18px;">
      <div style="flex:1;"><div style="font-weight:700;margin-bottom:6px;">Signature à la ${isPret?'perception':'sortie'}</div>${sig(f.checkout_signature_url)}</div>
      ${f.status==='restitue'?`<div style="flex:1;"><div style="font-weight:700;margin-bottom:6px;">Signature au ${isPret?'retour':'retour de mission'}</div>${sig(f.return_signature_url)}</div>`:''}
    </div>
    ${f.status==='restitue'?`
    <h3 style="color:#111;font-size:14px;margin:18px 0 6px;">${isPret?'Restitution':'Retour de mission'}</h3>
    <table class="sheet-t">
      ${row(isPret?'Restitué le':'Rentré le', esc(fmtDT(f.return_date,f.returned_at)))}
      ${isPret&&f.return_condition?row('État au retour', f.return_condition==='endommage'?'Endommagé':f.return_condition==='reserve'?'Avec réserve':'Bon état'):''}
      ${f.returned_by_name?row('Restitué par', esc(f.returned_by_name)):''}
    </table>`:''}
    <p style="color:#888;font-size:11px;margin-top:22px;">Document généré par Optepia — registre du matériel. Identifiant du dossier : ${esc(String(key).slice(0,8))}</p>
  </div>`;
}

/* ---------- Contrôle groupé ---------- */
function startBatchControl(){
  state.bc = { sel:{}, date:new Date().toISOString().slice(0,10), verif:state.myDisplayName, obs:'' };
  state.view='batchControl'; render(); window.scrollTo(0,0);
}
function renderBatchControl(){
  const bc = state.bc;
  const list = state.equipment.filter(e=>!e.deleted_at && statusOf(e).label!=='Hors service' && statusOf(e).label!=='Réformé')
    .slice().sort((a,b)=> (urgencyScore(a)-urgencyScore(b)) || (a.designation||'').localeCompare(b.designation||''));
  const n = Object.keys(bc.sel).length;
  return `
  <div class="backlink" onclick="goto('list')">‹ Annuler</div>
  <h2>Contrôle groupé</h2>
  <p class="muted" style="margin-bottom:16px;">Contrôle plusieurs matériels d'un coup, avec une seule signature. Le statut peut être ajusté matériel par matériel.</p>
  <div class="card">
    <div class="field"><label>Date du contrôle</label><input id="bc-date" type="date" value="${bc.date}" oninput="state.bc.date=this.value"></div>
    <div class="field"><label>Nom du vérificateur</label><input id="bc-verif" value="${esc(bc.verif)}" oninput="state.bc.verif=this.value"></div>
    <div class="field"><label>Observations (communes, optionnelles)</label><textarea id="bc-obs" placeholder="Points relevés…" oninput="state.bc.obs=this.value">${esc(bc.obs)}</textarea></div>
    <div class="field"><label>Signature du vérificateur</label>
      <canvas id="sigpad" class="sigpad"></canvas>
      <button class="btn btn-ghost" style="width:auto;margin-top:6px;" onclick="clearSignature()">Effacer la signature</button>
    </div>
  </div>
  <h3 id="bc-count" style="margin-bottom:10px;">Matériel à contrôler (${n} sélectionné${n!==1?'s':''})</h3>
  <div class="field"><input id="bc-search" type="search" placeholder="Rechercher (désignation, marque, n° série, identification)…" oninput="bcFilter()"></div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <button class="chip" id="bc-need" onclick="bcToggleNeed()">Seulement ceux à contrôler</button>
    <button class="chip" onclick="bcSelectVisible()">Tout sélectionner (visibles)</button>
    <button class="chip" onclick="bcClear()">Tout désélectionner</button>
  </div>
  ${list.length===0?'<p class="muted">Aucun matériel.</p>':list.map(e=>{ const st=statusOf(e); const need = st.cls!=='badge-ok'; return `
    <div class="card bc-item" data-id="${e.id}" data-need="${need?1:0}" data-q="${esc(((e.designation||'')+' '+(e.marque||'')+' '+(e.numero_serie||'')+' '+(e.identification||'')).toLowerCase())}">
      <div class="row" style="align-items:flex-start;gap:10px;">
        <label style="display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer;">
          <input type="checkbox" onchange="bcToggle('${e.id}',this.checked)" style="width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--accent);">
          <div style="min-width:0;">
            <div style="font-weight:600;font-size:14px;">${esc(e.designation)||'Sans désignation'}${e.marque?' <span class="muted" style="font-weight:400;">· '+esc(e.marque)+'</span>':''}</div>
            <div class="mono muted" style="font-size:12px;">${equipIds(e)||'—'}</div>
            <span class="badge ${st.cls}" style="margin-top:4px;">${st.label}</span>
          </div>
        </label>
        <select id="bc-st-${e.id}" onchange="bcStatut('${e.id}',this.value)" style="flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px;font-size:12px;">
          <option value="conforme">Conforme</option><option value="reserve">Avec réserve</option><option value="reforme">Réformé</option>
        </select>
      </div>
    </div>`; }).join('')}
  <button id="bc-submit" class="btn btn-primary" style="margin:16px 0 48px;" onclick="saveBatchControl()">Enregistrer ${n} contrôle${n!==1?'s':''}</button>
  `;
}
function bcUpdateCount(){
  const n = Object.keys(state.bc.sel).length;
  const h = document.getElementById('bc-count'); if(h) h.textContent = `Matériel à contrôler (${n} sélectionné${n!==1?'s':''})`;
  const b = document.getElementById('bc-submit'); if(b) b.textContent = `Enregistrer ${n} contrôle${n!==1?'s':''}`;
}
function bcToggle(id,checked){
  if(checked){ const sel=document.getElementById('bc-st-'+id); state.bc.sel[id] = sel?sel.value:'conforme'; } else delete state.bc.sel[id];
  bcUpdateCount();
}
function bcStatut(id,v){ if(state.bc.sel[id]!==undefined) state.bc.sel[id]=v; }
function bcFilter(){
  const q = ((document.getElementById('bc-search')||{}).value||'').toLowerCase().trim();
  const need = state.bc.needOnly;
  document.querySelectorAll('.bc-item').forEach(el=>{
    const ok = (!q || (el.dataset.q||'').includes(q)) && (!need || el.dataset.need==='1');
    el.style.display = ok ? '' : 'none';
  });
}
function bcToggleNeed(){
  state.bc.needOnly = !state.bc.needOnly;
  const b = document.getElementById('bc-need'); if(b) b.classList.toggle('active', !!state.bc.needOnly);
  bcFilter();
}
function bcSetChecked(el,on){
  const cb = el.querySelector('input[type=checkbox]'); if(!cb) return;
  if(cb.checked!==on){ cb.checked=on; bcToggle(el.dataset.id,on); }
}
function bcSelectVisible(){ document.querySelectorAll('.bc-item').forEach(el=>{ if(el.style.display!=='none') bcSetChecked(el,true); }); }
function bcClear(){ document.querySelectorAll('.bc-item').forEach(el=>bcSetChecked(el,false)); }
async function saveBatchControl(){
  const bc = state.bc, ids = Object.keys(bc.sel);
  if(ids.length===0){ showToast('Sélectionne au moins un matériel'); return; }
  if(!bc.date || !(bc.verif||'').trim()){ showToast('Date et vérificateur obligatoires'); return; }
  if(sigEmpty){ showToast('La signature du vérificateur est requise'); return; }
  const btn = document.getElementById('bc-submit'); if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  try{
    const sigUrl = await uploadImage(sigCanvas.toDataURL('image/png'), `${state.unit.id}/controls/${uid()}-sig.png`);
    const rows = ids.map(id=>({
      equipment_id:id, unit_id:state.unit.id, date:bc.date,
      verificateur_id:state.session.user.id, verificateur_name:bc.verif.trim(),
      statut:bc.sel[id], observations:(bc.obs||'').trim(), photo_url:null, signature_url:sigUrl
    }));
    const { error } = await sb.from('controls').insert(rows);
    if(error) throw error;
    await refreshAll(); state.bc=null; state.view='list'; render();
    showToast(`${rows.length} contrôle${rows.length>1?'s':''} enregistré${rows.length>1?'s':''}`);
  }catch(err){
    showToast(err.message);
    const b2 = document.getElementById('bc-submit'); if(b2){ b2.disabled=false; bcUpdateCount(); }
  }
}

/* ---------- Post-render wiring ---------- */
function afterRender(){
  if(state.view==='auth' && typeof turnstile==='undefined' && !window.__tsRetry){ window.__tsRetry=setTimeout(function(){ window.__tsRetry=null; if(typeof turnstile!=='undefined') afterRender(); },800); }
  if(state.view==='auth' && (state.authMode==='signup' || state.authMode==='login' || state.authMode==='forgot') && typeof turnstile!=='undefined'){
    const el = document.querySelector('.cf-turnstile');
    if(el && !el.dataset.rendered){
      el.dataset.rendered='1';
      turnstile.render(el, { sitekey: TURNSTILE_SITE_KEY, theme:'dark',
        callback: function(token){ turnstileToken = token; },
        'expired-callback': function(){ turnstileToken = null; },
        'error-callback': function(code){ turnstileToken = null; showToast('Captcha Cloudflare (widget) : erreur ' + code + ' — vérifie le nom de domaine autorisé dans Turnstile'); return true; } });
    }
  }
  if(state.view==='batchControl' || state.view==='addControl' || state.view==='loanOut' || state.view==='loanReturn' || state.view==='checkout' || state.view==='batchReturn'){
    sigCanvas = document.getElementById('sigpad');
    if(sigCanvas){
      const ratio = window.devicePixelRatio||1; const rect = sigCanvas.getBoundingClientRect();
      sigCanvas.width = rect.width*ratio; sigCanvas.height = rect.height*ratio;
      sigCtx = sigCanvas.getContext('2d'); sigCtx.scale(ratio,ratio);
      sigCtx.strokeStyle='#1a1a1a'; sigCtx.lineWidth=2.2; sigCtx.lineCap='round';
      sigEmpty=true; let last=null;
      const pos = (ev)=>{ const r=sigCanvas.getBoundingClientRect(); const p=ev.touches?ev.touches[0]:ev; return {x:p.clientX-r.left,y:p.clientY-r.top}; };
      const start=(ev)=>{ ev.preventDefault(); sigDrawing=true; last=pos(ev); };
      const move=(ev)=>{ if(!sigDrawing) return; ev.preventDefault(); const p=pos(ev); sigCtx.beginPath(); sigCtx.moveTo(last.x,last.y); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); last=p; sigEmpty=false; };
      const end=()=>{ sigDrawing=false; };
      sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      sigCanvas.addEventListener('touchstart', start, {passive:false}); sigCanvas.addEventListener('touchmove', move, {passive:false}); sigCanvas.addEventListener('touchend', end);
    }
  }
}
window.addEventListener('error', function(e){
  console.error('Erreur registre matériel:', e.error||e.message);
  if(state.view==='loading'){ state.loadError = e.message||'Erreur JavaScript au chargement.'; state.view='error'; render(); }
});
/* ---- Déconnexion automatique après inactivité ---- */
const INACTIVITY_LIMIT_MS = 2 * 60 * 60 * 1000; // 2 heures
let lastActivityAt = Date.now();
['click','keydown','touchstart','mousemove','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ lastActivityAt = Date.now(); }, {passive:true});
});
setInterval(()=>{
  if(state.session && Date.now() - lastActivityAt > INACTIVITY_LIMIT_MS){
    doLogout();
  }
}, 60000);

if(sb) init();
</script>
